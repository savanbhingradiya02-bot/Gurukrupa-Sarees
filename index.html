  // ===== DRAW / COVER-UP TOOL =====

  var DRAW_COLORS = ['#3fa9f5', '#000000', '#ffffff', '#e05c5c', '#34a853', '#fdd663'];

  function openDrawTool(photoIdx){
    var photo = state.bookPhotos[photoIdx];
    if(!photo) return;

    document.getElementById('modalHost').innerHTML =
      '<div class="modal-overlay" style="padding:0;">' +
        '<div class="draw-modal-box">' +
          '<div class="draw-header"><h2>Cover unwanted text</h2><button class="draw-close-btn" id="drawCloseBtn">\u00d7</button></div>' +
          '<div class="draw-canvas-wrap"><canvas id="drawCanvas"></canvas></div>' +
          '<div class="draw-controls">' +
            '<div class="draw-colors" id="drawColors"></div>' +
            '<div class="draw-actions">' +
              '<button class="btn-draw-undo" id="drawUndoBtn">Undo</button>' +
              '<button class="btn-draw-cancel" id="drawCancelBtn">Cancel</button>' +
              '<button class="btn-draw-done" id="drawDoneBtn">Done</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var colorsHost = document.getElementById('drawColors');
    var currentColor = DRAW_COLORS[0];
    DRAW_COLORS.forEach(function(c, i){
      var sw = document.createElement('button');
      sw.className = 'draw-color-swatch' + (i===0?' active':'');
      sw.style.background = c;
      sw.addEventListener('click', function(){
        currentColor = c;
        document.querySelectorAll('.draw-color-swatch').forEach(function(s){ s.classList.remove('active'); });
        sw.classList.add('active');
      });
      colorsHost.appendChild(sw);
    });

    var canvas = document.getElementById('drawCanvas');
    var ctx = canvas.getContext('2d');
    var img = new Image();
    var strokes = [];
    var currentStroke = null;
    var drawing = false;

    function redraw(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      strokes.forEach(function(s){ paintStroke(s); });
    }

    function paintStroke(s){
      if(s.points.length < 1) return;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = Math.max(canvas.width, canvas.height) * 0.045;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i].x, s.points[i].y); }
      if(s.points.length === 1){ ctx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1); }
      ctx.stroke();
    }

    function getCanvasPoint(e){
      var rect = canvas.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDraw(e){
      e.preventDefault();
      drawing = true;
      currentStroke = { color: currentColor, points: [getCanvasPoint(e)] };
      strokes.push(currentStroke);
      paintStroke(currentStroke);
    }
    function moveDraw(e){
      if(!drawing) return;
      e.preventDefault();
      currentStroke.points.push(getCanvasPoint(e));
      redraw();
    }
    function endDraw(e){
      drawing = false;
      currentStroke = null;
    }

    img.onload = function(){
      canvas.width = img.width;
      canvas.height = img.height;
      redraw();
    };
    img.src = photo.previewUrl;

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    document.getElementById('drawCloseBtn').addEventListener('click', closeModal);
    document.getElementById('drawCancelBtn').addEventListener('click', closeModal);
    document.getElementById('drawUndoBtn').addEventListener('click', function(){
      strokes.pop();
      redraw();
    });
    document.getElementById('drawDoneBtn').addEventListener('click', function(){
      document.removeEventListener('keydown', drawEnterHandler);
      canvas.toBlob(function(blob){
        if(!blob){ showToast('Could not save the edit \u2014 try again'); return; }
        var newUrl = URL.createObjectURL(blob);
        state.bookPhotos[photoIdx].blob = blob;
        state.bookPhotos[photoIdx].previewUrl = newUrl;
        closeModal();
        render();
        showToast('Photo updated');
      }, 'image/jpeg', 0.85);
    });

    var drawEnterHandler = function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        document.getElementById('drawDoneBtn').click();
      }
    };
    document.addEventListener('keydown', drawEnterHandler);
    document.getElementById('drawCloseBtn').addEventListener('click', function(){ document.removeEventListener('keydown', drawEnterHandler); });
    document.getElementById('drawCancelBtn').addEventListener('click', function(){ document.removeEventListener('keydown', drawEnterHandler); });
  }

  function renderLogin(){
    var html = '<div class="login-screen"><div class="login-wrap"><div class="login-brand">GURUKRUPA</div><div class="login-brand-sub">SAREES</div>';

  function wireLogin(){
    document.getElementById('loginBtn').addEventListener('click', function(){
      var email = document.getElementById('loginEmail').value.trim();
      var pw = document.getElementById('loginPassword').value;
      if(!email || !pw){ state.loginError = 'Enter email and password'; render(); return; }
      login(email, pw);
    });
    ['loginEmail','loginPassword'].forEach(function(id){
      document.getElementById(id).addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          document.getElementById('loginBtn').click();
        }
      });
    });
    document.getElementById('loginEmail').addEventListener('input', function(){ state.loginEmailVal = this.value; });
    document.getElementById('forgotPasswordBtn').addEventListener('click', async function(){
      var email = (document.getElementById('loginEmail').value || '').trim();
      if(!email){ state.loginError = 'Enter your email above first, then tap Forgot password'; render(); return; }
      state.loginError = '';
      this.disabled = true; this.textContent = 'Sending...';
      try{
        var { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
        if(error) throw error;
        state.forgotPasswordSent = true;
        render();
      }catch(e){
        state.loginError = e && e.message ? e.message : 'Could not send reset link';
        render();
      }
    });

  function wireBookTab(){
    refreshGlobalDatalists();

    document.getElementById('addPhotoBtn') && document.getElementById('addPhotoBtn').addEventListener('click', function(){
      document.getElementById('fileInput').click();
    });
    document.getElementById('fileInput') && document.getElementById('fileInput').addEventListener('change', async function(e){
      var files = Array.prototype.slice.call(e.target.files || []);
      if(files.length === 0) return;
      state.bookError = '';
      state.processing = true;
      render();
      try{
        var slice = files.slice(0, 50 - state.bookPhotos.length);
        var blobs = await Promise.all(slice.map(function(f){ return resizeImageToBlob(f, 900); }));
        var withPreview = blobs.map(function(b){ return { blob: b, previewUrl: URL.createObjectURL(b), shopVal: '', sizeVal: '' }; });
        state.bookPhotos = state.bookPhotos.concat(withPreview).slice(0,50);
      }catch(err){
        state.bookError = 'Could not process a photo: ' + (err && err.message ? err.message : 'unknown error');
      }
      state.processing = false;
      render();
    });
    document.querySelectorAll('.photo-remove').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        state.bookPhotos.splice(idx, 1);
        render();
      });
    });
    document.querySelectorAll('.photo-cover-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        openDrawTool(idx);
      });
    });
    document.querySelectorAll('.photoShopInput').forEach(function(inp){
      inp.addEventListener('input', function(){
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        if(state.bookPhotos[idx]) state.bookPhotos[idx].shopVal = inp.value;
      });
      inp.addEventListener('blur', function(){
        tryAutocomplete(inp, state.shops);
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        if(state.bookPhotos[idx]) state.bookPhotos[idx].shopVal = inp.value;
      });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          tryAutocomplete(inp, state.shops);
          var idx = inp.getAttribute('data-idx');
          if(state.bookPhotos[idx]) state.bookPhotos[idx].shopVal = inp.value;
          var sizeField = document.querySelector('.photoSizeInput[data-idx="' + idx + '"]');
          if(sizeField) sizeField.focus();
        }
      });
    });
    document.querySelectorAll('.photoSizeInput').forEach(function(inp){
      inp.addEventListener('input', function(){
        var idx = parseInt(inp.getAttribute('data-idx'), 10);
        if(state.bookPhotos[idx]) state.bookPhotos[idx].sizeVal = inp.value;
      });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          tryAutocomplete(inp, state.sizes || []);
          var idx = parseInt(inp.getAttribute('data-idx'), 10);
          if(state.bookPhotos[idx]) state.bookPhotos[idx].sizeVal = inp.value;
          if(isReseller()){
            // Resellers don't have per-photo shop fields or a name field —
            // go straight to the next size field, or Address once done.
            var nextSize = document.querySelector('.photoSizeInput[data-idx="' + (idx+1) + '"]');
            if(nextSize){ nextSize.focus(); }
            else{
              var addrField = document.getElementById('addressInput');
              if(addrField) addrField.focus();
            }
            return;
          }
          var nextShop = document.querySelector('.photoShopInput[data-idx="' + (idx+1) + '"]');
          if(nextShop){ nextShop.focus(); }
          else{
            var nameField = document.getElementById('nameInput');
            if(nameField) nameField.focus();
          }
        }
      });
    });
    var nameInput = document.getElementById('nameInput');
    var courierInput = document.getElementById('courierInput');
    var addressInput = document.getElementById('addressInput');
    if(addressInput) addressInput.addEventListener('input', function(){ state.addressVal = addressInput.value; });
    if(nameInput) nameInput.addEventListener('input', function(){ state.nameVal = nameInput.value; });
    if(courierInput) courierInput.addEventListener('input', function(){ state.courierVal = courierInput.value; });
    if(nameInput) nameInput.addEventListener('blur', function(){
      tryAutocomplete(nameInput, state.resellers);
      state.nameVal = nameInput.value;
    });
    if(courierInput) courierInput.addEventListener('blur', function(){
      tryAutocomplete(courierInput, state.couriers || []);
      state.courierVal = courierInput.value;
    });
    if(nameInput) nameInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        tryAutocomplete(nameInput, state.resellers);
        state.nameVal = nameInput.value;
        if(courierInput) courierInput.focus();
      }
    });
    if(courierInput) courierInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        tryAutocomplete(courierInput, state.couriers || []);
        state.courierVal = courierInput.value;
        if(addressInput) addressInput.focus();
      }
    });
    if(addressInput) addressInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        state.addressVal = addressInput.value;
        var btn = document.getElementById('saveOrderBtn');
        if(btn) btn.click();
      }
      // Shift+Enter still inserts a normal line break for multi-line addresses.
    });

    var saveBtn = document.getElementById('saveOrderBtn');

    var urgentChk = document.getElementById('urgentChk');
    if(urgentChk) urgentChk.addEventListener('change', function(){
      state.urgentVal = urgentChk.checked;
      render();
      var d = document.getElementById('urgentDaysInput');
      if(d) d.focus();
    });
    var urgentDaysInput = document.getElementById('urgentDaysInput');
    if(urgentDaysInput) urgentDaysInput.addEventListener('input', function(){ state.urgentDaysVal = urgentDaysInput.value; });

    document.querySelectorAll('.recentThumb').forEach(function(img){
      img.addEventListener('click', function(){ openZoom(img.getAttribute('data-src')); });
    });

    saveBtn && saveBtn.addEventListener('click', async function(){
      // Resolve any partial typing (e.g. "1191") to the full matching entry
      // one more time right before validating, in case Save was clicked
      // without the field ever losing focus.
      if(nameInput) tryAutocomplete(nameInput, state.resellers);
      if(courierInput) tryAutocomplete(courierInput, state.couriers || []);
      document.querySelectorAll('.photoShopInput').forEach(function(inp){ tryAutocomplete(inp, state.shops); });

      var name = (nameInput ? nameInput.value : state.nameVal || '').trim();
      var address = (state.addressVal || '').trim();
      var courier = (courierInput ? courierInput.value : state.courierVal || '').trim();
      state.nameVal = name;
      state.courierVal = courier;

      if(isReseller()){
        // Reseller portal: name comes from the account, courier and shop are
        // internal details the admin fills later.
        name = state.myResellerName;
        courier = '';
        state.bookPhotos.forEach(function(p){ if(!(p.shopVal||'').trim()){ p.shopVal = 'Name Pending'; } });
      }

      if(state.bookPhotos.length === 0){ state.bookError = 'Add at least one photo'; render(); return; }
      if(!name){ state.bookError = 'Select a reseller'; render(); return; }
      if(!isReseller()){
        if(!isExactListMatch(name, state.resellers)){ state.bookError = 'Reseller "' + name + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'; render(); return; }
        if(!isExactListMatch(courier, state.couriers || [])){ state.bookError = 'Courier "' + courier + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'; render(); return; }
        var badShop = null;
        state.bookPhotos.forEach(function(p, i){
          if(badShop) return;
          if(!(p.shopVal||'').trim()){ badShop = { idx: i, val: '(empty)' }; }
          else if(!isExactListMatch(p.shopVal, state.shops)){ badShop = { idx: i, val: p.shopVal }; }
        });
        if(badShop){ state.bookError = 'Pick a shop for photo ' + (badShop.idx+1) + ' \u2014 use "Name Pending" if you don\u2019t know it yet'; render(); return; }
      }
      if(!address){ state.bookError = 'Enter delivery address'; render(); return; }
      if(state.urgentVal && !(parseInt(state.urgentDaysVal, 10) >= 1)){ state.bookError = 'Urgent order \u2014 enter how many days for delivery'; render(); return; }
      state.bookError = '';
      state.saving = true;
      render();
      try{
        var newOrder = await saveOrder(name, courier, address, state.bookPhotos, function(done, total){
          var liveBtn = document.getElementById('saveOrderBtn');
          if(liveBtn){ liveBtn.innerHTML = '<span class="spinner-sm"></span>Saving photo ' + done + ' of ' + total + '\u2026'; }
        });
        showToast('Order #' + newOrder.id + ' saved');
        // Add to local state instantly — no full reload needed
        state.orders.unshift(newOrder);
        addToLocalList(state.resellers, name);
        addToLocalList(state.couriers, courier);
        newOrder.items.forEach(function(it){
          addToLocalList(state.shops, it.shop_name);
          addToLocalList(state.sizes, it.size);
        });
        state.bookPhotos = [];
        state.nameVal = ''; state.courierVal = ''; state.addressVal = '';
        state.urgentVal = false; state.urgentDaysVal = '';
        state.saving = false;
        if(!isReseller()){ state.tab = 'orders'; }
        render();
      }catch(err){
        state.bookError = 'Could not save: ' + (err && err.message ? err.message : String(err));
        state.saving = false;
        render();
      }
    });
  }

  // ===== ORDERS TAB =====

  function getFilteredOrders(){
    return state.orders.filter(function(o){
      var ds = orderDisplayStatus(o);
      var matchesFilter = state.filter === 'all' ? true : (state.filter === 'pending' ? (ds === 'pending' || ds === 'partial') : ds === state.filter);
      var itemShops = (o.items||[]).map(function(it){ return it.shop_name || ''; }).join(' ');
      var itemSizes = (o.items||[]).map(function(it){ return it.size || ''; }).join(' ');
      var hay = (o.reseller_name+' '+o.address+' '+o.id+' '+(o.courier||'')+' '+(o.cancel_reason||'')+' '+itemShops+' '+itemSizes).toLowerCase();
      var matchesQuery = state.query.trim() === '' || hay.indexOf(state.query.trim().toLowerCase()) !== -1;
      return matchesFilter && matchesQuery;
    });
  }

  function renderOrderCardsHtml(filtered){
    var html = '';
    if(filtered.length === 0){
      html += '<div class="empty-state">' + (state.orders.length===0 ? 'No orders yet. Book your first order.' : 'No orders match.') + '</div>';
    }
    var q = state.query;
    var statusLabel = { pending: 'Pending', shipped: 'Shipped', cancelled: 'Cancelled', partial: 'Partial' };
    var statusClass = { pending: 'status-pending', shipped: 'status-shipped', cancelled: 'status-cancelled', partial: 'status-partial' };
    filtered.forEach(function(o){
      var ds = orderDisplayStatus(o);
      var prog = orderProgress(o);
      html += '<div class="order-card">';
      html += '<div class="order-top"><span class="order-id">#' + highlightText(o.id, q) + '</span>';
      var pillText = statusLabel[ds];
      if(ds === 'partial') pillText = prog.shippedCount + ' of ' + prog.total + ' shipped';
      html += '<span class="status-pill ' + statusClass[ds] + '">' + pillText + '</span></div>';
      if(o.urgent){
        html += '<div style="margin:2px 0 4px;"><span style="font-size:11px;font-weight:800;color:#f28b82;background:rgba(242,139,130,0.12);border:1px solid rgba(242,139,130,0.45);padding:2px 10px;border-radius:12px;">\ud83d\udea8 URGENT' + (o.urgent_days ? ' \u00b7 deliver in ' + o.urgent_days + ' day' + (o.urgent_days > 1 ? 's' : '') : '') + '</span></div>';
      }
      var restockDates = Array.from(new Set((o.items||[]).filter(function(it){ return it.restock_date && !it.purchased; }).map(function(it){ return it.restock_date; }))).sort();
      if(restockDates.length > 0){
        html += '<div style="margin:2px 0 4px;"><span style="font-size:11px;font-weight:700;color:#f2a76a;background:rgba(242,167,106,0.12);border:1px solid rgba(242,167,106,0.4);padding:2px 10px;border-radius:12px;">\ud83d\udcc5 Restock ' + esc(formatRestockDate(restockDates[0])) + (restockDates.length>1 ? ' +' + (restockDates.length-1) : '') + '</span></div>';
      }
      html += '<div class="booking-time">Booked: ' + formatTime(o.created_at) + '</div>';
      html += '<div class="activity-log">Booked by ' + esc(o.created_by_email || 'staff');
      if(o.cancelled_at) html += ' \u00b7 Cancelled by ' + esc(o.cancelled_by_email || 'staff') + ' ' + formatTime(o.cancelled_at);
      html += '</div>';
      html += '<div class="order-photos">';
      (o.items||[]).forEach(function(item, idx){
        var shippedClass = item.status === 'shipped' ? ' shipped-item' : '';
        html += '<div class="item-wrap' + shippedClass + '">';
        if(item.status === 'shipped'){
          if(isReseller()){ html += '<span class="item-shipped-tag" style="pointer-events:none;">Shipped</span>'; }
          else { html += '<button class="item-shipped-tag" data-revert-item="' + item.id + '" title="Tap to mark just this piece pending">Shipped \u21ba</button>'; }
        }
        html += '<img data-src="' + item.photo_url + '" class="orderPhoto" src="' + (item.thumb_url || item.photo_url) + '" loading="lazy" decoding="async">';
        if(item.shop_name && !isReseller()){ html += '<span class="shop-name-tag">' + esc(item.shop_name) + '</span>'; }
        html += '</div>';
      });
      html += '</div>';
      html += '<p class="order-name">' + highlightText(o.reseller_name, q) + '</p>';
      if(o.courier){ html += '<span class="order-courier">Courier: ' + highlightText(o.courier, q) + '</span>'; }
      html += '<br>';
      if(ds === 'cancelled' && o.cancel_reason){ html += '<span class="order-cancel-note">Cancelled: ' + esc(o.cancel_reason) + '</span>'; }
      html += '<p class="order-address">' + highlightText(o.address, q) + '</p>';
      html += '<div class="order-actions">';
      if(isReseller()){
        // Resellers can look and share — never change status, edit, or delete.
        if(o.tracking_number){
          html += '<button class="btn-secondary shareOneTrackingBtn" data-order="' + o.id + '">\ud83d\udce4 Share tracking</button>';
        }else{
          html += '<span style="font-size:12px;color:#9aa0a6;align-self:center;">Tracking number coming soon</span>';
        }
      }else{
        if(ds === 'cancelled'){
          html += '<button class="btn-unship" data-unship="' + o.id + '">Reactivate</button>';
        }else{
          if(ds !== 'shipped'){ html += '<button class="btn-ship" data-ship="' + o.id + '">Mark all shipped</button>'; }
          if(ds !== 'pending'){ html += '<button class="btn-unship" data-unship="' + o.id + '">Mark all pending</button>'; }
          html += '<button class="btn-cancel" data-cancel="' + o.id + '">Cancel</button>';
        }
        if(o.tracking_number && (ds === 'shipped' || ds === 'partial')){
          html += '<button class="btn-secondary shareOneTrackingBtn" data-order="' + o.id + '">\ud83d\udce4 Share tracking</button>';
        }
        html += '<button class="btn-edit" data-edit="' + o.id + '">\u270f\ufe0f</button>';
        html += '<button class="btn-del" data-del="' + o.id + '">\ud83d\uddd1</button>';
      }
      html += '</div></div>';
    });
    return html;
  }

  async function saveEditOrder(){
    var orderId = state.editOrderId;
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(!ord) return;

    var nameInputEl = document.getElementById('editNameInput');
    var courierInputEl = document.getElementById('editCourierInput');
    // Resolve any partial typing (e.g. "1191") to the full matching entry.
    tryAutocomplete(nameInputEl, state.resellers);
    tryAutocomplete(courierInputEl, state.couriers || []);
    document.querySelectorAll('.editItemShop').forEach(function(inp){ tryAutocomplete(inp, state.shops); });
    document.querySelectorAll('.editNewItemShop').forEach(function(inp){ tryAutocomplete(inp, state.shops); });

    var name = (nameInputEl.value || '').trim();
    var courier = (courierInputEl.value || '').trim();
    var address = (document.getElementById('editAddressInput').value || '').trim();
    if(!name){ showToast('Reseller name is required'); return; }
    if(!isExactListMatch(name, state.resellers)){ showToast('Reseller "' + name + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'); return; }
    if(!isExactListMatch(courier, state.couriers || [])){ showToast('Courier "' + courier + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'); return; }
    var badShop = null;
    document.querySelectorAll('.editItemShop, .editNewItemShop').forEach(function(inp){
      if(badShop) return;
      if(!(inp.value||'').trim()){ badShop = '(empty)'; }
      else if(!isExactListMatch(inp.value, state.shops)){ badShop = inp.value; }
    });
    if(badShop){ showToast('Every piece needs a shop \u2014 use "Name Pending" if you don\u2019t know it yet'); return; }
    if(!address){ showToast('Address is required'); return; }

    var visibleItems = (ord.items||[]).filter(function(it){ return state.editOrderRemovedItemIds.indexOf(it.id) === -1; });
    if(visibleItems.length === 0 && state.editOrderPhotos.length === 0){
      showToast('An order needs at least one piece \u2014 delete the whole order instead if that\u2019s what you want');
      return;
    }

    state.editOrderSaving = true;
    renderEditOrderModal();

    try{
      // 1. Order-level fields
      var { error: ordErr } = await sb.from('orders').update({ reseller_name: name, courier: courier, address: address }).eq('id', orderId);
      if(ordErr) throw new Error(ordErr.message);

      // 2. Shop/size on remaining existing items
      var itemUpdatePromises = [];
      document.querySelectorAll('.editItemShop').forEach(function(inp){
        var itemId = parseInt(inp.getAttribute('data-item-id'), 10);
        var sizeInp = document.querySelector('.editItemSize[data-item-id="' + itemId + '"]');
        var shopVal = (inp.value || '').trim() || null;
        var sizeVal = sizeInp ? ((sizeInp.value || '').trim() || null) : null;
        itemUpdatePromises.push(
          sb.from('order_items').update({ shop_name: shopVal, size: sizeVal }).eq('id', itemId)
        );
      });
      await Promise.all(itemUpdatePromises);

      // 3. Remove deleted items (+ best-effort storage cleanup)
      if(state.editOrderRemovedItemIds.length){
        var removedItems = (ord.items||[]).filter(function(it){ return state.editOrderRemovedItemIds.indexOf(it.id) !== -1; });
        var { error: delErr } = await sb.from('order_items').delete().in('id', state.editOrderRemovedItemIds);
        if(delErr) throw new Error(delErr.message);
        try{
          var paths = [];
          removedItems.forEach(function(it){
            var p1 = storagePathFromUrl(it.photo_url); if(p1) paths.push(p1);
            var p2 = storagePathFromUrl(it.thumb_url); if(p2) paths.push(p2);
          });
          if(paths.length){ sb.storage.from('order-photos').remove(paths); }
        }catch(e){ /* non-critical */ }
      }

      // 4. Upload and insert any newly added photos
      var newItemsInserted = [];
      if(state.editOrderPhotos.length){
        var existingMaxIndex = (ord.items||[]).reduce(function(max, it){ return Math.max(max, it.item_index); }, -1);
        var newShopVals = [], newSizeVals = [];
        state.editOrderPhotos.forEach(function(p, idx){
          var shopInp = document.querySelector('.editNewItemShop[data-idx="' + idx + '"]');
          var sizeInp = document.querySelector('.editNewItemSize[data-idx="' + idx + '"]');
          newShopVals.push(shopInp ? shopInp.value : '');
          newSizeVals.push(sizeInp ? sizeInp.value : '');
        });
        var uploadResults = await Promise.all(state.editOrderPhotos.map(async function(p, idx){
          var newIndex = existingMaxIndex + 1 + idx;
          var pieceId = orderId + '-' + (newIndex + 1);
          var stampedBlob = await drawWatermarkedBlob(p.blob, pieceId, newSizeVals[idx]);
          var thumbBlob = await createThumbnailBlob(stampedBlob, 260);
          var path = orderId + '/' + Date.now() + '_' + newIndex + '.jpg';
          var thumbPath = orderId + '/' + Date.now() + '_' + newIndex + '_thumb.jpg';
          var results = await Promise.all([
            sb.storage.from('order-photos').upload(path, stampedBlob, { contentType: 'image/jpeg' }),
            sb.storage.from('order-photos').upload(thumbPath, thumbBlob, { contentType: 'image/jpeg' })
          ]);
          if(results[0].error) throw new Error('Photo upload failed: ' + results[0].error.message);
          if(results[1].error) throw new Error('Thumbnail upload failed: ' + results[1].error.message);
          var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
          var { data: pubThumb } = sb.storage.from('order-photos').getPublicUrl(thumbPath);
          return {
            order_id: orderId, item_index: newIndex, photo_url: pub.publicUrl, thumb_url: pubThumb.publicUrl,
            status: 'pending', shop_name: (newShopVals[idx]||'').trim() || null, size: (newSizeVals[idx]||'').trim() || null
          };
        }));
        var { data: inserted, error: insErr } = await sb.from('order_items').insert(uploadResults).select();
        if(insErr) throw new Error(insErr.message);
        newItemsInserted = inserted || [];
      }

      // 5. Sync local state
      ord.reseller_name = name;
      ord.courier = courier;
      ord.address = address;
      ord.items = (ord.items||[])
        .filter(function(it){ return state.editOrderRemovedItemIds.indexOf(it.id) === -1; })
        .map(function(it){
          var shopInp = document.querySelector('.editItemShop[data-item-id="' + it.id + '"]');
          var sizeInp = document.querySelector('.editItemSize[data-item-id="' + it.id + '"]');
          if(shopInp) it.shop_name = (shopInp.value||'').trim() || null;
          if(sizeInp) it.size = (sizeInp.value||'').trim() || null;
          return it;
        })
        .concat(newItemsInserted)
        .sort(function(a,b){ return a.item_index - b.item_index; });

      addToLocalList(state.resellers, name);
      addToLocalList(state.couriers, courier);
      ord.items.forEach(function(it){ addToLocalList(state.shops, it.shop_name); addToLocalList(state.sizes, it.size); });

      state.editOrderSaving = false;
      closeModal();
      showToast('Order #' + orderId + ' updated');
      render();
    }catch(err){
      state.editOrderSaving = false;
      showToast('Could not save changes: ' + (err && err.message ? err.message : String(err)));
      renderEditOrderModal();
    }
  }

  // Every 5 minutes while someone is logged in, pop up a box showing every

  function checkShopPendingReminder(){

    var entries = getItemsNeedingShop();

  function openShopReminderModal(entries){

    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    wireShopReminderModal();
  }

  function wireShopReminderModal(){
    document.getElementById('reminderCloseBtn').addEventListener('click', closeModal);
    document.querySelectorAll('#modalHost .orderPhoto').forEach(function(img){
      img.addEventListener('click', function(){ openZoom(img.getAttribute('data-src')); });
    });
    document.querySelectorAll('.reminderShopInput').forEach(function(inp){
      inp.addEventListener('blur', function(){ tryAutocomplete(inp, state.shops); });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          var btn = document.querySelector('.reminderShopSaveBtn[data-item-id="' + inp.getAttribute('data-item-id') + '"]');
          if(btn) btn.click();
        }
      });
    });
    document.querySelectorAll('.reminderShopSaveBtn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var itemId = parseInt(btn.getAttribute('data-item-id'), 10);
        var inp = document.querySelector('.reminderShopInput[data-item-id="' + itemId + '"]');
        tryAutocomplete(inp, state.shops);
        var val = (inp.value || '').trim();
        if(!val){ showToast('Type a shop name first'); return; }
        if(!isExactListMatch(val, state.shops)){ showToast('"' + val + '" isn\u2019t in your shop list \u2014 check spelling, or add it in Manage Lists'); return; }
        var { error } = await sb.from('order_items').update({ shop_name: val }).eq('id', itemId);
        if(error){ showToast('Could not save: ' + error.message); return; }
        state.orders.forEach(function(o){
          (o.items||[]).forEach(function(it){ if(it.id === itemId){ it.shop_name = val; } });
        });
        showToast('Shop saved');
        var remaining = getItemsNeedingShop();
        if(remaining.length === 0){ closeModal(); render(); }
        else{ openShopReminderModal(remaining); }
      });

  // Pieces that were booked without a shop picked yet — invisible to the
  // normal by-shop grouping below since there's no shop_name to group by.
  var SHOP_PENDING_LABEL = 'Name Pending';

  function getItemsNeedingShop(){
    var results = [];
    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      (o.items||[]).forEach(function(item, idx){
        var pending = !item.shop_name || item.shop_name === SHOP_PENDING_LABEL;
        if(!pending || item.status === 'shipped') return;
        results.push({ order: o, item: item, itemIndex: idx });
      });
    });
    return results;
  }

  // Shipped but no tracking number yet — the natural DB-backed signal for
  // "this parcel's details still need to be filled in", so it survives
  // page reloads and works for both the recurring reminder and the escalation.
  function getOrdersNeedingTracking(){
    return state.orders.filter(function(o){
      return o.status !== 'cancelled' && orderDisplayStatus(o) === 'shipped' && !o.tracking_number;
    });
  }

  // How long an order has been sitting shipped-but-untracked, in hours —
  // uses the latest item's shipped_at as the moment it became fully shipped.
  function hoursSinceShippedUntracked(o){
    var latest = 0;
    (o.items||[]).forEach(function(it){
      if(it.shipped_at){ var t = new Date(it.shipped_at).getTime(); if(t > latest) latest = t; }
    });
    return latest ? hoursSince(new Date(latest).toISOString()) : 0;
  }

  function getShopSummary(mode){
    var byShop = {};
    state.orders.forEach(function(o){
      (o.items||[]).forEach(function(item, idx){
        if(!item.shop_name || item.shop_name === SHOP_PENDING_LABEL) return;
        var include = false;
        if(mode === 'need'){
          include = (o.status !== 'cancelled') && !item.shop_booked_at;
        }else if(mode === 'pending'){
          include = (o.status !== 'cancelled') && !!item.shop_booked_at && item.status === 'pending';
        }else{
          include = true;
        }
        if(!include) return;
        var key = item.shop_name;
        if(!byShop[key]) byShop[key] = [];
        byShop[key].push({ order: o, item: item, itemIndex: idx });
      });
    });
    return byShop;
  }

          var hay = (shop + ' ' + pieceId + ' ' + entry.order.id + ' ' + entry.order.reseller_name).toLowerCase();

  async function shareShopToWhatsApp(shopName, btn){
    var byShop = getShopSummary('need');
    var entries = byShop[shopName] || [];
    if(entries.length === 0) return;

    var batch = entries.slice(0, 10);

    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }

    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    try{
      var files = await Promise.all(batch.map(async function(entry){
        var res = await fetch(entry.item.photo_url);
        var blob = await res.blob();
        var pieceId = entry.order.id + '-' + (entry.itemIndex+1);
        return new File([blob], shopName + '_' + pieceId + '.jpg', { type: 'image/jpeg' });
      }));

      var shareData = { files: files, text: shopName };
      if(navigator.canShare && !navigator.canShare(shareData)){
        showToast('Your phone can\u2019t share this many photos at once \u2014 try fewer');
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        return;
      }

      await navigator.share(shareData);
      openShareConfirm(shopName, batch);
    }catch(err){
      if(err && err.name === 'AbortError'){
        // user cancelled the share sheet, nothing to do
      }else{
        showToast('Could not prepare photos: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  function getRestockDateSuggestions(){
    var out = [];
    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var now = new Date();
    for(var i=1; i<=15; i++){
      var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i);
      var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      var label = days[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '-' + months[d.getMonth()];
      out.push({ iso: iso, label: label });
    }
    return out;
  }

  function formatRestockDate(iso){
    if(!iso) return '';
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var d = new Date(iso + 'T00:00:00');
    if(isNaN(d.getTime())) return iso;
    return days[d.getDay()] + ' ' + String(d.getDate()).padStart(2,'0') + '-' + months[d.getMonth()];
  }

  function computeShopGroups(){
    var map = {};
    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      (o.items||[]).forEach(function(it){
        var shop = it.shop_name || 'Name Pending';
        if(!map[shop]) map[shop] = { name: shop, rows: [] };
        map[shop].rows.push({ order: o, item: it });
      });
    });
    return Object.keys(map).sort().map(function(k){ return map[k]; });
  }

  async function purchaseSelectedItems(itemRates, method, purchasePhotoUrl, screenshotUrl, upiRef){
    var ids = itemRates.map(function(r){ return r.id; });
    var totalRate = itemRates.reduce(function(s,r){ return s + r.rate; }, 0);
    if(method === 'cash'){
      var bal = getCashBalance();
      if(totalRate > bal.available){ showToast('Only \u20b9' + bal.available.toLocaleString('en-IN') + ' available in cash'); return false; }
    }
    if(method === 'gpay'){
      var gbal = getGpayBalance();
      if(totalRate > gbal.available){ showToast('Only \u20b9' + gbal.available.toLocaleString('en-IN') + ' available in GPay'); return false; }
    }
    var nowIso = new Date().toISOString();
    var touched = [];
    state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(ids.indexOf(it.id) !== -1){ touched.push(it); } }); });
    var rateById = {};
    itemRates.forEach(function(r){ rateById[r.id] = r.rate; });
    touched.forEach(function(it){
      it.purchased = true;
      it.purchase_rate = rateById[it.id];
      it.payment_method = method;
      it.purchased_at = nowIso;
      if(purchasePhotoUrl) it.purchase_photo_url = purchasePhotoUrl;
      if(screenshotUrl) it.payment_screenshot_url = screenshotUrl;
      if(upiRef) it.upi_ref = upiRef;
    });
    render();
    try{
      await Promise.all(touched.map(function(it){
        return sb.from('order_items').update({
          purchased: true, purchase_rate: it.purchase_rate, payment_method: method,
          purchased_at: nowIso, purchased_by: state.session.user.id,
          purchase_photo_url: it.purchase_photo_url || null,
          payment_screenshot_url: it.payment_screenshot_url || null,
          upi_ref: it.upi_ref || null
        }).eq('id', it.id);
      }));
      showToast('Marked ' + touched.length + ' piece' + (touched.length!==1?'s':'') + ' purchased \u2014 \u20b9' + totalRate + ' (' + method + ')');
    }catch(e){
      showToast('Could not save: ' + (e && e.message ? e.message : 'try again'));
    }
    state.purchaseSelection = {};
    render();
    return true;
  }

  async function unmarkItemPurchased(itemId){
    var item = null;
    state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(it.id === itemId){ item = it; } }); });
    if(!item) return;
    var prev = { purchased: item.purchased, purchase_rate: item.purchase_rate, payment_method: item.payment_method };
    item.purchased = false; item.purchase_rate = null; item.payment_method = null;
    render();
    try{
      var { error } = await sb.from('order_items').update({ purchased: false, purchase_rate: null, payment_method: null, purchased_at: null, purchased_by: null }).eq('id', itemId);
      if(error) throw error;
      showToast('Reverted to pending \u2014 back in Rajan\u2019s pending list');
    }catch(e){
      item.purchased = prev.purchased; item.purchase_rate = prev.purchase_rate; item.payment_method = prev.payment_method;
      showToast('Could not undo: ' + (e && e.message ? e.message : 'try again'));
    }
    render();
  }

  function shopMatchesPolarise(name){
    var n = (name||'').toLowerCase();
    return n.indexOf('polarise') !== -1 || n.indexOf('sanskruti') !== -1;
  }

    var shown = 0;
    groups.forEach(function(g){
      var pending = g.rows.filter(function(r){ return !r.item.purchased; });
      if(state.purchaseFilter === 'pending' && pending.length === 0) return;

      html += '</div><span style="color:#9aa0a6;font-size:18px;flex-shrink:0;">\u203a</span></div>';

    html += '</div>';

    if(pendingRows.length > 0){
      html += '<button class="btn-secondary" id="purchaseSelectAllBtn" style="width:auto;padding:7px 14px;margin-bottom:12px;">' + (selCount === pendingRows.length ? 'Unselect all' : 'Select all pending') + '</button>';

      if(it.purchased){

      }else if(it.restock_date){
        html += '<div class="purchase-tile-badge" style="background:rgba(242,167,106,0.92);color:#3a2a12;">\ud83d\udcc5 ' + esc(formatRestockDate(it.restock_date)) + '</div>';

      if(v > 0) total += v;
    });
    var totalEl = document.getElementById('purchaseBuyTotalDisplay');
    if(totalEl) totalEl.textContent = '\u20b9' + total.toLocaleString('en-IN');

  function openPurchaseBuyModal(){
    var ids = Object.keys(state.purchaseSelection).filter(function(k){ return state.purchaseSelection[k]; }).map(Number);
    if(ids.length === 0) return;
    var rows = [];
    state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(ids.indexOf(it.id) !== -1){ rows.push({ order: o, item: it }); } }); });

    var total = 0;
    rows.forEach(function(r){ var v = Number(state.purchaseRateDrafts[r.item.id]); if(v > 0) total += v; });

    var html = '<div class="modal-overlay" style="align-items:flex-end;"><div class="modal-box" style="max-width:480px;width:100%;max-height:88vh;overflow-y:auto;text-align:left;border-radius:20px 20px 0 0;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 10px;">Mark ' + rows.length + ' piece' + (rows.length!==1?'s':'') + ' purchased</p>';

    rows.forEach(function(r){
      var it = r.item, o = r.order;
      var batchChecked = state.purchaseBatchChk[it.id] !== false;

      html += '<input type="checkbox" class="purchaseBatchChk custom-chk" data-item="' + it.id + '" ' + (batchChecked?'checked':'') + ' style="width:22px;height:22px;flex-shrink:0;">';
      html += '<img src="' + (it.thumb_url||it.photo_url) + '" style="width:40px;height:50px;object-fit:cover;border-radius:6px;flex-shrink:0;">';
      html += '<span style="font-size:12.5px;color:#9aa0a6;flex:1;">#' + esc(o.id) + (it.size?' \u00b7 '+esc(it.size):'') + '</span>';
      html += '<input type="number" min="0" inputmode="decimal" class="purchaseRateDraftInput" data-item="' + it.id + '" placeholder="\u20b9" style="width:90px;flex-shrink:0;" value="' + esc(draft) + '">';
      html += '</div>';
    });

    html += '<div style="background:#202124;border:1px solid #3c4043;border-radius:10px;padding:10px;margin:12px 0;">';
    html += '<label style="margin-bottom:6px;">Same price for several? Tick them, type once, apply</label>';
    html += '<div style="display:flex;gap:8px;"><input type="number" min="0" id="purchaseBatchAmountInput" placeholder="\u20b9 amount" value="' + esc(state.purchaseBatchAmount||'') + '" style="flex:1;"><button class="btn-secondary" id="purchaseBatchApplyBtn" style="width:auto;padding:10px 14px;">Apply to ticked</button></div>';
    html += '</div>';

    html += '<div id="purchaseBuyTotalDisplay" style="text-align:right;font-size:16px;font-weight:800;color:#f2a76a;margin:12px 0;">\u20b9' + total.toLocaleString('en-IN') + '</div>';

    html += '<label>Payment method</label>';
    html += '<select id="purchaseMethodSelect" style="margin-bottom:10px;">';
    html += '<option value="">Choose method</option><option value="cash">Cash</option><option value="gpay">GPay</option><option value="challan">Challan</option><option value="message">Message</option>';
    html += '</select>';

    var method = state.purchasePendingMethod || '';
    if(method === 'gpay'){
      var upiVpa = state.shopUpiVpas[state.purchaseShopView];
      var upiUrl;
      if(upiVpa){
        upiUrl = 'upi://pay?pa=' + encodeURIComponent(upiVpa) + '&pn=' + encodeURIComponent(state.purchaseShopView) + '&am=' + encodeURIComponent(String(total)) + '&cu=INR&tn=' + encodeURIComponent('Gurukrupa purchase');
      }else{
        // No saved UPI ID for this shop yet — still open GPay directly with
        // the amount ready to go; Rajan scans/searches the payee inside the
        // app. Once Soham adds the shop's UPI ID this becomes one-tap.
        upiUrl = 'upi://pay?am=' + encodeURIComponent(String(total)) + '&cu=INR&tn=' + encodeURIComponent('Gurukrupa purchase');
      }
      html += '<a href="' + upiUrl + '" id="gpayPayLink" class="btn-secondary" style="display:block;text-align:center;text-decoration:none;width:100%;margin-bottom:10px;box-sizing:border-box;">\ud83d\udcf1 Open GPay \u2014 pay \u20b9' + total.toLocaleString('en-IN') + '</a>';
      if(!upiVpa){
        html += '<div class="field-hint">This shop has no saved UPI ID yet, so you\u2019ll need to pick or scan the payee inside GPay. Ask Soham to add it in Manage Lists for a one-tap pay next time.</div>';

    if(state.purchasePhotoPreview){ html += '<img src="' + state.purchasePhotoPreview + '" style="width:100%;max-height:150px;object-fit:contain;border-radius:10px;border:1px solid #3c4043;margin-bottom:10px;">'; }

    if(state.purchaseActionError){ html += '<div class="error-text">' + esc(state.purchaseActionError) + '</div>'; }
    html += '<div class="modal-actions"><button id="purchaseBuyCancelBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Cancel</button><button class="btn-primary" id="purchaseConfirmBuyBtn" ' + (state.purchaseSaving?'disabled':'') + ' style="flex:1;">' + (state.purchaseSaving?'Saving...':'Confirm purchase') + '</button></div>';
    html += '</div></div>';

    document.getElementById('modalHost').innerHTML = html;
    wirePurchaseBuyModal(ids);

  function wirePurchaseBuyModal(ids){
    document.getElementById('purchaseBuyCancelBtn').addEventListener('click', closeModal);
    document.querySelectorAll('.purchaseBatchChk').forEach(function(chk){
      chk.addEventListener('change', function(){
        state.purchaseBatchChk[parseInt(chk.getAttribute('data-item'),10)] = chk.checked;
      });
    });
    document.querySelectorAll('.purchaseRateDraftInput').forEach(function(inp){
      inp.addEventListener('input', function(){
        state.purchaseRateDrafts[parseInt(inp.getAttribute('data-item'),10)] = inp.value;
        updateBuyModalTotal();
      });
    });
    var batchAmtInp = document.getElementById('purchaseBatchAmountInput');
    if(batchAmtInp) batchAmtInp.addEventListener('input', function(){ state.purchaseBatchAmount = batchAmtInp.value; });
    var batchApplyBtn = document.getElementById('purchaseBatchApplyBtn');
    if(batchApplyBtn) batchApplyBtn.addEventListener('click', function(){
      var amt = (document.getElementById('purchaseBatchAmountInput').value || '').trim();
      if(!amt || isNaN(Number(amt)) || Number(amt) <= 0){ showToast('Enter a valid amount first'); return; }
      ids.forEach(function(id){
        if(state.purchaseBatchChk[id] !== false){
          state.purchaseRateDrafts[id] = amt;
          state.purchaseBatchChk[id] = false;
        }
      });
      state.purchaseBatchAmount = '';
      openPurchaseBuyModal();
    });
    var methodSel = document.getElementById('purchaseMethodSelect');
    if(methodSel){
      methodSel.value = state.purchasePendingMethod || '';
      methodSel.addEventListener('change', function(){ state.purchasePendingMethod = methodSel.value; openPurchaseBuyModal(); });
    }
    var photoBtn = document.getElementById('purchasePhotoBtn');
    var photoInput = document.getElementById('purchasePhotoInput');
    if(photoBtn && photoInput){
      photoBtn.addEventListener('click', function(){ photoInput.click(); });
      photoInput.addEventListener('change', async function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        photoBtn.disabled = true;
        photoBtn.textContent = '\u23f3 Processing...';
        try{
          var blob = await resizeImageToBlob(f, 800);
          state.purchasePhotoBlob = blob;
          state.purchasePhotoPreview = URL.createObjectURL(blob);
          openPurchaseBuyModal();
        }catch(err){
          showToast('Could not process photo');
          photoBtn.disabled = false;
          photoBtn.textContent = '\ud83d\udcf8 Take purchase-time photo';
        }
      });
    }
    var ssBtn = document.getElementById('purchaseScreenshotBtn');
    var ssInput = document.getElementById('purchaseScreenshotInput');
    if(ssBtn && ssInput){
      ssBtn.addEventListener('click', function(){ ssInput.click(); });
      ssInput.addEventListener('change', async function(e){
        var f = e.target.files && e.target.files[0];
        if(!f) return;
        var originalLabel = ssBtn.textContent;
        ssBtn.disabled = true;
        ssBtn.textContent = '\u23f3 Processing...';
        try{
          var blob = await resizeImageToBlob(f, 800);
          state.purchaseScreenshotBlob = blob;
          state.purchaseScreenshotPreview = URL.createObjectURL(blob);
          openPurchaseBuyModal();
        }catch(err){
          showToast('Could not process photo');
          ssBtn.disabled = false;
          ssBtn.textContent = originalLabel;
        }
      });
    }
    var confirmBtn = document.getElementById('purchaseConfirmBuyBtn');
    if(confirmBtn) confirmBtn.addEventListener('click', async function(){
      var rates = [];
      var bad = false;
      ids.forEach(function(id){
        var val = Number(state.purchaseRateDrafts[id]);
        if(!val || isNaN(val) || val <= 0){ bad = true; }
        rates.push({ id: id, rate: val });
      });
      var method = state.purchasePendingMethod;
      if(bad){ state.purchaseActionError = 'Enter a rate for every piece'; openPurchaseBuyModal(); return; }
      if(!method){ state.purchaseActionError = 'Select a payment method'; openPurchaseBuyModal(); return; }
      if(!state.purchasePhotoBlob){ state.purchaseActionError = 'Take a purchase-time photo of the pieces'; openPurchaseBuyModal(); return; }
      if((method === 'message' || method === 'challan') && !state.purchaseScreenshotBlob){
        state.purchaseActionError = method === 'message' ? 'Add the message screenshot' : 'Add a photo of the challan';
        openPurchaseBuyModal(); return;
      }
      state.purchaseActionError = '';
      state.purchaseSaving = true;
      openPurchaseBuyModal();
      var beforeRows = [];
      state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(ids.indexOf(it.id) !== -1){ beforeRows.push({ id: it.id, photo: it.thumb_url||it.photo_url, orderId: o.id, size: it.size }); } }); });
      try{
        var photoUrl = await uploadPurchaseProof(state.purchasePhotoBlob, 'purchase');
        var screenshotUrl = null;
        if((method === 'message' || method === 'challan') && state.purchaseScreenshotBlob){
          screenshotUrl = await uploadPurchaseProof(state.purchaseScreenshotBlob, method);
        }
        var ok = await purchaseSelectedItems(rates, method, photoUrl, screenshotUrl, null);
        state.purchaseSaving = false;
        if(ok){
          var total = rates.reduce(function(s,r){ return s + r.rate; }, 0);
          state.purchasePendingMethod = '';
          state.purchasePhotoBlob = null; state.purchasePhotoPreview = null;
          state.purchaseScreenshotBlob = null; state.purchaseScreenshotPreview = null;
          state.purchaseRateDrafts = {}; state.purchaseBatchChk = {};
          openPurchaseConfirmedModal(beforeRows, rates, total, method, null);
        }else{
          openPurchaseBuyModal();
        }
      }catch(err){
        state.purchaseSaving = false;
        state.purchaseActionError = 'Could not save: ' + (err && err.message ? err.message : 'try again');
        openPurchaseBuyModal();
      }
    });
  }

    var rows = [];

    var html = '<div class="modal-overlay" style="align-items:flex-end;"><div class="modal-box" style="max-width:480px;width:100%;max-height:88vh;overflow-y:auto;text-align:left;border-radius:20px 20px 0 0;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 4px;">Set restock date \u2014 ' + rows.length + ' piece' + (rows.length!==1?'s':'') + '</p>';
    html += '<p style="font-size:12px;color:#9aa0a6;margin:0 0 12px;">Tick which ones share the same date, then tap that date. Repeat for the rest.</p>';

      html += '<span style="font-size:12.5px;color:#e8eaed;flex:1;">#' + esc(o.id) + (it.size?' \u00b7 '+esc(it.size):'') + '</span>';

      html += '</div>';

    html += '<label style="margin-top:12px;">Tap a date to apply to ticked pieces</label>';

      html += '<div class="filter-chip purchaseRestockChip" data-iso="' + d.iso + '" style="cursor:pointer;">' + d.label + '</div>';
    });
    html += '</div>';

    html += '<div class="modal-actions"><button id="purchaseRestockDoneBtn" style="background:#d97a3f;color:#fff;border:none;flex:1;">Done</button></div>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    wirePurchaseRestockModal(ids);

  function wirePurchaseRestockModal(ids){
    document.querySelectorAll('.purchaseDateRow').forEach(function(row){
      row.addEventListener('click', function(){
        var id = parseInt(row.getAttribute('data-item'), 10);
        state.purchaseBatchChk[id] = state.purchaseBatchChk[id] === true ? false : true;
        openPurchaseRestockModal();
      });
    });
    document.querySelectorAll('.purchaseRestockChip').forEach(function(chip){
      chip.addEventListener('click', function(){
        var iso = chip.getAttribute('data-iso');
        var applyIds = ids.filter(function(id){ return state.purchaseBatchChk[id] === true; });
        if(applyIds.length === 0){ showToast('Tick at least one piece first'); return; }
        restockSelectedItems(applyIds, iso).then(function(){
          applyIds.forEach(function(id){ state.purchaseBatchChk[id] = false; });
          openPurchaseRestockModal();
        });
      });
    });
    document.getElementById('purchaseRestockDoneBtn').addEventListener('click', function(){
      state.purchaseSelection = {};
      state.purchaseBatchChk = {};
      closeModal();
      render();
    });
  }

    var amount = Number(state.topupAmountVal);
    if(!amount || isNaN(amount) || amount <= 0){ showToast('Enter a valid top-up amount'); return; }
    try{
      var { data, error } = await sb.from('cash_topups').insert({
        amount: amount, note: (state.topupNoteVal||'').trim() || null, created_by: state.session.user.id
      }).select().single();
      if(error) throw error;
      state.cashTopups.unshift(data);
      state.topupAmountVal = ''; state.topupNoteVal = '';
      showToast('Added \u20b9' + amount.toLocaleString('en-IN') + ' to Rajan\u2019s cash float');
      render();
    }catch(e){
      showToast('Could not add top-up: ' + (e && e.message ? e.message : 'try again'));

        if(it.payment_screenshot_url){ html += '<img class="ledgerThumb" data-src="' + it.payment_screenshot_url + '" src="' + it.payment_screenshot_url + '" title="Message screenshot" style="width:44px;height:56px;object-fit:cover;border-radius:8px;border:1px solid #3c4043;flex-shrink:0;cursor:zoom-in;">'; }
        html += '</div>';
      });

  function openUndoPurchaseConfirm(itemId, pieceLabel, rate, method, onDone){
    var html = '<div class="modal-overlay"><div class="modal-box" style="max-width:320px;text-align:left;">';
    html += '<p style="font-size:14px;font-weight:700;margin:0 0 8px;">Undo this purchase?</p>';

  function getCashBalance(){
    var topped = (state.cashTopups||[]).reduce(function(sum, t){ return sum + (Number(t.amount)||0); }, 0);

    state.orders.forEach(function(o){

  async function updateItemPrice(itemId, rawValue){
    var price = rawValue === '' ? null : Number(rawValue);
    if(price !== null && (isNaN(price) || price < 0)){ showToast('Enter a valid price'); render(); return; }
    var item = null;
    state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(it.id === itemId){ item = it; } }); });
    if(!item) return;
    var prev = item.price;
    item.price = price;
    try{
      var { error } = await sb.from('order_items').update({ price: price }).eq('id', itemId);
      if(error) throw error;
    }catch(e){
      item.price = prev;
      showToast('Could not save price: ' + (e && e.message ? e.message : 'try again'));
      render();
    }
  }

  async function shareSelectedTracking(btn){
    var selected = state.orders.filter(function(o){ return state.rtrackSel[o.id] && o.tracking_number; });
    if(selected.length === 0) return;
    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }
    var batch = selected.slice(0, 10);
    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }
    var messageText = batch.map(buildTrackingShareText).join('\n\n');
    try{
      var withPhoto = batch.filter(function(o){ return o.tracking_photo_url; });
      var files = await Promise.all(withPhoto.map(async function(o){
        var res = await fetch(o.tracking_photo_url);
        var blob = await res.blob();
        return new File([blob], 'tracking_' + o.id + '.jpg', { type: 'image/jpeg' });
      }));
      var shareData = files.length > 0 ? { files: files, text: messageText } : { text: messageText };
      if(files.length > 0 && navigator.canShare && !navigator.canShare(shareData)){
        shareData = { text: messageText }; // fall back to text-only rather than failing
      }
      await navigator.share(shareData);
      state.rtrackSel = {};
      showToast('Tracking shared for ' + batch.length + ' order' + (batch.length !== 1 ? 's' : ''));
      render();
    }catch(err){
      if(!(err && err.name === 'AbortError')){
        showToast('Could not share: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  async function downloadBillExcel(){
    if(typeof ExcelJS === 'undefined'){
      showToast('Excel engine is still loading \u2014 try again in a few seconds');
      return;
    }
    var btn = document.getElementById('downloadBillBtn');
    var originalLabel = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = '\u23f3 Preparing...'; }

    try{
      var lines = [];
      var total = 0;
      state.orders.slice().reverse().forEach(function(o){
        if(o.status === 'cancelled') return;
        (o.items||[]).forEach(function(it, idx){
          var price = (it.price != null && it.price !== '') ? Number(it.price) : '';
          if(price !== ''){ total += price; }
          lines.push({
            orderId: o.id,
            piece: o.id + '-' + (idx + 1),
            date: (o.created_at || '').slice(0, 10),
            size: it.size || '',
            status: it.status || '',
            address: o.address || '',
            courier: o.courier || '',
            tracking: o.tracking_number || '',
            price: price,
            photoUrl: it.thumb_url || it.photo_url || ''
          });
        });
      });

      // Fetch every thumbnail in parallel up front — much faster than one at a time,
      // and a failed photo (bad URL, network hiccup) just leaves that row blank
      // instead of breaking the whole export.
      var photoBuffers = await Promise.all(lines.map(function(l){
        if(!l.photoUrl) return Promise.resolve(null);
        return fetch(l.photoUrl).then(function(r){ return r.ok ? r.arrayBuffer() : null; }).catch(function(){ return null; });
      }));

      var wb = new ExcelJS.Workbook();
      var ws = wb.addWorksheet('Bill');
      ws.columns = [
        { header: 'Order ID', key: 'orderId', width: 10 },
        { header: 'Piece', key: 'piece', width: 10 },
        { header: 'Booked date', key: 'date', width: 12 },
        { header: 'Size', key: 'size', width: 8 },
        { header: 'Status', key: 'status', width: 10 },
        { header: 'Address', key: 'address', width: 36 },
        { header: 'Courier', key: 'courier', width: 18 },
        { header: 'Tracking ID', key: 'tracking', width: 20 },
        { header: 'Price (Rs)', key: 'price', width: 12 },
        { header: 'Photo', key: 'photo', width: 12 }
      ];
      ws.getRow(1).font = { bold: true };

      lines.forEach(function(l, i){
        var row = ws.addRow({
          orderId: l.orderId, piece: l.piece, date: l.date, size: l.size, status: l.status,
          address: l.address, courier: l.courier, tracking: l.tracking, price: l.price, photo: ''
        });
        row.alignment = { wrapText: true, vertical: 'middle' };
        row.height = 60;
        var buf = photoBuffers[i];
        if(buf){
          var imgId = wb.addImage({ buffer: buf, extension: 'jpeg' });
          ws.addImage(imgId, { tl: { col: 9, row: row.number - 1 }, ext: { width: 56, height: 76 } });
        }
      });

      var totalRowIdx = lines.length + 2;
      ws.getCell('H' + totalRowIdx).value = 'TOTAL';
      ws.getCell('H' + totalRowIdx).font = { bold: true };
      ws.getCell('I' + totalRowIdx).value = total;
      ws.getCell('I' + totalRowIdx).font = { bold: true };

      var safeName = (state.myResellerName || 'bill').replace(/[^A-Za-z0-9]+/g, '_');
      var buffer = await wb.xlsx.writeBuffer();
      var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Gurukrupa_Bill_' + safeName + '_' + new Date().toISOString().slice(0, 10) + '.xlsx';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(err){
      showToast('Could not build the Excel file: ' + (err && err.message ? err.message : 'try again'));
    }
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }
