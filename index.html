<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }

  /* ===== MOBILE TOUCH BASICS =====
     Phones show their own grey "flash" on every tap by default — without
     turning that off, it fights the custom press animation below and looks
     broken (two different feedbacks firing at once). Also removes the old
     ~300ms delay some mobile browsers add before registering a tap. */
  button, .tab-btn, .filter-chip, .btn-add-photo, .draw-color-swatch,
  .orderPhoto, .item-wrap img, .album-cell, .item-shipped-tag, a {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Smooth momentum scrolling on iOS for any horizontally/vertically scrolling strip */
  .shop-row-tray, .modal-box, #app { -webkit-overflow-scrolling: touch; }

  /* ===== GLOBAL ANIMATION SYSTEM =====
     One consistent feel for every clickable thing in the app:
     press down slightly + brighten on hover. Applied broadly, then a few
     elements with their own custom hover (tab-btn, filter-chip) get a
     matching press-down added on top of what they already have. */
  button, .tab-btn, .filter-chip, .btn-add-photo, .draw-color-swatch,
  .status-pill, .order-courier, .badge {
    transition: filter 0.12s ease, transform 0.08s ease, background-color 0.15s ease,
                border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button:not(:disabled):hover, .btn-add-photo:hover { filter: brightness(1.1); }
  button:not(:disabled):active, .btn-add-photo:active,
  .draw-color-swatch:active { transform: scale(0.95); }
  .tab-btn:active { transform: translateY(0) scale(0.97); }
  .filter-chip:hover { filter: brightness(1.15); }
  .filter-chip:active { transform: scale(0.95); }

  /* Tap feedback on photo thumbnails — every photo in the app opens a zoom
     view on tap, so a quick press-down confirms the tap landed. */
  .orderPhoto, .item-wrap img { transition: transform 0.08s ease; }
  .orderPhoto:active, .item-wrap img:active { transform: scale(0.96); }
  .album-cell { transition: transform 0.08s ease; }
  .album-cell:active { transform: scale(0.97); }

  /* Tab content fades in on switch — .tab-fade is added/removed by JS each
     time content changes, since a CSS animation on a fixed element only
     plays once (swapping innerHTML alone doesn't replay it). */
  .tab-fade { animation: fadeIn 0.16s ease; }

  /* Standard loading spinner, used wherever the app shows "Loading..." */
  .spinner {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #3c4043; border-top-color: #d97a3f;
    animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
  }
  .spinner-sm { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(128,128,128,0.35); border-top-color: currentColor; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.92) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes badgePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  /* ===== END GLOBAL ANIMATION SYSTEM ===== */

  html { overflow-x: hidden; width: 100%; scrollbar-width: none; -ms-overflow-style: none; }

  function esc(s){

  function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function tryAutocomplete(inputEl, suggestions){
    var val = (inputEl.value || '').trim();
    if(!val) return;
    var lower = val.toLowerCase();
    var alreadyExact = suggestions.some(function(s){ return s.toLowerCase() === lower; });
    if(alreadyExact) return;
    var matches = suggestions.filter(function(s){ return s.toLowerCase().indexOf(lower) !== -1; });
    if(matches.length === 1){
      inputEl.value = matches[0];
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));

  function isExactListMatch(val, list){

  function highlightText(text, query){
    var str = text == null ? '' : String(text);
    if(!query || !query.trim()) return esc(str);
    var q = query.trim();
    var re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
    var parts = str.split(re);
    return parts.map(function(part, i){
      if(part === undefined || part === '') return '';
      return (i % 2 === 1) ? '<mark>' + esc(part) + '</mark>' : esc(part);
    }).join('');

  function resizeImageToBlob(file, maxW){
    // createImageBitmap uses the browser's native (often hardware-accelerated)
    // decoder and is meaningfully faster than the Image()+canvas path on phones.
    if(window.createImageBitmap){
      return createImageBitmap(file).then(function(bitmap){
        var w = bitmap.width, hh = bitmap.height;
        if(w > maxW){ hh = Math.round(hh * (maxW/w)); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = hh;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, w, hh);
        bitmap.close();
        return new Promise(function(resolve, reject){
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('Could not compress photo')); return; }
            resolve(blob);
          }, 'image/jpeg', 0.6);
        });
      }).catch(function(){
        // Fall back to the older, slower-but-universal method below.
        return resizeImageToBlobLegacy(file, maxW);
      });
    }
    return resizeImageToBlobLegacy(file, maxW);
  }

  function resizeImageToBlobLegacy(file, maxW){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('Could not read the photo file')); };
      reader.onload = function(e){
        var img = new Image();
        img.onerror = function(){ reject(new Error('Could not decode the photo')); };
        img.onload = function(){
          var w = img.width, hh = img.height;
          if(w > maxW){ hh = Math.round(hh * (maxW/w)); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = hh;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, hh);
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('Could not compress photo')); return; }
            resolve(blob);
          }, 'image/jpeg', 0.6);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function drawWatermarkedBlob(sourceBlob, pieceId, sizeVal){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objUrl = URL.createObjectURL(sourceBlob);
      img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error('Could not load photo to stamp order ID')); };
      img.onload = function(){
        URL.revokeObjectURL(objUrl);
        var canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        var lines = ['#' + pieceId];
        var trimmedSize = (sizeVal || '').trim();
        if(trimmedSize) lines.push(trimmedSize);

        var fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
        var fontSize = Math.max(20, Math.round(canvas.width * 0.065));
        ctx.font = '800 ' + fontSize + 'px ' + fontFamily;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        var lineHeight = fontSize * 1.25;
        var padX = fontSize * 0.6;
        var padY = fontSize * 0.4;

        var maxTextWidth = 0;
        lines.forEach(function(line){
          var w = ctx.measureText(line).width;
          if(w > maxTextWidth) maxTextWidth = w;
        });

        var boxWidth = maxTextWidth + padX * 2;
        var boxHeight = (lines.length * lineHeight) + padY * 2;
        var centerX = canvas.width / 2;
        var centerY = canvas.height / 2;
        var boxX = centerX - boxWidth / 2;
        var boxY = centerY - boxHeight / 2;
        var radius = fontSize * 0.28;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(boxX + radius, boxY);
        ctx.arcTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + boxHeight, radius);
        ctx.arcTo(boxX + boxWidth, boxY + boxHeight, boxX, boxY + boxHeight, radius);
        ctx.arcTo(boxX, boxY + boxHeight, boxX, boxY, radius);
        ctx.arcTo(boxX, boxY, boxX + boxWidth, boxY, radius);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#000000';
        lines.forEach(function(line, i){
          var y = boxY + padY + (i + 0.5) * lineHeight;
          ctx.fillText(line, centerX, y);
        });

        canvas.toBlob(function(outBlob){
          if(!outBlob){ reject(new Error('Could not finalize stamped photo')); return; }
          resolve(outBlob);
        }, 'image/jpeg', 0.85);
      };
      img.src = objUrl;
    });
  }

  function createThumbnailBlob(sourceBlob, maxW){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objUrl = URL.createObjectURL(sourceBlob);
      img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error('Could not create thumbnail')); };
      img.onload = function(){
        URL.revokeObjectURL(objUrl);
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){
          if(!blob){ reject(new Error('Could not finalize thumbnail')); return; }
          resolve(blob);
        }, 'image/jpeg', 0.6);
      };
      img.src = objUrl;
    });
  }

  // ===== AUTH =====

  async function initAuth(){
    var { data } = await sb.auth.getSession();
    state.session = data.session;
    sb.auth.onAuthStateChange(function(event, session){
      state.session = session;
      if(event === 'SIGNED_IN'){
        loadOrders();
      }else if(event === 'SIGNED_OUT'){
        render();
      }
      // Other events (e.g. TOKEN_REFRESHED when the tab regains focus) update the
      // session silently without reloading data or re-rendering, so unsaved text
      // in any input field is never wiped out.
    });
    if(state.session){
      await loadOrders();
    }else{
      state.loading = false;
      render();
    }
  }

  // ===== DATA LOADING =====

  var loadOrdersInFlight = false;
  var lastRenderedTab = null;
  var shopReminderIntervalId = null;
  async function loadOrders(){
    if(loadOrdersInFlight) return; // prevent duplicate concurrent loads (page load + SIGNED_IN event both fire)
    loadOrdersInFlight = true;
    state.loading = true;
    render();
    try{
      // Start the 4 list queries NOW so they run in parallel with orders/items
      var listPromise = Promise.all([
        sb.from('resellers').select('name,hidden'),
        sb.from('shops').select('name,hidden'),
        sb.from('couriers').select('name,hidden'),
        sb.from('sizes').select('name,hidden'),
        sb.from('courier_prefixes').select('prefix,courier_name')
      ]);

      var { data: orders, error: ordersErr } = await sb
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(300);
      if(ordersErr) throw ordersErr;

      var orderIds = (orders||[]).map(function(o){ return o.id; });
      var items = [];
      if(orderIds.length > 0){
        var { data: itemsData, error: itemsErr } = await sb
          .from('order_items')
          .select('*')
          .in('order_id', orderIds)
          .order('item_index', { ascending: true });
        if(itemsErr) throw itemsErr;
        items = itemsData || [];
      }

      var byOrder = {};
      (items||[]).forEach(function(it){
        if(!byOrder[it.order_id]) byOrder[it.order_id] = [];
        byOrder[it.order_id].push(it);
      });

      state.orders = (orders||[]).map(function(o){
        o.items = byOrder[o.id] || [];
        return o;
      });

      var names = {};
      state.orders.forEach(function(o){ if(o.reseller_name) names[o.reseller_name.toLowerCase()] = o.reseller_name; });

      var shopNames = {};
      (items||[]).forEach(function(it){ if(it.shop_name) shopNames[it.shop_name.toLowerCase()] = it.shop_name; });

      var courierNames = {};
      state.orders.forEach(function(o){ if(o.courier) courierNames[o.courier.toLowerCase()] = o.courier; });

      var sizeNames = {};
      (items||[]).forEach(function(it){ if(it.size) sizeNames[it.size.toLowerCase()] = it.size; });

      var listResults = await listPromise;
      var resellerRows = listResults[0].data;
      var shopRows = listResults[1].data;
      var courierRows = listResults[2].data;
      var sizeRows = listResults[3].data;
      state.courierPrefixes = listResults[4].data || [];

      var hiddenResellers = {};
      (resellerRows||[]).forEach(function(r){
        if(r.hidden){ hiddenResellers[r.name.toLowerCase()] = true; }
        else{ names[r.name.toLowerCase()] = r.name; }
      });

      var hiddenShops = {};
      (shopRows||[]).forEach(function(r){
        if(r.hidden){ hiddenShops[r.name.toLowerCase()] = true; }
        else{ shopNames[r.name.toLowerCase()] = r.name; }
      });

      var hiddenCouriers = {};
      (courierRows||[]).forEach(function(r){
        if(r.hidden){ hiddenCouriers[r.name.toLowerCase()] = true; }
        else{ courierNames[r.name.toLowerCase()] = r.name; }
      });

      var hiddenSizes = {};
      (sizeRows||[]).forEach(function(r){
        if(r.hidden){ hiddenSizes[r.name.toLowerCase()] = true; }
        else{ sizeNames[r.name.toLowerCase()] = r.name; }
      });

      Object.keys(hiddenResellers).forEach(function(k){ delete names[k]; });
      Object.keys(hiddenShops).forEach(function(k){ delete shopNames[k]; });
      Object.keys(hiddenCouriers).forEach(function(k){ delete courierNames[k]; });
      Object.keys(hiddenSizes).forEach(function(k){ delete sizeNames[k]; });

      state.resellers = Object.values(names).sort();
      state.shops = Object.values(shopNames).sort();
      state.couriers = Object.values(courierNames).sort();
      state.sizes = Object.values(sizeNames).sort();

    }catch(e){
      showToast('Could not load orders: ' + (e && e.message ? e.message : 'unknown error'));
    }
    state.loading = false;
    loadOrdersInFlight = false;
    render();
    startShopReminderIfNeeded();
  }

  function orderProgress(o){
    var items = o.items || [];
    var total = items.length;
    var shippedCount = items.filter(function(i){ return i.status === 'shipped'; }).length;
    return { total: total, shippedCount: shippedCount };
  }

  function orderDisplayStatus(o){
    if(o.status === 'cancelled') return 'cancelled';
    var p = orderProgress(o);
    if(p.total > 0 && p.shippedCount === p.total) return 'shipped';
    if(p.shippedCount > 0) return 'partial';
    return 'pending';
  }

  // ===== BOOKING =====

  function addToLocalList(list, val){
    val = (val || '').trim();
    if(!val) return;
    var exists = list.some(function(n){ return n.toLowerCase() === val.toLowerCase(); });
    if(!exists){ list.push(val); list.sort(); }

  // Fetch the next order number ahead of time so Save doesn't wait ~600ms for it
  var nextOrderIdPromise = null;
  function prefetchOrderId(){
    if(nextOrderIdPromise) return;
    nextOrderIdPromise = sb.rpc('get_next_order_id').then(function(res){
      if(res.error){ nextOrderIdPromise = null; return null; }
      return res.data;
    }, function(){ nextOrderIdPromise = null; return null; });
  }

  async function saveOrder(name, courier, address, photoEntries, onProgress){
    var orderId = nextOrderIdPromise ? await nextOrderIdPromise : null;
    nextOrderIdPromise = null; // this number is now used up
    if(!orderId){
      var { data: idData, error: idErr } = await sb.rpc('get_next_order_id');
      if(idErr) throw new Error('Could not get order number: ' + idErr.message);
      orderId = idData;
    }

    var orderInsertPromise = sb.from('orders').insert({
      id: orderId,
      reseller_name: name,
      courier: courier,
      address: address,
      status: 'pending',
      created_by: state.session.user.id
    }).select().single();

    var doneCount = 0;
    var totalCount = photoEntries.length;
    var uploadPromises = photoEntries.map(async function(entry, i){
      var pieceId = orderId + '-' + (i + 1);
      var stampedBlob = await drawWatermarkedBlob(entry.blob, pieceId, entry.sizeVal);
      var thumbBlob = await createThumbnailBlob(stampedBlob, 260);

      var path = orderId + '/' + Date.now() + '_' + i + '.jpg';
      var thumbPath = orderId + '/' + Date.now() + '_' + i + '_thumb.jpg';

      var uploadResults = await Promise.all([
        sb.storage.from('order-photos').upload(path, stampedBlob, { contentType: 'image/jpeg' }),
        sb.storage.from('order-photos').upload(thumbPath, thumbBlob, { contentType: 'image/jpeg' })
      ]);
      if(uploadResults[0].error) throw new Error('Photo ' + (i+1) + ' upload failed: ' + uploadResults[0].error.message);
      if(uploadResults[1].error) throw new Error('Thumbnail ' + (i+1) + ' upload failed: ' + uploadResults[1].error.message);

      var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
      var { data: pubThumb } = sb.storage.from('order-photos').getPublicUrl(thumbPath);
      doneCount++;
      if(onProgress){ onProgress(doneCount, totalCount); }
      return { photoUrl: pub.publicUrl, thumbUrl: pubThumb.publicUrl };
    });

    var results = await Promise.all([orderInsertPromise].concat(uploadPromises));
    var orderResult = results[0];
    if(orderResult.error) throw new Error('Order save failed: ' + orderResult.error.message);
    var uploaded = results.slice(1);

    var itemRows = uploaded.map(function(u, idx){
      return {
        order_id: orderId, item_index: idx, photo_url: u.photoUrl, thumb_url: u.thumbUrl, status: 'pending',
        shop_name: (photoEntries[idx].shopVal || '').trim() || null,
        size: (photoEntries[idx].sizeVal || '').trim() || null
      };
    });
    var { data: insertedItems, error: itemsErr } = await sb.from('order_items').insert(itemRows).select();
    if(itemsErr) throw new Error('Photo records failed: ' + itemsErr.message);

    var newOrder = orderResult.data;
    newOrder.items = (insertedItems || []).sort(function(a,b){ return a.item_index - b.item_index; });
    return newOrder;
  }

  // Reverts a single piece (not the whole order) back to pending — used when
  // the "Shipped" tag on an individual photo is tapped.
  function revertSingleItemToPending(itemId){
    var ord = null, item = null;
    state.orders.forEach(function(o){
      (o.items||[]).forEach(function(it){ if(it.id === itemId){ ord = o; item = it; } });
    });
    if(!item) return;

    item.status = 'pending';
    item.shipped_at = null;
    item.shipped_by = null;
    showToast('That piece is pending again');
    render();

    sb.from('order_items').update({ status: 'pending', shipped_at: null, shipped_by: null }).eq('id', itemId).then(function(res){
      if(res.error){
        showToast('Warning: did not save: ' + res.error.message);
        loadOrders();
      }
    });
  }

  async function bulkUpdateOrderItems(orderId, status){
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(!ord) return;
    var patch = { status: status };
    if(status === 'shipped'){ patch.shipped_at = new Date().toISOString(); patch.shipped_by = state.session.user.id; }
    else { patch.shipped_at = null; patch.shipped_by = null; }

    // Update screen instantly; sync to database in background
    var wasCancelled = ord.status === 'cancelled';
    if(wasCancelled){ ord.status = 'pending'; }
    (ord.items||[]).forEach(function(it){
      it.status = status;
      it.shipped_at = patch.shipped_at;
      it.shipped_by = patch.shipped_by;
    });
    showToast(status === 'shipped' ? 'All pieces marked shipped' : 'All pieces marked pending');
    render();

    var dbOps = [sb.from('order_items').update(patch).eq('order_id', orderId)];
    if(wasCancelled){ dbOps.push(sb.from('orders').update({ status: 'pending' }).eq('id', orderId)); }
    Promise.all(dbOps).then(function(results){
      var failed = results.find(function(r){ return r.error; });
      if(failed){
        showToast('Warning: update did not save: ' + failed.error.message);
        loadOrders();
      }
    });
  }

  // Extracts the storage path (e.g. "1023/167_0.jpg") from a Supabase public URL,
  // needed to delete the actual file from the order-photos bucket.
  function storagePathFromUrl(url){
    if(!url) return null;
    var marker = '/storage/v1/object/public/order-photos/';
    var idx = url.indexOf(marker);
    return idx === -1 ? null : url.slice(idx + marker.length);
  }

  async function deleteOrder(id){
    var ord = state.orders.find(function(o){ return o.id === id; });

    // Delete child order_items first — required before the order row can go,
    // since order_items.order_id references orders.id.
    var { error: itemsErr } = await sb.from('order_items').delete().eq('order_id', id);
    if(itemsErr){ showToast('Delete failed: ' + itemsErr.message); return; }

    var { error } = await sb.from('orders').delete().eq('id', id);
    if(error){ showToast('Delete failed: ' + error.message); return; }

    // Best-effort cleanup of the actual photo files — order is already gone
    // from the database at this point either way, so don't block on this.
    try{
      var paths = [];
      if(ord){
        (ord.items||[]).forEach(function(it){
          var p1 = storagePathFromUrl(it.photo_url); if(p1) paths.push(p1);
          var p2 = storagePathFromUrl(it.thumb_url); if(p2) paths.push(p2);
        });
        var pTrack = storagePathFromUrl(ord.tracking_photo_url); if(pTrack) paths.push(pTrack);
      }
      if(paths.length){ sb.storage.from('order-photos').remove(paths); }
    }catch(e){ /* non-critical */ }

    state.orders = state.orders.filter(function(o){ return o.id !== id; });
    showToast('Order deleted');
    closeModal();
    render();
  }

  function cancelOrder(id, reason){

      ord.status = 'cancelled';
      ord.cancel_reason = reason;
      ord.cancelled_at = nowIso;

    render();
    sb.from('orders').update({
      status: 'cancelled',
      cancel_reason: reason,
      cancelled_at: nowIso,
      cancelled_by: state.session.user.id
    }).eq('id', id).then(function(res){
      if(res.error){
        showToast('Warning: cancel did not save: ' + res.error.message);

      }
    });
  }

  async function printAndMarkShipped(){
    var selections = Object.values(state.shipSelection);
    if(selections.length === 0) return;

    var groups = {};
    selections.forEach(function(sel){
      if(!groups[sel.orderId]) groups[sel.orderId] = [];
      groups[sel.orderId].push(sel.itemDbId);
    });

    var orderIds = Object.keys(groups);
    var nowIso = new Date().toISOString();

    // Fire DB updates in the background — print dialog opens instantly
    var updatePromises = orderIds.map(function(orderId){
      return sb.from('order_items').update({
        status: 'shipped', shipped_at: nowIso, shipped_by: state.session.user.id
      }).in('id', groups[orderId]);
    });
    Promise.all(updatePromises).then(function(updateResults){
      var failedUpdate = updateResults.find(function(r){ return r.error; });
      if(failedUpdate){
        showToast('Warning: could not save shipped status: ' + failedUpdate.error.message);
        loadOrders(); // re-sync from server so screen matches database
      }
    });

    // Record this print event for the Print History page (non-critical, fire and forget)
    var printLogRows = orderIds.map(function(orderId){
      var ord0 = state.orders.find(function(o){ return o.id === orderId; });
      return {
        order_id: orderId,
        reseller_name: ord0 ? ord0.reseller_name : null,
        piece_count: groups[orderId].length,
        printed_by: state.session.user.id,
        printed_by_email: state.session.user.email,
        printed_at: nowIso
      };
    });
    sb.from('print_log').insert(printLogRows).then(function(res){
      if(res.error){ console.error('Could not save print history', res.error); }
      else{
        state.printLog = printLogRows.map(function(r, i){ return Object.assign({ id: 'temp' + i }, r); }).concat(state.printLog);
      }
    });

    var slipsHtml = '';
    orderIds.forEach(function(orderId){
      var ord = state.orders.find(function(o){ return o.id === orderId; });
      if(!ord) return;
      var dbIds = groups[orderId];

      (ord.items||[]).forEach(function(it){
        if(dbIds.indexOf(it.id) !== -1){
          it.status = 'shipped';
          it.shipped_at = nowIso;
          it.shipped_by = state.session.user.id;
        }
      });

      var prog = orderProgress(ord);
      var shippingNow = dbIds.length;
      slipsHtml += '<div class="print-slip">';
      slipsHtml += '<div class="slip-top"><span class="slip-id">Order #' + esc(ord.id) + '</span>';
      slipsHtml += '</div>';
      slipsHtml += '<img class="slip-barcode" id="barcode_' + esc(ord.id) + '" alt="">';
      slipsHtml += '<div class="slip-time">Booked: ' + formatTime(ord.created_at) + '</div>';
      slipsHtml += '<div class="slip-time">Printed: ' + formatTime(nowIso) + '</div>';
      if(prog.total > 1){
        slipsHtml += '<div class="slip-time">Shipping ' + shippingNow + ' of ' + prog.total + ' piece(s) in this order</div>';
      }
      if(ord.courier) slipsHtml += '<p class="slip-courier">Courier: ' + esc(ord.courier) + '</p>';
      slipsHtml += '<p class="slip-address">' + esc(ord.address) + '</p>';
      slipsHtml += '</div>';
    });

    document.getElementById('shipPrintArea').innerHTML = slipsHtml;
    orderIds.forEach(function(orderId){
      var ord = state.orders.find(function(o){ return o.id === orderId; });
      if(!ord) return;
      var imgEl = document.getElementById('barcode_' + orderId);
      if(imgEl && window.JsBarcode){
        try{
          var canvas = document.createElement('canvas');
          JsBarcode(canvas, ord.id, { format: 'CODE128', displayValue: false, height: 40, margin: 4, width: 2, background: '#ffffff', lineColor: '#000000' });
          imgEl.src = canvas.toDataURL('image/png');
        }catch(e){ /* if barcode render fails, slip still prints fine without it */ }
      }
    });
    window.print();
    state.shipSelection = {};
    var allShippedIds = [];
    Object.keys(groups).forEach(function(orderId){ allShippedIds = allShippedIds.concat(groups[orderId]); });
    showToastWithAction('Marked shipped and sent to print', 'Undo', function(){
      // Revert exactly the pieces we just marked, back to pending — both on screen and in the database.
      orderIds.forEach(function(orderId){
        var ord2 = state.orders.find(function(o){ return o.id === orderId; });
        if(!ord2) return;
        (ord2.items||[]).forEach(function(it){
          if(allShippedIds.indexOf(it.id) !== -1){
            it.status = 'pending';
            it.shipped_at = null;
            it.shipped_by = null;
          }
        });
      });
      render();
      sb.from('order_items').update({ status: 'pending', shipped_at: null, shipped_by: null }).in('id', allShippedIds).then(function(res){
        if(res.error){
          showToast('Warning: undo did not save: ' + res.error.message);
          loadOrders();
        }else{
          showToast('Undone \u2014 back to pending');
        }
      });
    });
    render();
  }

  // Finds the courier for a scanned tracking number by matching known prefixes.
  // Longest prefix wins, so a more specific rule beats a shorter accidental match.
  function detectCourierFromTracking(val){
    if(!val) return null;
    var v = val.trim().toUpperCase();
    var rules = (state.courierPrefixes || []).slice().sort(function(a,b){
      return b.prefix.length - a.prefix.length;
    });
    for(var i=0;i<rules.length;i++){
      if(v.indexOf(rules[i].prefix.toUpperCase()) === 0){ return rules[i].courier_name; }
    }
    return null;
  }

  // Remembers a prefix->courier mapping for next time (used when staff picks
  // manually for an unrecognized number, or corrects a wrong auto-guess).
  async function learnCourierPrefix(trackingVal, courierName){
    var v = (trackingVal || '').trim().toUpperCase();
    if(!v || !courierName) return;
    var prefixLen = /^[A-Z]/.test(v) ? Math.min(4, v.length) : 3;
    var prefix = v.slice(0, prefixLen);
    if(!prefix) return;
    try{
      var res = await sb.from('courier_prefixes').upsert(
        { prefix: prefix, courier_name: courierName },
        { onConflict: 'prefix' }
      ).select();
      if(!res.error && res.data && res.data[0]){
        var idx = state.courierPrefixes.findIndex(function(r){ return r.prefix === prefix; });
        if(idx === -1){ state.courierPrefixes.push({ prefix: prefix, courier_name: courierName }); }
        else{ state.courierPrefixes[idx].courier_name = courierName; }
      }
    }catch(e){ /* non-critical, fail silently */ }
  }

  // Shared save path used by both the manual tracking list and Scan Mode.
  // Returns { ok: true } or { ok: false, message: '...' }.
  async function saveTrackingForOrder(orderId, trackingVal, courierName, resetShared){
    var val = (trackingVal || '').trim();
    if(!val) return { ok: false, message: 'Enter a tracking number' };
    var patch = { tracking_number: val };
    if(courierName){ patch.courier = courierName; }
    if(resetShared){ patch.tracking_shared_at = null; }
    var { error } = await sb.from('orders').update(patch).eq('id', orderId);
    if(error) return { ok: false, message: error.message };
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(ord){
      ord.tracking_number = val;
      if(courierName) ord.courier = courierName;
      if(resetShared) ord.tracking_shared_at = null;
    }
    if(courierName){ learnCourierPrefix(val, courierName); }
    return { ok: true };
  }

  async function processScanValue(raw){
    var val = (raw || '').trim();
    if(!val) return;
    var sm = state.scanMode;

    // If the scanned value matches an existing order id exactly, treat it as
    // selecting/switching to that order — regardless of current stage.
    var matchedOrder = state.orders.find(function(o){ return o.id.toLowerCase() === val.toLowerCase(); });
    if(matchedOrder){
      if(matchedOrder.tracking_number){
        showToast('Order #' + matchedOrder.id + ' already has tracking ' + matchedOrder.tracking_number + ' \u2014 scan a new one to replace it');
      }
      sm.selectedOrderId = matchedOrder.id;
      sm.stage = 'tracking';
      sm.pendingTrackingVal = null;
      renderScanModeOnly();
      return;
    }

    if(sm.stage !== 'tracking' || !sm.selectedOrderId){
      showToast('Order #' + val + ' not found \u2014 scan the order barcode first');
      renderScanModeOnly();
      return;
    }

    var detected = detectCourierFromTracking(val);
    if(detected){
      var result = await saveTrackingForOrder(sm.selectedOrderId, val, detected);
      if(!result.ok){ showToast('Could not save: ' + result.message); renderScanModeOnly(); return; }
      sm.savedCount++;
      showToast('#' + sm.selectedOrderId + ' \u2192 ' + detected + ' saved');
      sm.stage = 'order';
      sm.selectedOrderId = null;
      sm.pendingTrackingVal = null;
      render();
    }else{
      sm.pendingTrackingVal = val;
      renderScanModeOnly();
    }
  }

  async function scanParcelPhotos(files){
    state.trackingOcrProcessing = true;
    render();

    for(var i=0;i<files.length;i++){
      try{
        var resizedBlob = await resizeImageToBlob(files[i], 1000);
        var result = await Tesseract.recognize(resizedBlob, 'eng');
        var text = (result && result.data) ? result.data.text : '';
        var match = findOrderIdInText(text);
        var matchedOrder = match ? state.orders.find(function(o){ return o.id === match; }) : null;
        if(matchedOrder){
          await attachTrackingPhoto(matchedOrder, resizedBlob);
        }else{
          state.trackingUnmatched.push({ blob: resizedBlob, previewUrl: URL.createObjectURL(resizedBlob) });
        }
      }catch(err){
        showToast('Could not read a photo: ' + (err && err.message ? err.message : 'try again'));
      }
    }

    state.trackingOcrProcessing = false;
    render();
    showToast('Finished scanning ' + files.length + ' photo' + (files.length!==1?'s':''));
  }

  function findOrderIdInText(text){
    var matches = text.match(/#?\s*(\d{3,5})/g);
    if(!matches) return null;
    var candidates = matches.map(function(m){ return m.replace(/[#\s]/g,''); });
    var validIds = Array.from(new Set(candidates.filter(function(c){
      return state.orders.some(function(o){ return o.id === c; });
    })));
    return validIds.length === 1 ? validIds[0] : null;
  }

  async function attachTrackingPhoto(ord, blob){
    var path = ord.id + '/tracking_' + Date.now() + '.jpg';
    var { error: upErr } = await sb.storage.from('order-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if(upErr){ showToast('Upload failed: ' + upErr.message); return; }
    var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
    var { error } = await sb.from('orders').update({ tracking_photo_url: pub.publicUrl }).eq('id', ord.id);
    if(error){ showToast('Could not save: ' + error.message); return; }
    ord.tracking_photo_url = pub.publicUrl;
  }

  async function shareTrackingToWhatsApp(reseller, btn){
    var orders = state.orders.filter(function(o){ return o.reseller_name === reseller && (o.tracking_photo_url || o.tracking_number) && !o.tracking_shared_at; });
    if(orders.length === 0) return;
    var batch = orders.slice(0, 10);

    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }

    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    var textLines = ['Tracking updates:'];
    batch.forEach(function(o){
      textLines.push('#' + o.id + (o.tracking_number ? ' \u2014 ' + o.tracking_number : ' \u2014 tracking number coming soon'));
    });
    var messageText = textLines.join('\n');

    try{
      var withPhoto = batch.filter(function(o){ return o.tracking_photo_url; });
      var files = await Promise.all(withPhoto.map(async function(o){
        var res = await fetch(o.tracking_photo_url);
        var blob = await res.blob();
        return new File([blob], 'tracking_' + o.id + '.jpg', { type: 'image/jpeg' });
      }));

      var shareData = files.length > 0 ? { files: files, text: messageText } : { text: messageText };
      if(files.length > 0 && navigator.canShare && !navigator.canShare(shareData)){
        showToast('Your phone can\u2019t share this many at once \u2014 try fewer');
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        return;
      }

      await navigator.share(shareData);
      openTrackingShareConfirm(reseller, batch);
    }catch(err){
      if(err && err.name === 'AbortError'){
        // user cancelled the share sheet
      }else{
        showToast('Could not prepare photos: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  function openTrackingShareConfirm(reseller, batch){

  var DRAW_COLORS = ['#3fa9f5', '#000000', '#ffffff', '#e05c5c', '#34a853', '#fdd663'];

  function openDrawTool(photoIdx){
    var photo = state.bookPhotos[photoIdx];
    if(!photo) return;

    document.getElementById('modalHost').innerHTML =
      '<div class="modal-overlay" style="padding:0;">' +
        '<div class="draw-modal-box">' +
          '<div class="draw-header"><h2>Cover unwanted text</h2><button class="draw-close-btn" id="drawCloseBtn">\u00d7</button></div>' +
          '<div class="draw-canvas-wrap"><canvas id="drawCanvas"></canvas></div>' +
          '<div class="draw-controls">' +
            '<div class="draw-colors" id="drawColors"></div>' +
            '<div class="draw-actions">' +
              '<button class="btn-draw-undo" id="drawUndoBtn">Undo</button>' +
              '<button class="btn-draw-cancel" id="drawCancelBtn">Cancel</button>' +
              '<button class="btn-draw-done" id="drawDoneBtn">Done</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var colorsHost = document.getElementById('drawColors');
    var currentColor = DRAW_COLORS[0];
    DRAW_COLORS.forEach(function(c, i){
      var sw = document.createElement('button');
      sw.className = 'draw-color-swatch' + (i===0?' active':'');
      sw.style.background = c;
      sw.addEventListener('click', function(){
        currentColor = c;
        document.querySelectorAll('.draw-color-swatch').forEach(function(s){ s.classList.remove('active'); });
        sw.classList.add('active');
      });
      colorsHost.appendChild(sw);
    });

    var canvas = document.getElementById('drawCanvas');
    var ctx = canvas.getContext('2d');
    var img = new Image();
    var strokes = [];
    var currentStroke = null;
    var drawing = false;

    function redraw(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      strokes.forEach(function(s){ paintStroke(s); });
    }

    function paintStroke(s){
      if(s.points.length < 1) return;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = Math.max(canvas.width, canvas.height) * 0.045;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i].x, s.points[i].y); }
      if(s.points.length === 1){ ctx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1); }
      ctx.stroke();
    }

    function getCanvasPoint(e){
      var rect = canvas.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDraw(e){
      e.preventDefault();
      drawing = true;
      currentStroke = { color: currentColor, points: [getCanvasPoint(e)] };
      strokes.push(currentStroke);
      paintStroke(currentStroke);
    }
    function moveDraw(e){
      if(!drawing) return;
      e.preventDefault();
      currentStroke.points.push(getCanvasPoint(e));
      redraw();
    }
    function endDraw(e){
      drawing = false;
      currentStroke = null;
    }

    img.onload = function(){
      canvas.width = img.width;
      canvas.height = img.height;
      redraw();
    };
    img.src = photo.previewUrl;

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    document.getElementById('drawCloseBtn').addEventListener('click', closeModal);
    document.getElementById('drawCancelBtn').addEventListener('click', closeModal);
    document.getElementById('drawUndoBtn').addEventListener('click', function(){
      strokes.pop();
      redraw();
    });
    document.getElementById('drawDoneBtn').addEventListener('click', function(){
      document.removeEventListener('keydown', drawEnterHandler);
      canvas.toBlob(function(blob){
        if(!blob){ showToast('Could not save the edit \u2014 try again'); return; }
        var newUrl = URL.createObjectURL(blob);
        state.bookPhotos[photoIdx].blob = blob;
        state.bookPhotos[photoIdx].previewUrl = newUrl;
        closeModal();
        render();
        showToast('Photo updated');
      }, 'image/jpeg', 0.85);
    });

    var drawEnterHandler = function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        document.getElementById('drawDoneBtn').click();
      }
    };
    document.addEventListener('keydown', drawEnterHandler);
    document.getElementById('drawCloseBtn').addEventListener('click', function(){ document.removeEventListener('keydown', drawEnterHandler); });
    document.getElementById('drawCancelBtn').addEventListener('click', function(){ document.removeEventListener('keydown', drawEnterHandler); });
  }

  function wireBookTab(){

      try{

        var blobs = await Promise.all(slice.map(function(f){ return resizeImageToBlob(f, 900); }));
        var withPreview = blobs.map(function(b){ return { blob: b, previewUrl: URL.createObjectURL(b), shopVal: 'Shop Name Pending', sizeVal: '' }; });
        state.bookPhotos = state.bookPhotos.concat(withPreview).slice(0,50);

    document.querySelectorAll('.photo-remove').forEach(function(btn){

    if(addressInput) addressInput.addEventListener('input', function(){ state.addressVal = addressInput.value; });
    if(nameInput) nameInput.addEventListener('input', function(){ state.nameVal = nameInput.value; });
    if(courierInput) courierInput.addEventListener('input', function(){ state.courierVal = courierInput.value; });
    if(nameInput) nameInput.addEventListener('blur', function(){
      tryAutocomplete(nameInput, state.resellers);
      state.nameVal = nameInput.value;
    });
    if(courierInput) courierInput.addEventListener('blur', function(){
      tryAutocomplete(courierInput, state.couriers || []);
      state.courierVal = courierInput.value;
    });
    if(nameInput) nameInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        tryAutocomplete(nameInput, state.resellers);
        state.nameVal = nameInput.value;
        if(courierInput) courierInput.focus();
      }
    });
    if(courierInput) courierInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){
        e.preventDefault();
        tryAutocomplete(courierInput, state.couriers || []);
        state.courierVal = courierInput.value;
        if(addressInput) addressInput.focus();
      }
    });
    if(addressInput) addressInput.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.shiftKey){
        e.preventDefault();
        state.addressVal = addressInput.value;
        var btn = document.getElementById('saveOrderBtn');
        if(btn) btn.click();
      }
      // Shift+Enter still inserts a normal line break for multi-line addresses.
    });

    var saveBtn = document.getElementById('saveOrderBtn');
    saveBtn && saveBtn.addEventListener('click', async function(){
      // Resolve any partial typing (e.g. "1191") to the full matching entry
      // one more time right before validating, in case Save was clicked
      // without the field ever losing focus.
      if(nameInput) tryAutocomplete(nameInput, state.resellers);
      if(courierInput) tryAutocomplete(courierInput, state.couriers || []);
      document.querySelectorAll('.photoShopInput').forEach(function(inp){ tryAutocomplete(inp, state.shops); });

      var name = (nameInput ? nameInput.value : state.nameVal || '').trim();
      var address = (state.addressVal || '').trim();
      var courier = (courierInput ? courierInput.value : state.courierVal || '').trim();
      state.nameVal = name;
      state.courierVal = courier;

      if(state.bookPhotos.length === 0){ state.bookError = 'Add at least one photo'; render(); return; }
      if(!name){ state.bookError = 'Select a reseller'; render(); return; }
      if(!isExactListMatch(name, state.resellers)){ state.bookError = 'Reseller "' + name + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'; render(); return; }
      if(!isExactListMatch(courier, state.couriers || [])){ state.bookError = 'Courier "' + courier + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'; render(); return; }
      var badShop = null;
      state.bookPhotos.forEach(function(p, i){
        if(badShop) return;
        if(!(p.shopVal||'').trim()){ badShop = { idx: i, val: '(empty)' }; }
        else if(!isExactListMatch(p.shopVal, state.shops)){ badShop = { idx: i, val: p.shopVal }; }
      });
      if(badShop){ state.bookError = 'Pick a shop for photo ' + (badShop.idx+1) + ' \u2014 use "Shop Name Pending" if you don\u2019t know it yet'; render(); return; }
      if(!address){ state.bookError = 'Enter delivery address'; render(); return; }
      state.bookError = '';
      state.saving = true;
      render();
      try{
        var newOrder = await saveOrder(name, courier, address, state.bookPhotos, function(done, total){
          var liveBtn = document.getElementById('saveOrderBtn');
          if(liveBtn){ liveBtn.innerHTML = '<span class="spinner-sm"></span>Saving photo ' + done + ' of ' + total + '\u2026'; }
        });
        showToast('Order #' + newOrder.id + ' saved');
        // Add to local state instantly — no full reload needed
        state.orders.unshift(newOrder);
        addToLocalList(state.resellers, name);
        addToLocalList(state.couriers, courier);
        newOrder.items.forEach(function(it){
          addToLocalList(state.shops, it.shop_name);
          addToLocalList(state.sizes, it.size);
        });
        state.bookPhotos = [];
        state.nameVal = ''; state.courierVal = ''; state.addressVal = '';
        state.saving = false;
        state.tab = 'orders';
        render();
      }catch(err){
        state.bookError = 'Could not save: ' + (err && err.message ? err.message : String(err));
        state.saving = false;
        render();
      }
    });
  }

  function renderPrintHistoryTab(){

      html += '<div class="loading-state"><span class="spinner"></span>Loading print history...</div>';

      }catch(err){

  async function saveEditOrder(){
    var orderId = state.editOrderId;
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(!ord) return;

    var nameInputEl = document.getElementById('editNameInput');
    var courierInputEl = document.getElementById('editCourierInput');
    // Resolve any partial typing (e.g. "1191") to the full matching entry.
    tryAutocomplete(nameInputEl, state.resellers);
    tryAutocomplete(courierInputEl, state.couriers || []);
    document.querySelectorAll('.editItemShop').forEach(function(inp){ tryAutocomplete(inp, state.shops); });
    document.querySelectorAll('.editNewItemShop').forEach(function(inp){ tryAutocomplete(inp, state.shops); });

    var name = (nameInputEl.value || '').trim();
    var courier = (courierInputEl.value || '').trim();
    var address = (document.getElementById('editAddressInput').value || '').trim();
    if(!name){ showToast('Reseller name is required'); return; }
    if(!isExactListMatch(name, state.resellers)){ showToast('Reseller "' + name + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'); return; }
    if(!isExactListMatch(courier, state.couriers || [])){ showToast('Courier "' + courier + '" isn\u2019t in your list \u2014 check spelling, or add it in Manage Lists'); return; }
    var badShop = null;
    document.querySelectorAll('.editItemShop, .editNewItemShop').forEach(function(inp){
      if(badShop) return;
      if(!(inp.value||'').trim()){ badShop = '(empty)'; }
      else if(!isExactListMatch(inp.value, state.shops)){ badShop = inp.value; }
    });
    if(badShop){ showToast('Every piece needs a shop \u2014 use "Shop Name Pending" if you don\u2019t know it yet'); return; }
    if(!address){ showToast('Address is required'); return; }

    var visibleItems = (ord.items||[]).filter(function(it){ return state.editOrderRemovedItemIds.indexOf(it.id) === -1; });
    if(visibleItems.length === 0 && state.editOrderPhotos.length === 0){
      showToast('An order needs at least one piece \u2014 delete the whole order instead if that\u2019s what you want');
      return;
    }

    state.editOrderSaving = true;
    renderEditOrderModal();

    try{
      // 1. Order-level fields
      var { error: ordErr } = await sb.from('orders').update({ reseller_name: name, courier: courier, address: address }).eq('id', orderId);
      if(ordErr) throw new Error(ordErr.message);

      // 2. Shop/size on remaining existing items
      var itemUpdatePromises = [];
      document.querySelectorAll('.editItemShop').forEach(function(inp){
        var itemId = parseInt(inp.getAttribute('data-item-id'), 10);
        var sizeInp = document.querySelector('.editItemSize[data-item-id="' + itemId + '"]');
        var shopVal = (inp.value || '').trim() || null;
        var sizeVal = sizeInp ? ((sizeInp.value || '').trim() || null) : null;
        itemUpdatePromises.push(
          sb.from('order_items').update({ shop_name: shopVal, size: sizeVal }).eq('id', itemId)
        );
      });
      await Promise.all(itemUpdatePromises);

      // 3. Remove deleted items (+ best-effort storage cleanup)
      if(state.editOrderRemovedItemIds.length){
        var removedItems = (ord.items||[]).filter(function(it){ return state.editOrderRemovedItemIds.indexOf(it.id) !== -1; });
        var { error: delErr } = await sb.from('order_items').delete().in('id', state.editOrderRemovedItemIds);
        if(delErr) throw new Error(delErr.message);
        try{
          var paths = [];
          removedItems.forEach(function(it){
            var p1 = storagePathFromUrl(it.photo_url); if(p1) paths.push(p1);
            var p2 = storagePathFromUrl(it.thumb_url); if(p2) paths.push(p2);
          });
          if(paths.length){ sb.storage.from('order-photos').remove(paths); }
        }catch(e){ /* non-critical */ }
      }

      // 4. Upload and insert any newly added photos
      var newItemsInserted = [];
      if(state.editOrderPhotos.length){
        var existingMaxIndex = (ord.items||[]).reduce(function(max, it){ return Math.max(max, it.item_index); }, -1);
        var newShopVals = [], newSizeVals = [];
        state.editOrderPhotos.forEach(function(p, idx){
          var shopInp = document.querySelector('.editNewItemShop[data-idx="' + idx + '"]');
          var sizeInp = document.querySelector('.editNewItemSize[data-idx="' + idx + '"]');
          newShopVals.push(shopInp ? shopInp.value : '');
          newSizeVals.push(sizeInp ? sizeInp.value : '');
        });
        var uploadResults = await Promise.all(state.editOrderPhotos.map(async function(p, idx){
          var newIndex = existingMaxIndex + 1 + idx;
          var pieceId = orderId + '-' + (newIndex + 1);
          var stampedBlob = await drawWatermarkedBlob(p.blob, pieceId, newSizeVals[idx]);
          var thumbBlob = await createThumbnailBlob(stampedBlob, 260);
          var path = orderId + '/' + Date.now() + '_' + newIndex + '.jpg';
          var thumbPath = orderId + '/' + Date.now() + '_' + newIndex + '_thumb.jpg';
          var results = await Promise.all([
            sb.storage.from('order-photos').upload(path, stampedBlob, { contentType: 'image/jpeg' }),
            sb.storage.from('order-photos').upload(thumbPath, thumbBlob, { contentType: 'image/jpeg' })
          ]);
          if(results[0].error) throw new Error('Photo upload failed: ' + results[0].error.message);
          if(results[1].error) throw new Error('Thumbnail upload failed: ' + results[1].error.message);
          var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
          var { data: pubThumb } = sb.storage.from('order-photos').getPublicUrl(thumbPath);
          return {
            order_id: orderId, item_index: newIndex, photo_url: pub.publicUrl, thumb_url: pubThumb.publicUrl,
            status: 'pending', shop_name: (newShopVals[idx]||'').trim() || null, size: (newSizeVals[idx]||'').trim() || null
          };
        }));
        var { data: inserted, error: insErr } = await sb.from('order_items').insert(uploadResults).select();
        if(insErr) throw new Error(insErr.message);
        newItemsInserted = inserted || [];
      }

      // 5. Sync local state
      ord.reseller_name = name;
      ord.courier = courier;
      ord.address = address;
      ord.items = (ord.items||[])
        .filter(function(it){ return state.editOrderRemovedItemIds.indexOf(it.id) === -1; })
        .map(function(it){
          var shopInp = document.querySelector('.editItemShop[data-item-id="' + it.id + '"]');
          var sizeInp = document.querySelector('.editItemSize[data-item-id="' + it.id + '"]');
          if(shopInp) it.shop_name = (shopInp.value||'').trim() || null;
          if(sizeInp) it.size = (sizeInp.value||'').trim() || null;
          return it;
        })
        .concat(newItemsInserted)
        .sort(function(a,b){ return a.item_index - b.item_index; });

      addToLocalList(state.resellers, name);
      addToLocalList(state.couriers, courier);
      ord.items.forEach(function(it){ addToLocalList(state.shops, it.shop_name); addToLocalList(state.sizes, it.size); });

      state.editOrderSaving = false;
      closeModal();
      showToast('Order #' + orderId + ' updated');
      render();
    }catch(err){
      state.editOrderSaving = false;
      showToast('Could not save changes: ' + (err && err.message ? err.message : String(err)));
      renderEditOrderModal();
    }
  }

  // ===== BY SHOP TAB =====

  // Every 5 minutes while someone is logged in, pop up a box showing every
  // piece still waiting on a real shop — with its photo and a shop field
  // right there, so it can be fixed without leaving whatever screen you're on.
  function checkShopPendingReminder(){
    if(!state.session) return;
    if(document.getElementById('modalHost') && document.getElementById('modalHost').innerHTML.trim() !== '') return; // don't interrupt an open modal
    var entries = getItemsNeedingShop();
    if(entries.length === 0) return;
    openShopReminderModal(entries);
  }

  function openShopReminderModal(entries){
    var html = '<div class="modal-overlay"><div class="modal-box" style="max-width:420px;text-align:left;max-height:85vh;overflow-y:auto;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 4px;color:#f2a76a;">\u26a0\ufe0f Shop pending on ' + entries.length + ' piece' + (entries.length!==1?'s':'') + '</p>';
    html += '<p style="font-size:12px;color:#9aa0a6;margin:0 0 14px;">Pick a shop for each one below, or close and do it later.</p>';
    entries.forEach(function(e){
      var pieceId = e.order.id + '-' + (e.itemIndex+1);
      html += '<div class="order-card">';
      html += '<div class="order-top"><span class="order-id">#' + esc(pieceId) + '</span><span style="font-size:12px;color:#9aa0a6;">' + esc(e.order.reseller_name) + '</span></div>';
      html += '<div style="display:flex;gap:10px;align-items:center;margin-top:8px;">';
      html += '<img class="orderPhoto" data-src="' + e.item.photo_url + '" src="' + (e.item.thumb_url || e.item.photo_url) + '" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:zoom-in;">';
      html += '<input type="text" class="reminderShopInput" data-item-id="' + e.item.id + '" list="shopList" autocomplete="off" placeholder="Type shop name" style="flex:1;">';
      html += '<button class="btn-secondary reminderShopSaveBtn" data-item-id="' + e.item.id + '">Save</button>';
      html += '</div></div>';
    });
    html += '<button class="btn-secondary" id="reminderCloseBtn" style="width:100%;margin-top:6px;">Close \u2014 remind me later</button>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    wireShopReminderModal();
  }

  function wireShopReminderModal(){
    document.getElementById('reminderCloseBtn').addEventListener('click', closeModal);
    document.querySelectorAll('#modalHost .orderPhoto').forEach(function(img){
      img.addEventListener('click', function(){ openZoom(img.getAttribute('data-src')); });
    });
    document.querySelectorAll('.reminderShopInput').forEach(function(inp){
      inp.addEventListener('blur', function(){ tryAutocomplete(inp, state.shops); });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          var btn = document.querySelector('.reminderShopSaveBtn[data-item-id="' + inp.getAttribute('data-item-id') + '"]');
          if(btn) btn.click();
        }
      });
    });
    document.querySelectorAll('.reminderShopSaveBtn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var itemId = parseInt(btn.getAttribute('data-item-id'), 10);
        var inp = document.querySelector('.reminderShopInput[data-item-id="' + itemId + '"]');
        tryAutocomplete(inp, state.shops);
        var val = (inp.value || '').trim();
        if(!val){ showToast('Type a shop name first'); return; }
        if(!isExactListMatch(val, state.shops)){ showToast('"' + val + '" isn\u2019t in your shop list \u2014 check spelling, or add it in Manage Lists'); return; }
        var { error } = await sb.from('order_items').update({ shop_name: val }).eq('id', itemId);
        if(error){ showToast('Could not save: ' + error.message); return; }
        state.orders.forEach(function(o){
          (o.items||[]).forEach(function(it){ if(it.id === itemId){ it.shop_name = val; } });
        });
        showToast('Shop saved');
        var remaining = getItemsNeedingShop();
        if(remaining.length === 0){ closeModal(); render(); }
        else{ openShopReminderModal(remaining); }
      });
    });
  }

  function startShopReminderIfNeeded(){
    if(shopReminderIntervalId) return; // already running
    shopReminderIntervalId = setInterval(checkShopPendingReminder, 5 * 60 * 1000);
    setTimeout(checkShopPendingReminder, 15000); // first nudge shortly after login, not a full 5-minute wait
  }
  function stopShopReminder(){
    if(shopReminderIntervalId){ clearInterval(shopReminderIntervalId); shopReminderIntervalId = null; }
  }

  // Pieces that were booked without a shop picked yet — invisible to the
  // normal by-shop grouping below since there's no shop_name to group by.
  var SHOP_PENDING_LABEL = 'Shop Name Pending';

  function getItemsNeedingShop(){
    var results = [];
    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      (o.items||[]).forEach(function(item, idx){
        var pending = !item.shop_name || item.shop_name === SHOP_PENDING_LABEL;
        if(!pending || item.status === 'shipped') return;
        results.push({ order: o, item: item, itemIndex: idx });
      });
    });
    return results;
  }

  function getShopSummary(mode){
    var byShop = {};
    state.orders.forEach(function(o){
      (o.items||[]).forEach(function(item, idx){
        if(!item.shop_name || item.shop_name === SHOP_PENDING_LABEL) return;
        var include = false;
        if(mode === 'need'){
          include = (o.status !== 'cancelled') && !item.shop_booked_at;
        }else if(mode === 'pending'){
          include = (o.status !== 'cancelled') && !!item.shop_booked_at && item.status === 'pending';
        }else{
          include = true;
        }
        if(!include) return;
        var key = item.shop_name;
        if(!byShop[key]) byShop[key] = [];
        byShop[key].push({ order: o, item: item, itemIndex: idx });
      });
    });
    return byShop;
  }

  function renderNeedsShopView(query){
    var entries = getItemsNeedingShop();
    if(query){
      entries = entries.filter(function(e){
        var pieceId = (e.order.id + '-' + (e.itemIndex+1)).toLowerCase();
        var hay = (pieceId + ' ' + e.order.id + ' ' + e.order.reseller_name).toLowerCase();
        return hay.indexOf(query) !== -1;
      });
    }
    var html = '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Booked without a shop picked yet \u2014 pick one for each piece below so it shows up in \u201cNeed to book\u201d.</p>';
    if(entries.length === 0){
      html += '<div class="empty-state">' + (query ? 'No matches for that search.' : 'Nothing pending \u2014 every piece has a shop assigned.') + '</div>';
      return html;
    }
    entries.forEach(function(e){
      var pieceId = e.order.id + '-' + (e.itemIndex+1);
      html += '<div class="order-card">';
      html += '<div class="order-top"><span class="order-id">#' + esc(pieceId) + '</span><span style="font-size:12px;color:#9aa0a6;">' + esc(e.order.reseller_name) + '</span></div>';
      html += '<div style="display:flex;gap:10px;align-items:center;margin-top:8px;">';
      html += '<img class="orderPhoto" data-src="' + e.item.photo_url + '" src="' + (e.item.thumb_url || e.item.photo_url) + '" style="width:52px;height:52px;object-fit:cover;border-radius:8px;flex-shrink:0;cursor:zoom-in;">';
      html += '<input type="text" class="needShopInput" data-item-id="' + e.item.id + '" list="shopList" autocomplete="off" placeholder="Type shop name" style="flex:1;">';
      html += '<button class="btn-secondary needShopSaveBtn" data-item-id="' + e.item.id + '">Save</button>';
      html += '</div></div>';
    });
    return html;
  }

  function renderShopsTab(){
    var mode = state.shopBookingView || 'need';
    var byShop = getShopSummary(mode);
    var query = (state.shopBookingQuery || '').trim().toLowerCase();
    var html = '';

    html += '<input class="searchbar" type="text" id="shopBookingSearch" autocomplete="off" placeholder="Search shop, order id, or reseller" value="' + esc(state.shopBookingQuery || '') + '">';

    html += '<div class="filters">';
    html += '<div class="filter-chip' + (mode==='need'?' active':'') + '" data-view="need">Need to book</div>';
    html += '<div class="filter-chip' + (mode==='pending'?' active':'') + '" data-view="pending">Pending</div>';
    html += '<div class="filter-chip' + (mode==='noshop'?' active':'') + '" data-view="noshop">Needs shop' + (getItemsNeedingShop().length ? ' (' + getItemsNeedingShop().length + ')' : '') + '</div>';
    html += '<div class="filter-chip' + (mode==='all'?' active':'') + '" data-view="all">All</div>';
    html += '</div>';

    if(mode === 'noshop'){
      return html + renderNeedsShopView(query);
    }

    if(mode === 'need'){
      html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Pieces still waiting to be forwarded to each shop.</p>';
    }else if(mode === 'pending'){
      html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Already booked with the shop, waiting for them to provide the piece. This clears automatically once the order is shipped.</p>';
    }else{
      html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Full record of everything ever tagged to a shop \u2014 including shipped and cancelled.</p>';
    }

    if(query){
      var filtered = {};
      Object.keys(byShop).forEach(function(shop){
        var matchingEntries = byShop[shop].filter(function(entry){
          var pieceId = (entry.order.id + '-' + (entry.itemIndex+1)).toLowerCase();
          var hay = (shop + ' ' + pieceId + ' ' + entry.order.id + ' ' + entry.order.reseller_name).toLowerCase();
          return hay.indexOf(query) !== -1;
        });
        if(matchingEntries.length > 0) filtered[shop] = matchingEntries;
      });
      byShop = filtered;
    }

    var shopKeys = Object.keys(byShop).sort();

    if(shopKeys.length === 0){
      html += '<div class="empty-state">' + (query ? 'No matches for that search.' : 'Nothing here right now.') + '</div>';
      return html;
    }

    var statusLabel = { pending: 'Pending', shipped: 'Shipped', cancelled: 'Cancelled' };
    var statusClass = { pending: 'status-pending', shipped: 'status-shipped', cancelled: 'status-cancelled' };

    shopKeys.forEach(function(shop){
      var entries = byShop[shop];
      html += '<div class="shop-row">';
      html += '<div class="shop-row-header">';
      html += '<span class="shop-row-name">' + esc(shop) + '</span>';
      html += '<span class="shop-row-count">' + entries.length + ' piece' + (entries.length!==1?'s':'') + '</span>';
      if(mode === 'need'){
        html += '<button class="btn-whatsapp shop-share-btn" data-shop="' + esc(shop) + '">Share to WhatsApp</button>';
      }
      html += '</div>';
      html += '<div class="shop-row-tray">';
      entries.forEach(function(entry){
        var pieceId = entry.order.id + '-' + (entry.itemIndex+1);
        var st = entry.order.status === 'cancelled' ? 'cancelled' : entry.item.status;
        html += '<div class="shop-tray-item">';
        html += '<img class="orderPhoto" data-src="' + entry.item.photo_url + '" src="' + (entry.item.thumb_url || entry.item.photo_url) + '" loading="lazy" decoding="async">';
        if(mode === 'all'){
          html += '<span style="position:absolute;top:4px;right:4px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,0.8);color:#fff;">' + statusLabel[st] + '</span>';
        }
        html += '<div class="shop-tray-caption">#' + esc(pieceId) + ' \u00b7 ' + esc(entry.order.reseller_name) + '</div>';
        html += '</div>';
      });
      html += '</div></div>';
    });

    return html;
  }

  function wireShopsTab(){
    var searchInput = document.getElementById('shopBookingSearch');
    if(searchInput){
      searchInput.addEventListener('input', function(){
        state.shopBookingQuery = searchInput.value;
        document.getElementById('tabContent').innerHTML = renderShopsTab();
        wireShopsTab();
        var refocused = document.getElementById('shopBookingSearch');
        if(refocused){ refocused.focus(); refocused.setSelectionRange(refocused.value.length, refocused.value.length); }
      });
    }
    document.querySelectorAll('[data-view]').forEach(function(chip){
      chip.addEventListener('click', function(){
        state.shopBookingView = chip.getAttribute('data-view');
        render();
      });
    });
    document.querySelectorAll('.orderPhoto').forEach(function(img){
      img.addEventListener('click', function(){ openZoom(img.getAttribute('data-src')); });
    });
    document.querySelectorAll('.shop-share-btn').forEach(function(btn){
      btn.addEventListener('click', function(){ shareShopToWhatsApp(btn.getAttribute('data-shop'), btn); });
    });
    document.querySelectorAll('.needShopInput').forEach(function(inp){
      inp.addEventListener('blur', function(){ tryAutocomplete(inp, state.shops); });
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          var btn = document.querySelector('.needShopSaveBtn[data-item-id="' + inp.getAttribute('data-item-id') + '"]');
          if(btn) btn.click();
        }
      });
    });
    document.querySelectorAll('.needShopSaveBtn').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var itemId = parseInt(btn.getAttribute('data-item-id'), 10);
        var inp = document.querySelector('.needShopInput[data-item-id="' + itemId + '"]');
        tryAutocomplete(inp, state.shops);
        var val = (inp.value || '').trim();
        if(!val){ showToast('Type a shop name first'); return; }
        if(!isExactListMatch(val, state.shops)){ showToast('"' + val + '" isn\u2019t in your shop list \u2014 check spelling, or add it in Manage Lists'); return; }
        var { error } = await sb.from('order_items').update({ shop_name: val }).eq('id', itemId);
        if(error){ showToast('Could not save: ' + error.message); return; }
        state.orders.forEach(function(o){
          (o.items||[]).forEach(function(it){ if(it.id === itemId){ it.shop_name = val; } });
        });
        showToast('Shop saved \u2014 now in "Need to book"');
        render();
      });
    });
  }

  async function shareShopToWhatsApp(shopName, btn){
    var byShop = getShopSummary('need');
    var entries = byShop[shopName] || [];
    if(entries.length === 0) return;

    var batch = entries.slice(0, 10);

    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }

    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    try{
      var files = await Promise.all(batch.map(async function(entry){
        var res = await fetch(entry.item.photo_url);
        var blob = await res.blob();
        var pieceId = entry.order.id + '-' + (entry.itemIndex+1);
        return new File([blob], shopName + '_' + pieceId + '.jpg', { type: 'image/jpeg' });
      }));

      var shareData = { files: files, text: shopName };
      if(navigator.canShare && !navigator.canShare(shareData)){
        showToast('Your phone can\u2019t share this many photos at once \u2014 try fewer');
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        return;
      }

      await navigator.share(shareData);
      openShareConfirm(shopName, batch);
    }catch(err){
      if(err && err.name === 'AbortError'){
        // user cancelled the share sheet, nothing to do
      }else{
        showToast('Could not prepare photos: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  function openShareConfirm(shopName, batch){
    document.getElementById('modalHost').innerHTML =
      '<div class="modal-overlay"><div class="modal-box">' +
        '<p style="font-size:14px;margin:0;">Did you send these ' + batch.length + ' photo' + (batch.length!==1?'s':'') + ' to <b>' + esc(shopName) + '</b>\u2019s WhatsApp group?</p>' +
        '<div class="modal-actions">' +
          '<button id="shareNoBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">No, didn\u2019t send</button>' +
          '<button id="shareYesBtn" style="background:#34a853;color:#06210f;border:none;">Yes, sent</button>' +
        '</div></div></div>';
    document.getElementById('shareNoBtn').addEventListener('click', closeModal);
    document.getElementById('shareYesBtn').addEventListener('click', function(){
      var ids = batch.map(function(entry){ return entry.item.id; });
      var nowIso = new Date().toISOString();
      // Update screen instantly; sync to database in background
      batch.forEach(function(entry){
        entry.item.shop_booked_at = nowIso;
        entry.item.shop_booked_by = state.session.user.id;
      });
      closeModal();
      showToast('Marked as booked with ' + shopName);
      render();
      sb.from('order_items').update({
        shop_booked_at: nowIso,
        shop_booked_by: state.session.user.id
      }).in('id', ids).then(function(res){
        if(res.error){
          showToast('Warning: booking status did not save: ' + res.error.message);
          loadOrders();
        }
      });
    });
  }

  // ===== APP SHELL / RENDER =====

  function refreshGlobalDatalists(){
    var dl = document.getElementById('resellerList');
    if(dl) dl.innerHTML = (state.resellers||[]).map(function(r){ return '<option value="' + esc(r) + '">'; }).join('');
    var shopDl = document.getElementById('shopList');
    if(shopDl) shopDl.innerHTML = (state.shops||[]).map(function(s){ return '<option value="' + esc(s) + '">'; }).join('');
    var courierDl = document.getElementById('courierList');
    if(courierDl) courierDl.innerHTML = (state.couriers||[]).map(function(c){ return '<option value="' + esc(c) + '">'; }).join('');
    var sizeDl = document.getElementById('sizeList');
    if(sizeDl) sizeDl.innerHTML = (state.sizes||[]).map(function(s){ return '<option value="' + esc(s) + '">'; }).join('');
  }

  function render(){
    var appEl = document.getElementById('app');
    if(!state.session){
      appEl.innerHTML = renderLogin();
      wireLogin();
      return;
    }
    refreshGlobalDatalists();

    var pendingCount = state.orders.filter(function(o){ var ds = orderDisplayStatus(o); return ds === 'pending' || ds === 'partial'; }).length;

    var shellHtml = '<div class="brand-wrap"><div class="menu-row no-print"><button class="menu-btn" id="sidebarOpenBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#e8eaed" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button></div><div class="app-brand" id="logoReloadBtn" style="cursor:pointer;">GURUKRUPA</div><div class="app-brand-sub">SAREES</div></div>';
    shellHtml += '<div class="tabs no-print">';
    shellHtml += '<div class="tab-btn' + (state.tab==='book'?' active':'') + '" id="tabBtnBook"><span class="tab-icon">\ud83d\udcf8</span>Book Orders</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='orders'?' active':'') + '" id="tabBtnOrders"><span class="tab-icon">\ud83d\udccb</span>Orders List' + (pendingCount>0 ? '<span class="badge">'+pendingCount+'</span>' : '') + '</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='ship'?' active':'') + '" id="tabBtnShip"><span class="tab-icon">\ud83d\udce6</span>Ship Album</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='shops'?' active':'') + '" id="tabBtnShops"><span class="tab-icon">\ud83c\udfea</span>Shop Booking</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='tracking'?' active':'') + '" id="tabBtnTracking"><span class="tab-icon">\ud83d\udccd</span>Tracking</div>';
    shellHtml += '</div><div id="tabContent"></div>';
    shellHtml += '<div class="sidebar-overlay" id="sidebarOverlay"></div>';
    shellHtml += '<div class="sidebar-panel" id="sidebarPanel">';
    shellHtml += '<div class="sidebar-top-row"><button class="sidebar-close" id="sidebarCloseBtn">\u00d7</button></div>';
    shellHtml += '<div class="sidebar-identity"><div class="user-avatar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#f2a76a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path></svg></div><span>' + esc(currentUserLabel()) + '</span></div>';
    shellHtml += '<button id="manageListsBtn">Manage Lists</button>';
    shellHtml += '<button id="printHistoryBtn">Print History</button>';
    shellHtml += '<button id="logoutBtn">Sign out</button>';
    shellHtml += '</div>';

    appEl.innerHTML = shellHtml;
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('manageListsBtn').addEventListener('click', function(){
      closeSidebar();
      openManageLists();
    });
    document.getElementById('printHistoryBtn').addEventListener('click', function(){
      closeSidebar();
      state.tab = 'printhistory';
      render();
    });
    document.getElementById('tabBtnBook').addEventListener('click', function(){ state.tab='book'; render(); });
    document.getElementById('tabBtnOrders').addEventListener('click', function(){ state.tab='orders'; render(); });
    document.getElementById('tabBtnShip').addEventListener('click', function(){ state.tab='ship'; render(); });
    document.getElementById('tabBtnShops').addEventListener('click', function(){ state.tab='shops'; render(); });
    document.getElementById('tabBtnTracking').addEventListener('click', function(){ state.tab='tracking'; render(); });

    function openSidebar(){
      document.getElementById('sidebarOverlay').classList.add('open');
      document.getElementById('sidebarPanel').classList.add('open');
    }
    function closeSidebar(){
      document.getElementById('sidebarOverlay').classList.remove('open');
      document.getElementById('sidebarPanel').classList.remove('open');
    }
    document.getElementById('sidebarOpenBtn').addEventListener('click', openSidebar);
    document.getElementById('logoReloadBtn').addEventListener('click', function(){ window.location.reload(); });
    document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    var content = document.getElementById('tabContent');
    var isTabSwitch = (state.tab !== lastRenderedTab);
    lastRenderedTab = state.tab;
    try{
      if(state.tab === 'book'){ prefetchOrderId(); content.innerHTML = renderBookTab(); wireBookTab(); }
      else if(state.tab === 'orders'){ content.innerHTML = renderOrdersTab(); wireOrdersTab(); }
      else if(state.tab === 'ship'){ content.innerHTML = renderShipTab(); wireShipTab(); }
      else if(state.tab === 'shops'){ content.innerHTML = renderShopsTab(); wireShopsTab(); }
      else if(state.tab === 'tracking'){ content.innerHTML = renderTrackingTab(); wireTrackingTab(); if(state.scanMode.active) focusScanInput(); }
      else if(state.tab === 'printhistory'){ content.innerHTML = renderPrintHistoryTab(); wirePrintHistoryTab(); loadPrintHistoryIfNeeded(); }
    }catch(e){
      content.innerHTML = '<div class="empty-state" style="color:#f28b82;">Something went wrong showing this screen.<br><span style="font-size:11px;color:#9aa0a6;">' + esc(e && e.message ? e.message : String(e)) + '</span><br><br><button class="btn-secondary" onclick="window.location.reload()">Reload page</button></div>';
      console.error('Render error on tab', state.tab, e);
    }
    if(isTabSwitch){
      // Restart the fade-in animation only when we've actually switched tabs —
      // not on every re-render within the same tab (e.g. typing in search).
      content.classList.remove('tab-fade');
      void content.offsetWidth; // force reflow so the animation restarts
      content.classList.add('tab-fade');
    }
  }

  initAuth();
})();
</script>
