<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Gurukrupa Sarees</title>
<style>
  * { box-sizing: border-box; }

  /* ===== MOBILE TOUCH BASICS =====
     Phones show their own grey "flash" on every tap by default — without
     turning that off, it fights the custom press animation below and looks
     broken (two different feedbacks firing at once). Also removes the old
     ~300ms delay some mobile browsers add before registering a tap. */
  button, .tab-btn, .filter-chip, .btn-add-photo, .draw-color-swatch,
  .orderPhoto, .item-wrap img, .album-cell, .item-shipped-tag, a {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Smooth momentum scrolling on iOS for any horizontally/vertically scrolling strip */
  .shop-row-tray, .modal-box, #app { -webkit-overflow-scrolling: touch; }

  /* ===== GLOBAL ANIMATION SYSTEM =====
     One consistent feel for every clickable thing in the app:
     press down slightly + brighten on hover. Applied broadly, then a few
     elements with their own custom hover (tab-btn, filter-chip) get a
     matching press-down added on top of what they already have. */
  button, .tab-btn, .filter-chip, .btn-add-photo, .draw-color-swatch,
  .status-pill, .order-courier, .badge {
    transition: filter 0.12s ease, transform 0.08s ease, background-color 0.15s ease,
                border-color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  button:not(:disabled):hover, .btn-add-photo:hover { filter: brightness(1.1); }
  button:not(:disabled):active, .btn-add-photo:active,
  .draw-color-swatch:active { transform: scale(0.95); }
  .tab-btn:active { transform: translateY(0) scale(0.97); }
  .filter-chip:hover { filter: brightness(1.15); }
  .filter-chip:active { transform: scale(0.95); }

  /* Tap feedback on photo thumbnails — every photo in the app opens a zoom
     view on tap, so a quick press-down confirms the tap landed. */
  .orderPhoto, .item-wrap img { transition: transform 0.08s ease; }
  .orderPhoto:active, .item-wrap img:active { transform: scale(0.96); }
  .album-cell { transition: transform 0.08s ease; }
  .album-cell:active { transform: scale(0.97); }

  /* Tab content fades in on switch — .tab-fade is added/removed by JS each
     time content changes, since a CSS animation on a fixed element only
     plays once (swapping innerHTML alone doesn't replay it). */
  .tab-fade { animation: fadeIn 0.16s ease; }

  /* Standard loading spinner, used wherever the app shows "Loading..." */
  .spinner {
    display: inline-block; width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid #3c4043; border-top-color: #d97a3f;
    animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
  }
  .spinner-sm { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(128,128,128,0.35); border-top-color: currentColor; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes modalPop { from { opacity: 0; transform: scale(0.92) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes badgePulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  /* ===== END GLOBAL ANIMATION SYSTEM ===== */

  html { overflow-x: hidden; width: 100%; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar { width: 0; height: 0; display: none; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: #131314;
    color: #e8eaed;
    overflow-x: hidden;
    width: 100%;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  body::-webkit-scrollbar { width: 0; height: 0; display: none; }

  }

  }

    .app-brand-sub { font-size: 9px; letter-spacing: 2.5px; margin: 0 0 12px; }
    .tabs { margin-bottom: 12px; padding: 8px 0; }
    .shop-name-tag { max-width: calc(100% - 12px); white-space: nowrap; font-size: 10px; padding: 3px 7px; }
    .item-shipped-tag { font-size: 10px; padding: 3px 7px; }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; column-count: auto; }
    .photo-thumb { width: auto; margin-bottom: 0; }
    .photo-thumb img { width: 100%; height: 150px; object-fit: cover; }
    .order-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; column-count: auto; }
    .item-wrap { width: auto; margin-bottom: 0; border-radius: 8px; overflow: hidden; }
    .order-photos img { width: 100%; height: 150px; object-fit: cover; }
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 18px; position: sticky; top: 0; background: #131314; padding: 10px 0; z-index: 5; }
  .tab-btn {
    flex: 1; padding: 12px 4px; border-radius: 11px; border: 1.5px solid #3c4043;
    background: #202124; color: #9aa0a6; font-size: 11.5px; font-weight: 800; cursor: pointer;
    position: relative; text-align: center; transition: all 0.15s; letter-spacing: 0.1px;
  }
  .tab-btn .tab-icon { display: block; font-size: 18px; margin-bottom: 5px; }
  .tab-btn.active { border-color: #d97a3f; background: linear-gradient(180deg, rgba(217,122,63,0.28), rgba(217,122,63,0.12)); color: #f2a76a; box-shadow: 0 3px 10px rgba(217,122,63,0.3); }
  .tab-btn:hover { border-color: #5f6368; transform: translateY(-1px); }
  .badge {
    position: absolute; top: -7px; right: 5px; background: #e05c5c; color: white;
    font-size: 11px; font-weight: 800; border-radius: 10px; padding: 2px 7px; min-width: 19px; text-align: center;
    box-shadow: 0 2px 6px rgba(224,92,92,0.6), 0 0 0 2px #131314;
  }
  label { font-size: 14.5px; color: #9aa0a6; display: block; margin-bottom: 6px; font-weight: 500; }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], textarea, select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #3c4043;
    font-size: 16px; font-family: inherit; background: #28292c; color: #e8eaed;
    -webkit-appearance: none; appearance: none;
  }
  /* PIN entry — visually masked like a password field, but NOT type="password".
     Browsers treat type="password" as a login field and will offer to
     autofill saved website credentials into it, which is exactly the wrong
     thing for a 4-6 digit PIN. -webkit-text-security masks the digits
     without triggering that. */
  input.pin-input { -webkit-text-security: disc; text-security: disc; }
  input[type=checkbox] { accent-color: #d97a3f; }
  /* Custom checkbox: native ones render a plain white box on many mobile
     browsers regardless of accent-color. This draws it fully ourselves so
     it always matches the theme. */
  input[type=checkbox].custom-chk {
    -webkit-appearance: none; appearance: none;
    width: 23px; height: 23px; border-radius: 7px; border: 2px solid #5f6368;
    background: #202124; position: relative; cursor: pointer; flex-shrink: 0; margin: 0;
    transition: all 0.12s;
  }
  input[type=checkbox].custom-chk:checked { background: #d97a3f; border-color: #d97a3f; }
  input[type=checkbox].custom-chk:checked::after {
    content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px;
    border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
  }
  select { cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa0a6' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 34px; }
  select:invalid { color: #80868b; }
  input::placeholder, textarea::placeholder { color: #80868b; }
  textarea { resize: vertical; }
  .field { margin-bottom: 14px; }
  .field-hint { font-size: 12.5px; color: #80868b; margin-top: 5px; }

  .photo-grid { column-count: 6; column-gap: 6px; margin-bottom: 12px; }

  function tryAutocomplete(inputEl, suggestions){
    var val = (inputEl.value || '').trim();
    if(!val) return;
    var lower = val.toLowerCase();
    var alreadyExact = suggestions.some(function(s){ return s.toLowerCase() === lower; });
    if(alreadyExact) return;
    var matches = suggestions.filter(function(s){ return s.toLowerCase().indexOf(lower) !== -1; });
    if(matches.length === 1){

  function isExactListMatch(val, list){

  function resizeImageToBlob(file, maxW){
    // createImageBitmap uses the browser's native (often hardware-accelerated)
    // decoder and is meaningfully faster than the Image()+canvas path on phones.
    if(window.createImageBitmap){
      return createImageBitmap(file).then(function(bitmap){
        var w = bitmap.width, hh = bitmap.height;
        if(w > maxW){ hh = Math.round(hh * (maxW/w)); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = hh;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, w, hh);
        bitmap.close();
        return new Promise(function(resolve, reject){
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('Could not compress photo')); return; }
            resolve(blob);
          }, 'image/jpeg', 0.6);
        });
      }).catch(function(){
        // Fall back to the older, slower-but-universal method below.
        return resizeImageToBlobLegacy(file, maxW);
      });
    }
    return resizeImageToBlobLegacy(file, maxW);
  }

  function resizeImageToBlobLegacy(file, maxW){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('Could not read the photo file')); };
      reader.onload = function(e){
        var img = new Image();
        img.onerror = function(){ reject(new Error('Could not decode the photo')); };
        img.onload = function(){
          var w = img.width, hh = img.height;
          if(w > maxW){ hh = Math.round(hh * (maxW/w)); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = hh;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, hh);
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('Could not compress photo')); return; }
            resolve(blob);
          }, 'image/jpeg', 0.6);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function drawWatermarkedBlob(sourceBlob, pieceId, sizeVal){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objUrl = URL.createObjectURL(sourceBlob);
      img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error('Could not load photo to stamp order ID')); };
      img.onload = function(){
        URL.revokeObjectURL(objUrl);
        var canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        var lines = ['#' + pieceId];
        var trimmedSize = (sizeVal || '').trim();
        if(trimmedSize) lines.push(trimmedSize);

        var fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
        var fontSize = Math.max(20, Math.round(canvas.width * 0.065));
        ctx.font = '800 ' + fontSize + 'px ' + fontFamily;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        var lineHeight = fontSize * 1.25;
        var padX = fontSize * 0.6;
        var padY = fontSize * 0.4;

        var maxTextWidth = 0;
        lines.forEach(function(line){
          var w = ctx.measureText(line).width;
          if(w > maxTextWidth) maxTextWidth = w;
        });

        var boxWidth = maxTextWidth + padX * 2;
        var boxHeight = (lines.length * lineHeight) + padY * 2;
        var centerX = canvas.width / 2;
        var centerY = canvas.height / 2;
        var boxX = centerX - boxWidth / 2;
        var boxY = centerY - boxHeight / 2;
        var radius = fontSize * 0.28;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(boxX + radius, boxY);
        ctx.arcTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + boxHeight, radius);
        ctx.arcTo(boxX + boxWidth, boxY + boxHeight, boxX, boxY + boxHeight, radius);
        ctx.arcTo(boxX, boxY + boxHeight, boxX, boxY, radius);
        ctx.arcTo(boxX, boxY, boxX + boxWidth, boxY, radius);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#000000';
        lines.forEach(function(line, i){
          var y = boxY + padY + (i + 0.5) * lineHeight;
          ctx.fillText(line, centerX, y);
        });

        canvas.toBlob(function(outBlob){
          if(!outBlob){ reject(new Error('Could not finalize stamped photo')); return; }
          resolve(outBlob);
        }, 'image/jpeg', 0.85);
      };
      img.src = objUrl;
    });
  }

      img.src = objUrl;
    });

  // so this can't be triggered by editing the page. See api/switch-account.js.
  var SWITCH_ACCOUNTS = [
    { id: 'bea5319f-1d7d-4d59-988b-6bb282e690c5', label: 'Bhagyasree \u2014 booking staff' },
    { id: 'a686a571-c5d9-44fd-b33e-ac14b5a9d0a6', label: 'Rajan \u2014 pickup & purchase' }
  ];

  async function switchToAccount(targetUserId, label){
    try{
      var resp = await fetch('/api/switch-account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.session.access_token },
        body: JSON.stringify({ targetUserId: targetUserId })
      });
      var data = await resp.json();
      if(!resp.ok) throw new Error(data.error || 'Could not switch');
      var originalSession = { access_token: state.session.access_token, refresh_token: state.session.refresh_token };
      var { error } = await sb.auth.verifyOtp({ token_hash: data.hashed_token, type: 'magiclink' });
      if(error) throw error;
      state.accountSwitch = { originalSession: originalSession, label: label };
      showToast('Switched to ' + data.email);
    }catch(e){
      showToast('Could not switch account: ' + (e && e.message ? e.message : 'try again \u2014 has the switch-account function been deployed?'));
    }
  }

  async function exitAccountSwitch(){
    if(!state.accountSwitch) return;
    var original = state.accountSwitch.originalSession;
    try{
      var { error } = await sb.auth.setSession({ access_token: original.access_token, refresh_token: original.refresh_token });
      if(error) throw error;
      state.accountSwitch = null;
      showToast('Back to your account');
      await loadOrders();
    }catch(e){
      showToast('Could not restore your session \u2014 please sign in again');
      state.accountSwitch = null;
      await logout();
    }
  }

  function openSwitchAccountModal(){
    var html = '<div class="modal-overlay"><div class="modal-box" style="max-width:340px;text-align:left;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 4px;">Switch account</p>';
    html += '<p style="font-size:12px;color:#9aa0a6;margin:0 0 14px;">Signs you into their real account so everything behaves exactly as it would for them. Use \u201cExit switch\u201d in the banner to come back.</p>';
    SWITCH_ACCOUNTS.forEach(function(a){
      html += '<button class="btn-secondary switchAccountOptBtn" data-id="' + esc(a.id) + '" data-label="' + esc(a.label) + '" style="width:100%;margin-bottom:8px;text-align:left;">\ud83d\udc64 ' + esc(a.label) + '</button>';
    });
    html += '<div class="modal-actions"><button id="switchAccountCancelBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Cancel</button></div>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    document.getElementById('switchAccountCancelBtn').addEventListener('click', closeModal);
    document.querySelectorAll('.switchAccountOptBtn').forEach(function(btn){
      btn.addEventListener('click', function(){
        closeModal();
        switchToAccount(btn.getAttribute('data-id'), btn.getAttribute('data-label'));

  // A staff account with no allowed_tabs row (the normal case — Soham and the
  // original booking staff) gets everything, same as before this feature
  // existed. Only accounts an admin has deliberately restricted (Rajan,
  // a booking-only hire) are limited to specific tabs.
  function isAdminStaff(){
    return (state.myRole === 'staff' || state.myRole === 'admin') && !state.myAllowedTabs;
  }

  // Distinct from isAdminStaff(): every unrestricted staff account (Soham AND
  // Bhagyasree) passes isAdminStaff() and keeps Manage Lists / Billing /
  // Purchase Ledger. Only Soham's account is a super admin — that's what
  // gates the full Staff Alerts monitoring panel and staff password tools.
  function isSuperAdmin(){
    return isAdminStaff() && !!state.myIsSuperAdmin;
  }

  var STAFF_TAB_CONFIG = [
    { key: 'book', icon: '\ud83d\udcf8', label: 'Book Orders' },
    { key: 'orders', icon: '\ud83d\udccb', label: 'Orders List', badge: true },
    { key: 'ship', icon: '\ud83d\udce6', label: 'Ship Album' },
    { key: 'shops', icon: '\ud83c\udfea', label: 'Shop Booking' },
    { key: 'tracking', icon: '\ud83d\udccd', label: 'Tracking' },
    { key: 'purchase', icon: '\ud83d\uded2', label: 'Purchase' }
  ];

  // The security boundary: a restricted staff account only ever sees, and
  // can only ever land on, the tabs an admin explicitly listed for it. This
  // is checked both when building the tab bar (so blocked tabs are never
  // shown) and again right before rendering tab content (so state.tab can
  // never point somewhere the account isn't allowed, however it got set).
  function staffTabAllowed(key){
    if(state.myRole !== 'staff' && state.myRole !== 'admin') return false;
    if(!state.myAllowedTabs) return true; // unrestricted staff
    return state.myAllowedTabs.indexOf(key) !== -1;
  }

  function myAllowedStaffTabs(){
    // Unrestricted staff (Soham, Bhagyasree) keep the natural left-to-right
    // order defined in STAFF_TAB_CONFIG. A restricted account's own
    // allowed_tabs array order controls its tab bar order instead — so
    // Rajan's array being ['purchase','ship','tracking'] puts Purchase
    // first, without needing a separate config just for him.
    if(!state.myAllowedTabs){
      return STAFF_TAB_CONFIG.filter(function(t){ return staffTabAllowed(t.key); });
    }
    var byKey = {};
    STAFF_TAB_CONFIG.forEach(function(t){ byKey[t.key] = t; });
    return state.myAllowedTabs.map(function(k){ return byKey[k]; }).filter(Boolean);
  }

  function isPurchaser(){
    return state.myRole === 'purchaser';
  }

  async function initAuth(){
    var { data } = await sb.auth.getSession();
    state.session = data.session;
    sb.auth.onAuthStateChange(function(event, session){
      state.session = session;
      if(event === 'SIGNED_IN'){
        loadOrders();
      }else if(event === 'SIGNED_OUT'){
        render();
      }else if(event === 'PASSWORD_RECOVERY'){
        state.passwordRecoveryMode = true;
        render();
      }
      // Other events (e.g. TOKEN_REFRESHED when the tab regains focus) update the
      // session silently without reloading data or re-rendering, so unsaved text
      // in any input field is never wiped out.
    });
    if(state.session){
      await loadOrders();
    }else{
      state.loading = false;
      render();
    }
  }

  async function login(email, password){
    state.loginError = '';
    var { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });
    if(error){
      state.loginError = error.message;
      render();
      return;
    }
    state.session = data.session;
    await loadOrders();
  }

  async function logout(){
    stopShopReminder();
    stopTrackingFillReminder();
    await sb.auth.signOut();
    state.session = null;
    state.orders = [];
    render();
  }

  // ===== DATA LOADING =====

  var loadOrdersInFlight = false;
  var lastRenderedTab = null;
  var shopReminderIntervalId = null;
  async function loadOrders(){
    if(loadOrdersInFlight) return; // prevent duplicate concurrent loads (page load + SIGNED_IN event both fire)
    loadOrdersInFlight = true;
    state.loading = true;
    // Load the real role/permissions BEFORE the first paint. Rendering here
    // first (with the still-default "unrestricted" state) is exactly what
    // caused a one-frame flash of all 6 admin tabs on every refresh for a
    // restricted account like Rajan's, before correcting itself a moment
    // later. Knowing who they really are first means it's never wrong.
    await loadMyProfile();
    render();
    try{
      // Start the 4 list queries NOW so they run in parallel with orders/items
      var listPromise = Promise.all([
        sb.from('resellers').select('name,hidden'),
        sb.from('shops').select('name,hidden,challan_photo_url,upi_vpa'),
        sb.from('couriers').select('name,hidden'),
        sb.from('sizes').select('name,hidden'),
        sb.from('courier_prefixes').select('prefix,courier_name'),
        sb.from('cash_topups').select('*').order('created_at', { ascending: false }),
        sb.from('gpay_topups').select('*').order('created_at', { ascending: false })
      ]);

      var ordersQuery = sb
        .from('orders')
        .select('*');
      if(isReseller()){ ordersQuery = ordersQuery.eq('reseller_name', state.myResellerName); }
      var { data: orders, error: ordersErr } = await ordersQuery
        .order('created_at', { ascending: false })
        .limit(300);
      if(ordersErr) throw ordersErr;

      var orderIds = (orders||[]).map(function(o){ return o.id; });
      var items = [];
      if(orderIds.length > 0){
        var { data: itemsData, error: itemsErr } = await sb
          .from('order_items')
          .select('*')
          .in('order_id', orderIds)
          .order('item_index', { ascending: true });
        if(itemsErr) throw itemsErr;
        items = itemsData || [];
      }

      var byOrder = {};
      (items||[]).forEach(function(it){
        if(!byOrder[it.order_id]) byOrder[it.order_id] = [];
        byOrder[it.order_id].push(it);
      });

      state.orders = (orders||[]).map(function(o){
        o.items = byOrder[o.id] || [];
        return o;
      });

      var names = {};
      state.orders.forEach(function(o){ if(o.reseller_name) names[o.reseller_name.toLowerCase()] = o.reseller_name; });

      var shopNames = {};
      (items||[]).forEach(function(it){ if(it.shop_name) shopNames[it.shop_name.toLowerCase()] = it.shop_name; });

      var courierNames = {};
      state.orders.forEach(function(o){ if(o.courier) courierNames[o.courier.toLowerCase()] = o.courier; });

      var sizeNames = {};
      (items||[]).forEach(function(it){ if(it.size) sizeNames[it.size.toLowerCase()] = it.size; });

      var listResults = await listPromise;
      var resellerRows = listResults[0].data;
      var shopRows = listResults[1].data;
      var courierRows = listResults[2].data;
      var sizeRows = listResults[3].data;
      state.courierPrefixes = listResults[4].data || [];
      state.cashTopups = listResults[5].data || [];
      state.gpayTopups = listResults[6].data || [];

      var challanMap = {};
      var upiMap = {};
      (shopRows||[]).forEach(function(r){
        if(r.challan_photo_url){ challanMap[r.name] = r.challan_photo_url; }
        if(r.upi_vpa){ upiMap[r.name] = r.upi_vpa; }
      });
      state.shopChallanPhotos = challanMap;
      state.shopUpiVpas = upiMap;

      state.resellerLogins = {};
      if(isAdminStaff()){
        try{
          var { data: resellerProfiles } = await sb.from('profiles').select('reseller_name,email,created_at').eq('role', 'reseller');
          (resellerProfiles||[]).forEach(function(p){
            if(p.reseller_name){ state.resellerLogins[p.reseller_name] = { email: p.email, created_at: p.created_at }; }
          });
        }catch(e){ /* if this isn't readable, Manage Lists just always shows "Create login" */ }
      }
      if(isReseller()){
        try{
          var { data: notifRows } = await sb.from('reseller_notifications')
            .select('id,order_id,message,created_at,read_at')
            .eq('reseller_name', state.myResellerName)
            .order('created_at', { ascending: false })
            .limit(50);
          state.resellerNotifications = notifRows || [];
        }catch(e){ state.resellerNotifications = []; }
      }

      var hiddenResellers = {};
      (resellerRows||[]).forEach(function(r){
        if(r.hidden){ hiddenResellers[r.name.toLowerCase()] = true; }
        else{ names[r.name.toLowerCase()] = r.name; }
      });

      var hiddenShops = {};
      (shopRows||[]).forEach(function(r){
        if(r.hidden){ hiddenShops[r.name.toLowerCase()] = true; }
        else{ shopNames[r.name.toLowerCase()] = r.name; }
      });

      var hiddenCouriers = {};
      (courierRows||[]).forEach(function(r){
        if(r.hidden){ hiddenCouriers[r.name.toLowerCase()] = true; }
        else{ courierNames[r.name.toLowerCase()] = r.name; }
      });

      var hiddenSizes = {};
      (sizeRows||[]).forEach(function(r){
        if(r.hidden){ hiddenSizes[r.name.toLowerCase()] = true; }
        else{ sizeNames[r.name.toLowerCase()] = r.name; }
      });

      Object.keys(hiddenResellers).forEach(function(k){ delete names[k]; });
      Object.keys(hiddenShops).forEach(function(k){ delete shopNames[k]; });
      Object.keys(hiddenCouriers).forEach(function(k){ delete courierNames[k]; });
      Object.keys(hiddenSizes).forEach(function(k){ delete sizeNames[k]; });

      state.resellers = Object.values(names).sort();
      state.shops = Object.values(shopNames).sort();
      state.couriers = Object.values(courierNames).sort();
      state.sizes = Object.values(sizeNames).sort();

    }catch(e){
      showToast('Could not load orders: ' + (e && e.message ? e.message : 'unknown error'));
    }
    state.loading = false;
    loadOrdersInFlight = false;
    render();
    startShopReminderIfNeeded();
    startTrackingFillReminderIfNeeded();
    if(isSuperAdmin() && !state.staffAlertsShownThisSession){
      state.staffAlertsShownThisSession = true;
      var alerts = computeStaffAlerts();
      if(alerts.length > 0){ openStaffAlertsModal(alerts, alerts.length + ' thing' + (alerts.length!==1?'s':'') + ' worth a look'); }
    }else if(isAdminStaff() && !isSuperAdmin() && !state.staffAlertsShownThisSession){
      state.staffAlertsShownThisSession = true;
      var rajanAlerts = computeRajanDelayAlerts();
      if(rajanAlerts.length > 0){ openStaffAlertsModal(rajanAlerts, 'Rajan is running behind on ' + rajanAlerts.length + ' piece' + (rajanAlerts.length!==1?'s':'')); }
    }else if(!isAdminStaff() && state.myRole === 'staff' && state.myAllowedTabs && state.myAllowedTabs.indexOf('purchase') !== -1 && !state.staffAlertsShownThisSession){
      state.staffAlertsShownThisSession = true;
      var dueAlerts = computeDueRestockAlerts();
      if(dueAlerts.length > 0){ openStaffAlertsModal(dueAlerts, '\ud83d\ude9a Time to collect ' + dueAlerts.length + ' piece' + (dueAlerts.length!==1?'s':'')); }
    }
  }

  function orderProgress(o){
    var items = o.items || [];
    var total = items.length;
    var shippedCount = items.filter(function(i){ return i.status === 'shipped'; }).length;
    return { total: total, shippedCount: shippedCount };
  }

  function orderDisplayStatus(o){
    if(o.status === 'cancelled') return 'cancelled';
    var p = orderProgress(o);
    if(p.total > 0 && p.shippedCount === p.total) return 'shipped';
    if(p.shippedCount > 0) return 'partial';
    return 'pending';
  }

  // ===== ADMIN: STAFF ACTIVITY ALERTS =====
  // Concrete, computable signals only — no guessing at "mistakes". Each rule
  // below is something Soham can point to and verify himself. Thresholds are
  // deliberately named as variables so they're easy to find and adjust.
  var ALERT_PENDING_HOURS = 72;      // non-urgent order sitting unshipped this long
  var ALERT_SHOP_PENDING_HOURS = 24; // piece still has no real shop assigned

  function hoursSince(ts){
    if(!ts) return 0;
    return (Date.now() - new Date(ts).getTime()) / 3600000;
  }

  function computeStaffAlerts(){
    var alerts = [];
    var today = new Date().toISOString().slice(0,10);

    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      var ds = orderDisplayStatus(o);
      var hrs = hoursSince(o.created_at);

      if(o.urgent && o.urgent_days && ds !== 'shipped'){
        var deadlineHrs = o.urgent_days * 24;
        if(hrs > deadlineHrs){
          alerts.push({ orderId: o.id, severity: 'high',
            message: 'Order #' + o.id + ' was marked URGENT (' + o.urgent_days + ' day' + (o.urgent_days>1?'s':'') + ') but ' + Math.floor(hrs/24) + ' day' + (Math.floor(hrs/24)!==1?'s':'') + ' have passed and it\u2019s still not shipped.' });
        }
      }else if(!o.urgent && ds !== 'shipped' && hrs > ALERT_PENDING_HOURS){
        alerts.push({ orderId: o.id, severity: 'medium',
          message: 'Order #' + o.id + ' has been pending ' + Math.floor(hrs/24) + ' day' + (Math.floor(hrs/24)!==1?'s':'') + ' without being shipped.' });
      }

      if(ds === 'shipped' && !o.tracking_number){
        var trackHrs = hoursSinceShippedUntracked(o);
        if(trackHrs > ALERT_TRACKING_MISSING_HOURS){
          alerts.push({ orderId: o.id, severity: 'high',
            message: 'Order #' + o.id + ' shipped ' + Math.floor(trackHrs) + '+ hour' + (Math.floor(trackHrs)!==1?'s':'') + ' ago and still has no tracking number \u2014 Bhagyasree has been reminded but hasn\u2019t filled it in yet.' });
        }
      }

      (o.items||[]).forEach(function(it){
        if(!it.purchased && (!it.shop_name || it.shop_name === 'Name Pending') && hrs > ALERT_SHOP_PENDING_HOURS){
          alerts.push({ orderId: o.id, severity: 'medium',
            message: 'Order #' + o.id + ' has a piece with no shop assigned, ' + Math.floor(hrs/24) + '+ day' + (Math.floor(hrs/24)!==1?'s':'') + ' since booking.' });
        }
        if(it.restock_date && it.restock_date < today && !it.purchased){
          alerts.push({ orderId: o.id, severity: 'medium',
            message: 'Order #' + o.id + ' \u2014 restock date (' + formatRestockDate(it.restock_date) + ') at ' + (it.shop_name||'') + ' has passed, still not purchased.' });
        }
      });
    });

    var cbal = getCashBalance(), gbal = getGpayBalance();
    if(cbal.available < 0){ alerts.push({ orderId: null, severity: 'high', message: 'Rajan\u2019s cash balance is negative (\u20b9' + cbal.available.toLocaleString('en-IN') + ') \u2014 he spent more cash than was topped up.' }); }
    if(gbal.available < 0){ alerts.push({ orderId: null, severity: 'high', message: 'Rajan\u2019s GPay balance is negative (\u20b9' + gbal.available.toLocaleString('en-IN') + ') \u2014 he spent more than was topped up.' }); }

    // De-duplicate identical messages (e.g. same rule firing on re-render) and put urgent-breach first.
    var seen = {};
    var unique = alerts.filter(function(a){ if(seen[a.message]) return false; seen[a.message]=true; return true; });
    unique.sort(function(a,b){ return (a.severity==='high'?0:1) - (b.severity==='high'?0:1); });
    return unique;
  }

  // Narrower than computeStaffAlerts() — this is specifically "is Rajan
  // running late collecting a piece", for Bhagyasree's account. It leaves
  // out things that aren't her concern (shipping deadlines, cash balances,
  // shop not yet assigned — that last one is her own job, not Rajan's).
  var RAJAN_NO_UPDATE_HOURS = 48; // no restock date logged and still not collected

  function computeRajanDelayAlerts(){
    var alerts = [];
    var today = new Date().toISOString().slice(0,10);
    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      var hrs = hoursSince(o.created_at);
      (o.items||[]).forEach(function(it){
        if(it.purchased) return;
        var shop = it.shop_name;
        if(!shop || shop === 'Name Pending') return;
        if(it.restock_date && it.restock_date < today){
          alerts.push({ orderId: o.id, severity: 'high',
            message: 'Order #' + o.id + ' \u2014 Rajan expected ' + shop + ' to have it ready by ' + formatRestockDate(it.restock_date) + ', still not collected.' });
        }else if(!it.restock_date && hrs > RAJAN_NO_UPDATE_HOURS){
          alerts.push({ orderId: o.id, severity: 'medium',
            message: 'Order #' + o.id + ' at ' + shop + ' hasn\u2019t been collected yet \u2014 ' + Math.floor(hrs/24) + '+ day' + (Math.floor(hrs/24)!==1?'s':'') + ' since booking.' });
        }
      });
    });
    var seen = {};
    return alerts.filter(function(a){ if(seen[a.message]) return false; seen[a.message]=true; return true; });
  }

  // Shown to Rajan himself: pieces whose restock date has arrived (today)
  // or already passed, and are still not purchased — a direct "go collect
  // this" nudge. Distinct from computeRajanDelayAlerts(), which is the same
  // underlying signal but phrased for Bhagyasree/admin as a delay report.
  function computeDueRestockAlerts(){
    var alerts = [];
    var today = new Date().toISOString().slice(0,10);
    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      (o.items||[]).forEach(function(it){
        if(it.purchased) return;
        var shop = it.shop_name;
        if(!shop || shop === 'Name Pending') return;
        if(it.restock_date && it.restock_date <= today){
          alerts.push({ orderId: o.id, severity: it.restock_date < today ? 'high' : 'medium',
            message: (it.restock_date < today ? 'Overdue \u2014 ' : 'Today \u2014 ') + shop + ' said order #' + o.id + ' would be ready by ' + formatRestockDate(it.restock_date) + '. Go collect it.' });
        }
      });
    });
    var seen = {};
    return alerts.filter(function(a){ if(seen[a.message]) return false; seen[a.message]=true; return true; });
  }

  function openStaffAlertsModal(alerts, title){
    if(alerts.length === 0){
      var emptyHtml = '<div class="modal-overlay"><div class="modal-box">';
      emptyHtml += '<p style="font-size:15px;font-weight:700;margin:0 0 6px;">\u2705 All clear</p>';
      emptyHtml += '<p style="font-size:12.5px;color:#9aa0a6;margin:0;">No delays or gaps spotted right now.</p>';
      emptyHtml += '<div class="modal-actions"><button id="staffAlertsCloseBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Close</button></div>';
      emptyHtml += '</div></div>';
      document.getElementById('modalHost').innerHTML = emptyHtml;
      document.getElementById('staffAlertsCloseBtn').addEventListener('click', closeModal);
      return;
    }
    var rows = alerts.map(function(a, i){
      var color = a.severity === 'high' ? '#f28b82' : '#f2a76a';
      var row = '<div class="staffAlertRow" data-order="' + (a.orderId ? esc(a.orderId) : '') + '" style="padding:10px 0;border-bottom:1px solid #3c4043;' + (a.orderId ? 'cursor:pointer;' : '') + '">';
      row += '<span style="color:' + color + ';font-size:13px;">' + esc(a.message) + '</span>';
      if(a.orderId){ row += ' <span style="font-size:11px;color:#9aa0a6;">\u2192 tap to view</span>'; }
      row += '</div>';
      return row;
    }).join('');
    var html = '<div class="modal-overlay"><div class="modal-box" style="max-width:420px;text-align:left;max-height:80vh;overflow-y:auto;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 4px;">\u26a0\ufe0f ' + esc(title || (alerts.length + ' thing' + (alerts.length!==1?'s':'') + ' worth a look')) + '</p>';
    html += '<p style="font-size:12px;color:#9aa0a6;margin:0 0 12px;">Delays and gaps spotted in staff activity.</p>';
    html += rows;
    html += '<div class="modal-actions"><button id="staffAlertsCloseBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Close</button></div>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    document.getElementById('staffAlertsCloseBtn').addEventListener('click', closeModal);
    document.querySelectorAll('.staffAlertRow[data-order]').forEach(function(row){
      var orderId = row.getAttribute('data-order');
      if(!orderId) return;
      row.addEventListener('click', function(){
        closeModal();
        state.tab = 'orders';
        state.query = orderId;
        render();
      });
    });
  }

  // ===== BOOKING =====

  function addToLocalList(list, val){
    val = (val || '').trim();
    if(!val) return;
    var exists = list.some(function(n){ return n.toLowerCase() === val.toLowerCase(); });
    if(!exists){ list.push(val); list.sort(); }
  }

  // The order number is taken ONLY at the moment Save is pressed — never
  // earlier. Reserving it on page-open was burning numbers every time someone
  // visited the Book tab without saving, which is why IDs had gaps and could
  // even appear out of order. Mumbai round-trip is fast, so Save barely notices.
  async function saveOrder(name, courier, address, photoEntries, onProgress){
    var { data: idData, error: idErr } = await sb.rpc('get_next_order_id');
    if(idErr) throw new Error('Could not get order number: ' + idErr.message);
    var orderId = idData;

    var orderInsertPromise = sb.from('orders').insert({
      id: orderId,
      reseller_name: name,
      courier: courier,
      address: address,
      status: 'pending',
      urgent: !!state.urgentVal,
      urgent_days: state.urgentVal ? (parseInt(state.urgentDaysVal, 10) || null) : null,
      created_by: state.session.user.id
    }).select().single();

    var doneCount = 0;
    var totalCount = photoEntries.length;
    var uploadPromises = photoEntries.map(async function(entry, i){
      var pieceId = orderId + '-' + (i + 1);
      var stampedBlob = await drawWatermarkedBlob(entry.blob, pieceId, entry.sizeVal);
      var thumbBlob = await createThumbnailBlob(stampedBlob, 260);

      var path = orderId + '/' + Date.now() + '_' + i + '.jpg';
      var thumbPath = orderId + '/' + Date.now() + '_' + i + '_thumb.jpg';

      var uploadResults = await Promise.all([
        sb.storage.from('order-photos').upload(path, stampedBlob, { contentType: 'image/jpeg' }),
        sb.storage.from('order-photos').upload(thumbPath, thumbBlob, { contentType: 'image/jpeg' })
      ]);
      if(uploadResults[0].error) throw new Error('Photo ' + (i+1) + ' upload failed: ' + uploadResults[0].error.message);
      if(uploadResults[1].error) throw new Error('Thumbnail ' + (i+1) + ' upload failed: ' + uploadResults[1].error.message);

      var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
      var { data: pubThumb } = sb.storage.from('order-photos').getPublicUrl(thumbPath);
      doneCount++;
      if(onProgress){ onProgress(doneCount, totalCount); }
      return { photoUrl: pub.publicUrl, thumbUrl: pubThumb.publicUrl };
    });

    var results = await Promise.all([orderInsertPromise].concat(uploadPromises));
    var orderResult = results[0];
    if(orderResult.error) throw new Error('Order save failed: ' + orderResult.error.message);
    var uploaded = results.slice(1);

    var itemRows = uploaded.map(function(u, idx){
      return {
        order_id: orderId, item_index: idx, photo_url: u.photoUrl, thumb_url: u.thumbUrl, status: 'pending',
        shop_name: (photoEntries[idx].shopVal || '').trim() || null,
        size: (photoEntries[idx].sizeVal || '').trim() || null
      };
    });
    var { data: insertedItems, error: itemsErr } = await sb.from('order_items').insert(itemRows).select();
    if(itemsErr) throw new Error('Photo records failed: ' + itemsErr.message);

    var newOrder = orderResult.data;
    newOrder.items = (insertedItems || []).sort(function(a,b){ return a.item_index - b.item_index; });
    return newOrder;
  }

  // Reverts a single piece (not the whole order) back to pending — used when
  // the "Shipped" tag on an individual photo is tapped.
  function revertSingleItemToPending(itemId){
    var ord = null, item = null;
    state.orders.forEach(function(o){
      (o.items||[]).forEach(function(it){ if(it.id === itemId){ ord = o; item = it; } });
    });
    if(!item) return;

    if(ord && ord.tracking_number){
      openTrackingPendingWarning(function(){ doRevertSingleItemToPending(itemId); });
      return;
    }
    doRevertSingleItemToPending(itemId);
  }

  function doRevertSingleItemToPending(itemId){

      (o.items||[]).forEach(function(it){ if(it.id === itemId){ item = it; } });

  async function bulkUpdateOrderItems(orderId, status){
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(!ord) return;
    if(status === 'pending' && ord.tracking_number){
      openTrackingPendingWarning(function(){ doBulkUpdateOrderItems(orderId, status); });
      return;
    }
    doBulkUpdateOrderItems(orderId, status);
  }

  async function doBulkUpdateOrderItems(orderId, status){
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(!ord) return;
    var patch = { status: status };
    if(status === 'shipped'){ patch.shipped_at = new Date().toISOString(); patch.shipped_by = state.session.user.id; }
    else { patch.shipped_at = null; patch.shipped_by = null; }

    // Update screen instantly; sync to database in background
    var wasCancelled = ord.status === 'cancelled';
    if(wasCancelled){ ord.status = 'pending'; }
    (ord.items||[]).forEach(function(it){
      it.status = status;
      it.shipped_at = patch.shipped_at;
      it.shipped_by = patch.shipped_by;
    });
    showToast(status === 'shipped' ? 'All pieces marked shipped' : 'All pieces marked pending');
    render();

    var dbOps = [sb.from('order_items').update(patch).eq('order_id', orderId)];
    if(wasCancelled){ dbOps.push(sb.from('orders').update({ status: 'pending' }).eq('id', orderId)); }
    Promise.all(dbOps).then(function(results){
      var failed = results.find(function(r){ return r.error; });
      if(failed){
        showToast('Warning: update did not save: ' + failed.error.message);
        loadOrders();
      }
    });
  }

  // Extracts the storage path (e.g. "1023/167_0.jpg") from a Supabase public URL,
  // needed to delete the actual file from the order-photos bucket.
  function storagePathFromUrl(url){
    if(!url) return null;
    var marker = '/storage/v1/object/public/order-photos/';
    var idx = url.indexOf(marker);
    return idx === -1 ? null : url.slice(idx + marker.length);
  }

  async function deleteOrder(id){
    var ord = state.orders.find(function(o){ return o.id === id; });

    // Delete child order_items first — required before the order row can go,
    // since order_items.order_id references orders.id.
    var { error: itemsErr } = await sb.from('order_items').delete().eq('order_id', id);
    if(itemsErr){ showToast('Delete failed: ' + itemsErr.message); return; }

    var { error } = await sb.from('orders').delete().eq('id', id);
    if(error){ showToast('Delete failed: ' + error.message); return; }

    // Best-effort cleanup of the actual photo files — order is already gone
    // from the database at this point either way, so don't block on this.
    try{
      var paths = [];
      if(ord){
        (ord.items||[]).forEach(function(it){
          var p1 = storagePathFromUrl(it.photo_url); if(p1) paths.push(p1);
          var p2 = storagePathFromUrl(it.thumb_url); if(p2) paths.push(p2);
        });
        var pTrack = storagePathFromUrl(ord.tracking_photo_url); if(pTrack) paths.push(pTrack);
      }
      if(paths.length){ sb.storage.from('order-photos').remove(paths); }
    }catch(e){ /* non-critical */ }

    state.orders = state.orders.filter(function(o){ return o.id !== id; });
    showToast('Order deleted');
    closeModal();
    render();
  }

  function cancelOrder(id, reason){

    }).eq('id', id).then(function(res){
      if(res.error){
        showToast('Warning: cancel did not save: ' + res.error.message);
        loadOrders();
      }
    });
  }

  async function printAndMarkShipped(){
    var selections = Object.values(state.shipSelection);
    if(selections.length === 0) return;

    var groups = {};
    selections.forEach(function(sel){
      if(!groups[sel.orderId]) groups[sel.orderId] = [];
      groups[sel.orderId].push(sel.itemDbId);
    });

    var orderIds = Object.keys(groups);
    var nowIso = new Date().toISOString();

    // Fire DB updates in the background — print dialog opens instantly
    var updatePromises = orderIds.map(function(orderId){
      return sb.from('order_items').update({
        status: 'shipped', shipped_at: nowIso, shipped_by: state.session.user.id
      }).in('id', groups[orderId]);
    });
    Promise.all(updatePromises).then(function(updateResults){
      var failedUpdate = updateResults.find(function(r){ return r.error; });
      if(failedUpdate){
        showToast('Warning: could not save shipped status: ' + failedUpdate.error.message);
        loadOrders(); // re-sync from server so screen matches database
      }
    });

    // Record this print event for the Print History page (non-critical, fire and forget)
    var printLogRows = orderIds.map(function(orderId){
      var ord0 = state.orders.find(function(o){ return o.id === orderId; });
      return {
        order_id: orderId,
        reseller_name: ord0 ? ord0.reseller_name : null,
        piece_count: groups[orderId].length,
        printed_by: state.session.user.id,
        printed_by_email: state.session.user.email,
        printed_at: nowIso
      };
    });
    sb.from('print_log').insert(printLogRows).then(function(res){
      if(res.error){ console.error('Could not save print history', res.error); }
      else{
        state.printLog = printLogRows.map(function(r, i){ return Object.assign({ id: 'temp' + i }, r); }).concat(state.printLog);
      }
    });

    var slipsHtml = '';
    orderIds.forEach(function(orderId){
      var ord = state.orders.find(function(o){ return o.id === orderId; });
      if(!ord) return;
      var dbIds = groups[orderId];

      (ord.items||[]).forEach(function(it){
        if(dbIds.indexOf(it.id) !== -1){
          it.status = 'shipped';
          it.shipped_at = nowIso;
          it.shipped_by = state.session.user.id;
        }
      });

      var prog = orderProgress(ord);
      var shippingNow = dbIds.length;
      slipsHtml += '<div class="print-slip">';
      slipsHtml += '<div class="slip-top"><span class="slip-id">Order #' + esc(ord.id) + '</span>';
      slipsHtml += '</div>';
      slipsHtml += '<img class="slip-barcode" id="barcode_' + esc(ord.id) + '" alt="">';
      slipsHtml += '<hr class="slip-divider">';
      slipsHtml += '<div class="slip-time">Booked: ' + formatTime(ord.created_at) + '</div>';
      if(prog.total > 1){
        slipsHtml += '<div class="slip-time">Shipping ' + shippingNow + ' of ' + prog.total + ' piece(s) in this order</div>';
      }
      if(ord.courier) slipsHtml += '<p class="slip-courier">Courier: ' + esc(ord.courier) + '</p>';
      slipsHtml += '<hr class="slip-divider">';
      slipsHtml += '<p class="slip-address">' + esc(ord.address) + '</p>';
      slipsHtml += '</div>';
    });

    document.getElementById('shipPrintArea').innerHTML = slipsHtml;
    orderIds.forEach(function(orderId){
      var ord = state.orders.find(function(o){ return o.id === orderId; });
      if(!ord) return;
      var imgEl = document.getElementById('barcode_' + orderId);
      if(imgEl && window.JsBarcode){
        try{
          var canvas = document.createElement('canvas');
          JsBarcode(canvas, ord.id, { format: 'CODE128', displayValue: false, height: 40, margin: 4, width: 2, background: '#ffffff', lineColor: '#000000' });
          imgEl.src = canvas.toDataURL('image/png');
        }catch(e){ /* if barcode render fails, slip still prints fine without it */ }
      }
    });
    window.print();
    state.shipSelection = {};
    var allShippedIds = [];
    Object.keys(groups).forEach(function(orderId){ allShippedIds = allShippedIds.concat(groups[orderId]); });
    showToastWithAction('Marked shipped and sent to print', 'Undo', function(){
      // Revert exactly the pieces we just marked, back to pending — both on screen and in the database.
      orderIds.forEach(function(orderId){
        var ord2 = state.orders.find(function(o){ return o.id === orderId; });
        if(!ord2) return;
        (ord2.items||[]).forEach(function(it){
          if(allShippedIds.indexOf(it.id) !== -1){
            it.status = 'pending';
            it.shipped_at = null;
            it.shipped_by = null;
          }
        });
      });
      render();
      sb.from('order_items').update({ status: 'pending', shipped_at: null, shipped_by: null }).in('id', allShippedIds).then(function(res){
        if(res.error){
          showToast('Warning: undo did not save: ' + res.error.message);
          loadOrders();
        }else{
          showToast('Undone \u2014 back to pending');
        }
      });
    });
    render();
  }

  function getResellerActivity(name){
    var orders = state.orders.filter(function(o){ return o.reseller_name === name; });
    if(orders.length === 0) return { count: 0, lastDate: null };
    var lastDate = orders.reduce(function(latest, o){
      var t = new Date(o.created_at).getTime();
      return t > latest ? t : latest;
    }, 0);
    return { count: orders.length, lastDate: lastDate };
  }

  // Renaming a list entry has to follow through everywhere that name is
  // used as free text — otherwise old orders quietly stop matching the
  // renamed entry. Resellers additionally cascade into any linked login's
  // profile row, so their portal keeps showing their own orders.
  async function renameListEntry(tab, oldName, newName){
    if(!newName || newName === oldName) return;
    var tableMap = { resellers: 'resellers', shops: 'shops', couriers: 'couriers', sizes: 'sizes' };
    try{
      var { error } = await sb.from(tableMap[tab]).update({ name: newName }).eq('name', oldName);
      if(error) throw error;

      if(tab === 'resellers'){
        await sb.from('orders').update({ reseller_name: newName }).eq('reseller_name', oldName);
        await sb.from('profiles').update({ reseller_name: newName }).eq('reseller_name', oldName);
        state.orders.forEach(function(o){ if(o.reseller_name === oldName) o.reseller_name = newName; });
        state.resellers = state.resellers.map(function(n){ return n === oldName ? newName : n; }).sort();
        if(state.resellerLogins[oldName]){ state.resellerLogins[newName] = state.resellerLogins[oldName]; delete state.resellerLogins[oldName]; }
      }else if(tab === 'shops'){
        await sb.from('order_items').update({ shop_name: newName }).eq('shop_name', oldName);
        state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(it.shop_name === oldName) it.shop_name = newName; }); });
        state.shops = state.shops.map(function(n){ return n === oldName ? newName : n; }).sort();
        if(state.shopChallanPhotos[oldName]){ state.shopChallanPhotos[newName] = state.shopChallanPhotos[oldName]; delete state.shopChallanPhotos[oldName]; }
        if(state.shopUpiVpas[oldName]){ state.shopUpiVpas[newName] = state.shopUpiVpas[oldName]; delete state.shopUpiVpas[oldName]; }
      }else if(tab === 'couriers'){
        await sb.from('orders').update({ courier: newName }).eq('courier', oldName);
        state.orders.forEach(function(o){ if(o.courier === oldName) o.courier = newName; });
        state.couriers = (state.couriers||[]).map(function(n){ return n === oldName ? newName : n; }).sort();
      }else{
        await sb.from('order_items').update({ size: newName }).eq('size', oldName);
        state.orders.forEach(function(o){ (o.items||[]).forEach(function(it){ if(it.size === oldName) it.size = newName; }); });
        state.sizes = (state.sizes||[]).map(function(n){ return n === oldName ? newName : n; }).sort();
      }
      showToast('Renamed to ' + newName + ' \u2014 updated everywhere it was used');
      state.editingListItem = null;
      renderManageListsModal();
    }catch(e){
      showToast('Could not rename: ' + (e && e.message ? e.message : 'try again'));
    }
  }

  // ===== ADMIN: CREATE RESELLER/STAFF LOGIN =====
  // Goes through the same server-side pattern as Switch Account — the
  // service role key needed to create a real login never touches the
  // browser. This function just calls that endpoint and reports back.
  async function createLoginAccount(email, password, role, resellerName){
    var resp = await fetch('/api/create-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.session.access_token },
      body: JSON.stringify({ email: email, password: password, role: role, resellerName: resellerName, displayName: resellerName })
    });
    var data = await resp.json();
    if(!resp.ok) throw new Error(data.error || 'Could not create login');
    return data;
  }

  async function deleteListItem(name){
    if(!isSuperAdmin()){ showToast('Only the admin account can delete entries'); return; }

    var tableMap = { resellers: 'resellers', shops: 'shops', couriers: 'couriers', sizes: 'sizes' };
    var { error } = await sb.from(tableMap[tab]).upsert({ name: name, hidden: true }, { onConflict: 'name' });

    renderManageListsModal();
  }

  // ===== TRACKING TAB =====

  // Finds the courier for a scanned tracking number by matching known prefixes.
  // Longest prefix wins, so a more specific rule beats a shorter accidental match.
  function detectCourierFromTracking(val){
    if(!val) return null;
    var v = val.trim().toUpperCase();
    var rules = (state.courierPrefixes || []).slice().sort(function(a,b){
      return b.prefix.length - a.prefix.length;
    });
    for(var i=0;i<rules.length;i++){
      if(v.indexOf(rules[i].prefix.toUpperCase()) === 0){ return rules[i].courier_name; }
    }
    return null;
  }

  // Remembers a prefix->courier mapping for next time (used when staff picks
  // manually for an unrecognized number, or corrects a wrong auto-guess).
  async function learnCourierPrefix(trackingVal, courierName){
    var v = (trackingVal || '').trim().toUpperCase();
    if(!v || !courierName) return;
    var prefixLen = /^[A-Z]/.test(v) ? Math.min(4, v.length) : 3;
    var prefix = v.slice(0, prefixLen);
    if(!prefix) return;
    try{
      var res = await sb.from('courier_prefixes').upsert(
        { prefix: prefix, courier_name: courierName },
        { onConflict: 'prefix' }
      ).select();
      if(!res.error && res.data && res.data[0]){
        var idx = state.courierPrefixes.findIndex(function(r){ return r.prefix === prefix; });
        if(idx === -1){ state.courierPrefixes.push({ prefix: prefix, courier_name: courierName }); }
        else{ state.courierPrefixes[idx].courier_name = courierName; }
      }
    }catch(e){ /* non-critical, fail silently */ }
  }

  // Shared save path used by both the manual tracking list and Scan Mode.
  // Returns { ok: true } or { ok: false, message: '...' }.
  async function saveTrackingForOrder(orderId, trackingVal, courierName, resetShared){
    var val = (trackingVal || '').trim();
    if(!val) return { ok: false, message: 'Enter a tracking number' };
    var patch = { tracking_number: val };
    if(courierName){ patch.courier = courierName; }
    if(resetShared){ patch.tracking_shared_at = null; }
    var { error } = await sb.from('orders').update(patch).eq('id', orderId);
    if(error) return { ok: false, message: error.message };
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(ord){
      ord.tracking_number = val;
      if(courierName) ord.courier = courierName;
      if(resetShared) ord.tracking_shared_at = null;
    }
    if(courierName){ learnCourierPrefix(val, courierName); }
    if(ord && ord.reseller_name){
      var notifMsg = 'Tracking added for order #' + orderId + (courierName ? ' via ' + courierName : '') + ': ' + val;
      sb.from('reseller_notifications').insert({ reseller_name: ord.reseller_name, order_id: String(orderId), message: notifMsg })
        .then(function(){}).catch(function(){ /* non-critical, never block the tracking save on this */ });
    }
    return { ok: true };
  }

      html += '<span style="font-size:12px;color:#fdd663;">Not recognized \u2014 pick courier for ' + esc(sm.pendingTrackingVal) + ':</span>';
      html += '</div>';
      html += '<div style="display:flex;gap:8px;margin-top:6px;">';
      html += '<select id="scanCourierPick" style="flex:1;font-size:12.5px;padding:6px 8px;border-radius:8px;background:#28292c;color:#e8eaed;border:1px solid #3c4043;">';
      html += '<option value="">Pick courier\u2026</option>';
      (state.couriers||[]).forEach(function(c){ html += '<option value="' + esc(c) + '">' + esc(c) + '</option>'; });
      html += '</select>';
      html += '<button class="btn-secondary" id="scanCourierConfirmBtn">Confirm & Save</button>';
      html += '</div>';
    }

    if(sm.stage === 'tracking'){
      html += '<button class="btn-secondary" id="scanModeCancelBtn" style="margin-top:10px;">Cancel \u2014 pick different order</button>';
    }
    html += '<p style="font-size:12px;color:#80868b;margin-top:10px;">Saved this session: <b>' + sm.savedCount + '</b></p>';
    html += '</div></div>';
    return html;
  }

  function focusScanInput(){
    var inp = document.getElementById('scanModeInput');
    if(inp){ inp.focus(); }
  }

  async function processScanValue(raw){
    var val = (raw || '').trim();
    if(!val) return;
    var sm = state.scanMode;

    // If the scanned value matches an existing order id exactly, treat it as
    // selecting/switching to that order — regardless of current stage.
    var matchedOrder = state.orders.find(function(o){ return o.id.toLowerCase() === val.toLowerCase(); });
    if(matchedOrder){
      if(matchedOrder.tracking_number){
        showToast('Order #' + matchedOrder.id + ' already has tracking ' + matchedOrder.tracking_number + ' \u2014 scan a new one to replace it');
      }
      sm.selectedOrderId = matchedOrder.id;
      sm.stage = 'tracking';
      sm.pendingTrackingVal = null;
      renderScanModeOnly();
      return;
    }

    if(sm.stage !== 'tracking' || !sm.selectedOrderId){
      showToast('Order #' + val + ' not found \u2014 scan the order barcode first');
      renderScanModeOnly();
      return;
    }

    var detected = detectCourierFromTracking(val);
    if(detected){
      var result = await saveTrackingForOrder(sm.selectedOrderId, val, detected);
      if(!result.ok){ showToast('Could not save: ' + result.message); renderScanModeOnly(); return; }
      sm.savedCount++;
      showToast('#' + sm.selectedOrderId + ' \u2192 ' + detected + ' saved');
      sm.stage = 'order';
      sm.selectedOrderId = null;
      sm.pendingTrackingVal = null;
      render();
    }else{
      sm.pendingTrackingVal = val;
      renderScanModeOnly();
    }
  }

        var sm = state.scanMode;

        var entry = state.trackingUnmatched[idx];
        await attachTrackingPhoto(ord, entry.blob);
        // The photo's OCR text was kept — the tracking sticker may still be
        // readable even though the order ID wasn't.
        var trk = findTrackingInText(entry.ocrText);
        var savedTrk = null;
        if(trk && trk.value !== ord.tracking_number){
          var trkRes = await saveTrackingForOrder(ord.id, trk.value, trk.courier);

          savedTrk = trk;
        }
        state.trackingUnmatched.splice(idx, 1);
        render();
        openPackedShippedConfirm([{ orderId: ord.id, tracking: savedTrk ? savedTrk.value : null, courier: savedTrk ? savedTrk.courier : null }]);

    document.querySelectorAll('.unmatchedOrderSearch').forEach(function(inp){

      });

      });

        var input = document.querySelector('.trackingNumInput[data-order="' + orderId + '"]');
        var select = document.querySelector('.courierDetectSelect[data-order="' + orderId + '"]');
        var chosenCourier = select ? select.value : '';
        var result = await saveTrackingForOrder(orderId, input.value, chosenCourier);
        if(!result.ok){ showToast('Could not save: ' + result.message); return; }
        showToast(chosenCourier ? 'Tracking number saved (' + chosenCourier + ')' : 'Tracking number saved');
        render();
      });
    });
    document.querySelectorAll('.trackingNumInput').forEach(function(inp){
      inp.addEventListener('keydown', function(e){
        if(e.key === 'Enter'){
          e.preventDefault();
          var orderId = inp.getAttribute('data-order');
          var btn = document.querySelector('.saveTrackingNumBtn[data-order="' + orderId + '"]');
          if(btn) btn.click();
        }
      });

        var orderId = inp.getAttribute('data-order');

        var row = document.getElementById('courierDetectRow_' + orderId);
        var label = document.getElementById('courierDetectLabel_' + orderId);

        if(!row || !label || !select) return;
        if(!val){
          row.style.display = 'none';
          select.value = '';
          select.setAttribute('data-autofilled', 'true');

          if(select.getAttribute('data-autofilled') !== 'false'){
            select.value = detected;
            select.setAttribute('data-autofilled', 'true');

  // ===== LIVE MULTI-SHOT CAMERA (Tracking tab) =====
  // Opens the camera once and keeps it running while packing several
  // parcels in a row — tap the shutter after each one, no re-opening the
  // picker each time. Deliberately avoids re-rendering the whole overlay on
  // every shot (that would tear down and restart the <video> stream); only
  // the thumbnail strip and counter update in place.
  async function openLiveParcelCamera(){
    var stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    }catch(err){

  function captureLiveCamShot(){
    var video = document.getElementById('liveCamVideo');
    if(!video || !video.videoWidth){ showToast('Camera still starting \u2014 try again in a moment'); return; }
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    canvas.toBlob(function(blob){
      if(!blob || !state.liveCam) return;
      var shot = { blob: blob, previewUrl: URL.createObjectURL(blob) };
      state.liveCam.shots.push(shot);
      var strip = document.getElementById('liveCamThumbStrip');
      if(strip){
        var img = document.createElement('img');
        img.src = shot.previewUrl;
        img.style.cssText = 'width:44px;height:56px;object-fit:cover;border-radius:6px;border:1px solid #3c4043;flex-shrink:0;';
        strip.appendChild(img);
        strip.scrollLeft = strip.scrollWidth;
      }
      var countEl = document.getElementById('liveCamCount');
      if(countEl){ countEl.textContent = state.liveCam.shots.length + ' parcel' + (state.liveCam.shots.length!==1?'s':'') + ' captured \u2014 keep going or tap Done'; countEl.style.color = '#7fd99a'; }
      var doneBtn = document.getElementById('liveCamDoneBtn');
      if(doneBtn){ doneBtn.disabled = false; doneBtn.textContent = 'Done (' + state.liveCam.shots.length + ')'; }
      // Quick flash for shutter feedback, without disturbing the live feed.
      video.style.opacity = '0.35';
      setTimeout(function(){ video.style.opacity = '1'; }, 110);
    }, 'image/jpeg', 0.85);
  }

  function closeLiveParcelCamera(){
    if(state.liveCam && state.liveCam.stream){
      state.liveCam.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    state.liveCam = null;
    closeModal();
  }

  function finishLiveParcelCamera(){
    if(!state.liveCam) return;
    var shots = state.liveCam.shots.slice();
    closeLiveParcelCamera();
    if(shots.length === 0) return;
    scanParcelPhotos(shots.map(function(s){ return s.blob; }));
  }

  async function scanParcelPhotos(files){
    state.trackingOcrProcessing = true;
    render();

    var matchedResults = [];
    for(var i=0;i<files.length;i++){
      try{
        var resizedBlob = await resizeImageToBlob(files[i], 1400);
        var result = await Tesseract.recognize(resizedBlob, 'eng', {
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz#-/:. '
        });
        var text = (result && result.data) ? result.data.text : '';
        var match = findOrderIdInText(text);
        var matchedOrder = match ? state.orders.find(function(o){ return o.id === match; }) : null;
        if(matchedOrder){
          await attachTrackingPhoto(matchedOrder, resizedBlob);
          // Same photo also shows the courier sticker — read the tracking
          // number from it and save it in the same step.
          var trk = findTrackingInText(text);
          var savedTrk = null;
          if(trk && trk.value !== matchedOrder.tracking_number){
            var trkRes = await saveTrackingForOrder(matchedOrder.id, trk.value, trk.courier);
            if(trkRes.ok){ savedTrk = trk; }
          }else if(trk){
            savedTrk = trk; // already saved earlier — still show it in the summary
          }
          matchedResults.push({ orderId: matchedOrder.id, tracking: savedTrk ? savedTrk.value : null, courier: savedTrk ? savedTrk.courier : null });
        }else{
          state.trackingUnmatched.push({ blob: resizedBlob, previewUrl: URL.createObjectURL(resizedBlob), ocrText: text });
        }
      }catch(err){
        showToast('Could not read a photo: ' + (err && err.message ? err.message : 'try again'));
      }
    }

    state.trackingOcrProcessing = false;
    render();
    if(matchedResults.length){
      openPackedShippedConfirm(matchedResults);
    }else{
      showToast('Finished scanning ' + files.length + ' photo' + (files.length!==1?'s':''));
    }
  }

  function findOrderIdInText(text){
    var matches = text.match(/#?\s*(\d{3,5})/g);
    if(!matches) return null;
    var candidates = matches.map(function(m){ return m.replace(/[#\s]/g,''); });
    var validIds = Array.from(new Set(candidates.filter(function(c){
      return state.orders.some(function(o){ return o.id === c; });
    })));
    return validIds.length === 1 ? validIds[0] : null;
  }

  // Pulls a courier tracking number out of the OCR text of a packed-parcel
  // photo. Only accepts values that start with a prefix we already know from
  // courier_prefixes — that's what keeps phone numbers, pincodes and other
  // digits on the label from being mistaken for a tracking number.
  function findTrackingInText(text){
    if(!text) return null;
    var upper = text.toUpperCase();
    var candidates = (upper.match(/[A-Z0-9]{7,20}/g) || []).slice();
    // Stickers often print the number with gaps ("WNAP 0000 0582 11") and
    // OCR keeps those gaps — collapse each printed line and scan again.
    upper.split('\n').forEach(function(line){
      var collapsed = line.replace(/[\s\-.]+/g, '');
      var m = collapsed.match(/[A-Z0-9]{8,20}/g);
      if(m){ candidates = candidates.concat(m); }
    });
    var rules = (state.courierPrefixes || []).slice().sort(function(a,b){
      return b.prefix.length - a.prefix.length;
    });
    var best = null;
    for(var i=0;i<rules.length;i++){
      var pfx = rules[i].prefix.toUpperCase();
      for(var j=0;j<candidates.length;j++){
        var c = candidates[j];
        // Must start with the prefix, be a realistic tracking length, be
        // longer than the prefix itself (a bare prefix is noise), and not
        // contain a long letter run (that's a glued-together word, not a
        // tracking number — real ones top out at 4-letter prefixes).
        if(c.indexOf(pfx) === 0 && c.length >= 8 && c.length <= 18 && c.length > pfx.length + 3 && !/[A-Z]{5,}/.test(c)){
          if(!best || c.length > best.value.length){ best = { value: c, courier: rules[i].courier_name }; }
        }
      }
      if(best) break; // longest-prefix rule wins outright
    }
    return best;
  }

  async function attachTrackingPhoto(ord, blob){
    var path = ord.id + '/tracking_' + Date.now() + '.jpg';
    var { error: upErr } = await sb.storage.from('order-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if(upErr){ showToast('Upload failed: ' + upErr.message); return; }
    var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
    var { error } = await sb.from('orders').update({ tracking_photo_url: pub.publicUrl }).eq('id', ord.id);
    if(error){ showToast('Could not save: ' + error.message); return; }
    ord.tracking_photo_url = pub.publicUrl;
  }

  // Direct tracking links, only for couriers where the URL format is
  // actually confirmed to work — number goes straight in, no typing needed.
  var COURIER_DIRECT_TRACK_URL = {
    'delhivery': function(t){ return 'https://www.delhivery.com/track/package/' + encodeURIComponent(t); },
    'ekart': function(t){ return 'https://www.ekartlogistics.com/shipmenttrack/' + encodeURIComponent(t); }
  };
  // Official tracking pages for couriers whose sites require typing the
  // number in manually + solving a CAPTCHA — no way to pre-fill it, but this
  // at least sends the client straight to the correct official page instead
  // of a generic search. The tracking number is already in the message text
  // right above the link, ready to copy.
  var COURIER_PAGE_ONLY_URL = {
    'bluedart': 'https://www.bluedart.com/track-trace',
    'dtdc': 'https://www.dtdc.com/track-your-shipment/',
    'india post': 'https://www.indiapost.gov.in/_layouts/15/dop.portal.tracking/trackconsignment.aspx',
    'tirupati': 'https://www.shreetirupaticourier.net/',
    'franch express': 'https://franchexpress.com/courier-tracking/'
  };
  // Matches by substring, not exact equality — real courier names in this
  // app include extra detail staff added themselves (e.g. "Delhivery (5-7
  // Days For Delivery)"), so an exact match would never fire.
  function getTrackingLink(courier, trackingNumber){
    var courierLower = (courier || '').trim().toLowerCase();
    for(var key in COURIER_DIRECT_TRACK_URL){
      if(courierLower.indexOf(key) !== -1) return COURIER_DIRECT_TRACK_URL[key](trackingNumber);
    }
    for(var key2 in COURIER_PAGE_ONLY_URL){
      if(courierLower.indexOf(key2) !== -1) return COURIER_PAGE_ONLY_URL[key2];
    }
    return 'https://www.google.com/search?q=' + encodeURIComponent('track ' + (courier||'') + ' ' + trackingNumber);
  }

  function buildTrackingShareText(o){
    var SEP = '\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500';
    var lines = ['Order #' + o.id, SEP];
    if(o.tracking_number){
      // The tracking number itself is the source of truth — staff sometimes
      // pick a courier at booking time, then actually ship with a different
      // one. Trust what the number's prefix says over the stored field.
      var detectedCourier = detectCourierFromTracking(o.tracking_number);
      var effectiveCourier = detectedCourier || o.courier;
      lines.push('Tracking: ' + o.tracking_number + (effectiveCourier ? ' (' + effectiveCourier + ')' : ''));
      lines.push('Track here: ' + getTrackingLink(effectiveCourier, o.tracking_number));
    }else{
      lines.push('Tracking number coming soon');
    }
    if(o.address){
      lines.push(SEP);
      lines.push('Address: ' + o.address);
    }
    return lines.join('\n');
  }

  async function shareTrackingToWhatsApp(reseller, btn){
    var orders = state.orders.filter(function(o){ return o.reseller_name === reseller && (o.tracking_photo_url || o.tracking_number) && !o.tracking_shared_at; });
    if(orders.length === 0) return;
    var batch = orders.slice(0, 10);

    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }

    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    var messageText = batch.map(buildTrackingShareText).join('\n\n');

    try{
      var withPhoto = batch.filter(function(o){ return o.tracking_photo_url; });
      var files = await Promise.all(withPhoto.map(async function(o){
        var res = await fetch(o.tracking_photo_url);
        var blob = await res.blob();
        return new File([blob], 'tracking_' + o.id + '.jpg', { type: 'image/jpeg' });
      }));

      var shareData = files.length > 0 ? { files: files, text: messageText } : { text: messageText };
      if(files.length > 0 && navigator.canShare && !navigator.canShare(shareData)){
        showToast('Your phone can\u2019t share this many at once \u2014 try fewer');
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        return;
      }

      await navigator.share(shareData);
      openTrackingShareConfirm(reseller, batch);
    }catch(err){
      if(err && err.name === 'AbortError'){
        // user cancelled the share sheet
      }else{
        showToast('Could not prepare photos: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  // Share a single order's tracking anytime, from Orders List — including
  // re-sharing one that was already sent before (customer asking again, etc).
  async function shareOneOrderTracking(order, btn){
    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }
    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    var messageText = buildTrackingShareText(order);

    try{
      var shareData = { text: messageText };
      if(order.tracking_photo_url){
        try{
          var res = await fetch(order.tracking_photo_url);
          var blob = await res.blob();
          var file = new File([blob], 'tracking_' + order.id + '.jpg', { type: 'image/jpeg' });
          if(!navigator.canShare || navigator.canShare({ files: [file] })){
            shareData.files = [file];
          }
        }catch(e){ /* photo optional — still share the text either way */ }
      }
      await navigator.share(shareData);
      var nowIso = new Date().toISOString();
      order.tracking_shared_at = nowIso;
      showToast('Tracking shared for #' + order.id);
      sb.from('orders').update({ tracking_shared_at: nowIso }).eq('id', order.id).then(function(res){
        if(res.error){ showToast('Warning: could not save shared status: ' + res.error.message); }
      });
    }catch(err){
      if(!(err && err.name === 'AbortError')){
        showToast('Could not share: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }
