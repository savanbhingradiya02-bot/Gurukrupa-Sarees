<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Gurukrupa Sarees</title>
<style>
  * { box-sizing: border-box; }

  .btn-add-photo {

  }
  .photo-shop-rows { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

  .order-name { font-size: 14.5px; font-weight: 600; margin: 0 0 3px; color: #e8eaed; }

  .piece-id-tag {

  .shop-name-tag {

  .order-address { font-size: 13.5px; color: #9aa0a6; white-space: pre-line; line-height: 1.55; margin: 0 0 10px; }
  .order-cancel-note { display: block; font-size: 12px; color: #f28b82; background: rgba(242,139,130,0.12); padding: 4px 9px; border-radius: 6px; margin-bottom: 6px; white-space: pre-line; }
  .order-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-ship { flex: 1; padding: 9px; font-size: 13px; font-weight: 600; background: #34a853; color: #06210f; border: none; border-radius: 8px; cursor: pointer; }
  .btn-unship { flex: 1; padding: 9px; font-size: 13px; background: #28292c; border: 1px solid #3c4043; border-radius: 8px; cursor: pointer; color: #9aa0a6; }
  .btn-cancel { padding: 9px 12px; background: #28292c; border: 1px solid #5c3a3a; color: #f28b82; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .btn-del { padding: 9px 12px; background: #28292c; border: 1px solid #5c3a3a; color: #f28b82; border-radius: 8px; cursor: pointer; }
  mark { background: #fdd663; color: #131314; padding: 0 1px; border-radius: 2px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #3c4043; color: #e8eaed; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 50; max-width: 90%; text-align: center; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .modal-box { background: #28292c; border: 1px solid #3c4043; border-radius: 14px; padding: 18px; max-width: 340px; width: 100%; text-align: center; color: #e8eaed; }
  .draw-modal-box { background: #131314; width: 100%; max-width: 480px; height: 100%; max-height: 100vh; display: flex; flex-direction: column; padding: 0; }
  .draw-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #3c4043; }
  .draw-header h2 { font-size: 15px; margin: 0; color: #e8eaed; }
  .draw-close-btn { background: none; border: none; color: #9aa0a6; font-size: 22px; cursor: pointer; line-height: 1; padding: 4px; }
  .draw-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 8px; touch-action: none; }
  .draw-canvas-wrap canvas { max-width: 100%; max-height: 100%; border-radius: 6px; touch-action: none; cursor: crosshair; }
  .draw-controls { padding: 12px 16px; border-top: 1px solid #3c4043; }
  .draw-colors { display: flex; gap: 10px; margin-bottom: 12px; justify-content: center; }
  .draw-color-swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #3c4043; cursor: pointer; padding: 0; }
  .draw-color-swatch.active { border-color: #fff; box-shadow: 0 0 0 2px #d97a3f; }
  .draw-actions { display: flex; gap: 8px; }
  .draw-actions button { flex: 1; padding: 11px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
  .btn-draw-undo { background: #3c4043; color: #e8eaed; }
  .btn-draw-cancel { background: #28292c; color: #f28b82; border: 1px solid #5c3a3a !important; }
  .btn-draw-done { background: #d97a3f; color: #1a1207; }
  .modal-box textarea { margin-top: 10px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .zoom-img { max-width: 100%; max-height: 80vh; border-radius: 10px; }
  .print-slip { padding: 14px 4px; border-bottom: 1px dashed #cabfae; color: #111; break-inside: avoid; page-break-inside: avoid; }
  .print-slip:last-child { border-bottom: none; }
  @page { margin: 0.4in; }
  .slip-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 2px; }
  .slip-id { font-family: monospace; font-size: 17px; font-weight: 700; }
  .slip-size { font-size: 13px; color: #444; }
  .slip-time { font-size: 11px; color: #666; margin-bottom: 6px; }
  .slip-name { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .slip-courier { font-size: 12px; color: #a14f19; margin: 0 0 4px; }
  .slip-address { font-size: 13px; white-space: pre-line; line-height: 1.5; margin: 0; }
  .print-header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
  .btn-print { padding: 9px 16px; background: #d97a3f; color: #1a1207; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-print:disabled { opacity: 0.5; }
  .loading-state { text-align: center; padding: 50px 16px; color: #80868b; font-size: 14px; }
  .banner { font-size: 12.5px; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; }
  .shop-row { margin-bottom: 22px; border-bottom: 1px solid #3c4043; padding-bottom: 18px; }
  .shop-row-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .shop-row-name { font-size: 16px; font-weight: 800; color: #e8eaed; }
  .shop-row-count { font-size: 12px; color: #80868b; }
  .shop-share-btn { margin-left: auto; font-size: 12px; padding: 6px 12px; }
  .shop-row-tray { display: flex; flex-wrap: wrap; gap: 8px; }
  .shop-tray-item { position: relative; width: 110px; border-radius: 8px; overflow: hidden; background: #202124; }
  .shop-tray-item img { width: 100%; height: 140px; object-fit: cover; display: block; cursor: zoom-in; }
  .shop-tray-caption { font-size: 10px; color: #9aa0a6; padding: 4px 5px; line-height: 1.3; }
  .banner.warn { background: rgba(253,214,99,0.12); border: 1px solid rgba(253,214,99,0.3); color: #fdd663; }
  .banner.err { background: rgba(242,139,130,0.12); border: 1px solid rgba(242,139,130,0.3); color: #f28b82; }

  .album-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 4px; margin-bottom: 90px; width: 100%; max-width: 100%; }
  @media (max-width: 699px) {
    .album-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .album-cell { width: auto; height: 150px; aspect-ratio: auto; }
  }
  .album-cell { position: relative; cursor: pointer; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden; background: #202124; }
  .album-cell img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.12s, border-radius 0.12s; }
  .album-cell.selected img { transform: scale(0.9); border-radius: 14px; opacity: 0.4; }
  .album-check {
    position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,0.25); border: 1.5px solid #fff; display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent; z-index: 2; opacity: 0; transition: opacity 0.12s;
  }
  .album-cell.selected .album-check { background: #8ab4f8; border-color: #8ab4f8; color: #131314; opacity: 1; }
  @media (hover: hover) {
    .album-cell:hover .album-check { opacity: 1; }
  }
  .album-zoom-btn {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: transparent; border: none; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 3; padding: 0; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.9));
    opacity: 0; transition: opacity 0.12s;
  }
  .album-zoom-btn svg { width: 18px; height: 18px; }
  @media (hover: hover) {
    .album-cell:hover .album-zoom-btn { opacity: 1; }
  }
  @media (hover: none) {
    .album-zoom-btn { opacity: 0.9; width: 30px; height: 30px; }
    .album-zoom-btn svg { width: 20px; height: 20px; }
  }
  .ship-bar { position: fixed; left: 0; right: 0; bottom: 0; background: #28292c; border-top: 1px solid #3c4043; color: #e8eaed; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 40; max-width: 480px; margin: 0 auto; }
  .ship-bar span { font-size: 13px; }
  .ship-bar-actions { display: flex; gap: 8px; }
  .ship-bar button { padding: 9px 14px; border-radius: 8px; font-size: 12.5px; cursor: pointer; border: none; }
  .btn-clear-sel { background: #3c4043; color: #e8eaed; }
  .btn-ship-print { background: #d97a3f; color: #1a1207; font-weight: 700; }
  #shipPrintArea { display: none; }

  .login-screen { min-height: 85vh; display: flex; align-items: center; justify-content: center; }
  .login-wrap { width: 100%; max-width: 380px; padding: 0 16px; text-align: center; }
  .login-brand { font-size: 44px; font-weight: 900; letter-spacing: 2px; color: #e8eaed; line-height: 1; }
  .login-brand-sub { font-size: 13px; font-weight: 700; letter-spacing: 8px; color: #d97a3f; margin: 6px 0 32px; }
  .login-box { background: #202124; border: 1px solid #3c4043; border-radius: 20px; padding: 32px 28px; text-align: left; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
  .login-tagline { font-size: 14px; color: #9aa0a6; margin: 0 0 26px; text-align: center; }
  .login-box .field { margin-bottom: 20px; }
  .login-box label { font-size: 14px; margin-bottom: 8px; }
  .login-box input { padding: 14px 16px; font-size: 16px; border-radius: 12px; }
  .login-box .btn-primary { padding: 16px; font-size: 16px; border-radius: 12px; margin-top: 8px; }

  .brand-wrap { position: relative; padding-left: 52px; }
  .menu-row { position: absolute; top: 50%; transform: translateY(-50%); left: 0; margin-bottom: 0; z-index: 6; }
  .app-brand {
    font-size: clamp(30px, 11.5vw, 91px); font-weight: 900; letter-spacing: 1px; text-align: center; color: #e8eaed;
    margin: 10px 0 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; line-height: 1;
    white-space: nowrap;
  }
  .app-brand-sub {
    font-size: clamp(10px, 2.4vw, 18px); font-weight: 700; letter-spacing: 5px; text-align: center; color: #d97a3f; margin: 6px 0 20px;
  }
  .menu-btn {
    display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 10px; background: #202124; border: 1px solid #3c4043; cursor: pointer;
  }
  .menu-btn svg { width: 19px; height: 19px; }
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 70; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .sidebar-panel {
    position: fixed; top: 0; left: 0; height: 100%; width: 260px; max-width: 82vw;

    transform: translateX(-100%); transition: transform 0.22s ease;
  }
  .sidebar-panel.open { transform: translateX(0); }
  .sidebar-top-row { display: flex; justify-content: flex-end; }
  .sidebar-close { background: none; border: none; color: #9aa0a6; font-size: 24px; cursor: pointer; padding: 4px 8px; line-height: 1; }
  .sidebar-identity { display: flex; align-items: center; gap: 10px; margin: 14px 0 24px; }
  .sidebar-identity span { flex: 1; min-width: 0; font-size: 13.5px; color: #e8eaed; font-weight: 600; line-height: 1.4; word-wrap: break-word; }
  .user-avatar-icon {
    width: 34px; height: 34px; border-radius: 50%; background: rgba(217,122,63,0.18); border: 1.5px solid #d97a3f;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .user-avatar-icon svg { width: 18px; height: 18px; }
  .sidebar-panel button {
    display: block; width: 100%; text-align: left; background: #28292c; border: 1px solid #3c4043; color: #e8eaed;
    font-size: 13.5px; font-weight: 700; cursor: pointer; padding: 12px 16px; border-radius: 10px;
    margin-bottom: 10px; transition: background 0.15s;
  }

  .sidebar-panel #logoutBtn { color: #f28b82; border-color: #5c3a3a; }
  @media print {
    .no-print { display: none !important; }
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { position: absolute; left: 0; top: 0; width: 100%; color: #111; }
    #shipPrintArea { display: block !important; }
    #shipPrintArea, #shipPrintArea * { visibility: visible; }
    #shipPrintArea { position: absolute; left: 0; top: 0; width: 100%; color: #111; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toastHost"></div>

  function esc(s){
    var div = document.createElement('div');
    div.textContent = s == null ? '' : s;
    return div.innerHTML;
  }

  function escapeRegex(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function tryAutocomplete(inputEl, suggestions){
    var val = (inputEl.value || '').trim();
    if(!val) return;
    var lower = val.toLowerCase();
    var alreadyExact = suggestions.some(function(s){ return s.toLowerCase() === lower; });
    if(alreadyExact) return;
    var matches = suggestions.filter(function(s){ return s.toLowerCase().indexOf(lower) !== -1; });
    if(matches.length === 1){
      inputEl.value = matches[0];
      inputEl.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  function highlightText(text, query){
    var str = text == null ? '' : String(text);
    if(!query || !query.trim()) return esc(str);
    var q = query.trim();
    var re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
    var parts = str.split(re);
    return parts.map(function(part, i){
      if(part === undefined || part === '') return '';
      return (i % 2 === 1) ? '<mark>' + esc(part) + '</mark>' : esc(part);
    }).join('');
  }

  function formatTime(ts){
    if(!ts) return '';

  function resizeImageToBlob(file, maxW){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error('Could not read the photo file')); };
      reader.onload = function(e){
        var img = new Image();
        img.onerror = function(){ reject(new Error('Could not decode the photo')); };
        img.onload = function(){
          var w = img.width, hh = img.height;
          if(w > maxW){ hh = Math.round(hh * (maxW/w)); w = maxW; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = hh;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, hh);
          canvas.toBlob(function(blob){
            if(!blob){ reject(new Error('Could not compress photo')); return; }
            resolve(blob);
          }, 'image/jpeg', 0.6);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function drawWatermarkedBlob(sourceBlob, pieceId, sizeVal){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objUrl = URL.createObjectURL(sourceBlob);
      img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error('Could not load photo to stamp order ID')); };
      img.onload = function(){
        URL.revokeObjectURL(objUrl);
        var canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);

        var lines = ['#' + pieceId];
        var trimmedSize = (sizeVal || '').trim();
        if(trimmedSize) lines.push(trimmedSize);

        var fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif";
        var fontSize = Math.max(20, Math.round(canvas.width * 0.065));
        ctx.font = '800 ' + fontSize + 'px ' + fontFamily;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        var lineHeight = fontSize * 1.25;
        var padX = fontSize * 0.6;
        var padY = fontSize * 0.4;

        var maxTextWidth = 0;
        lines.forEach(function(line){
          var w = ctx.measureText(line).width;
          if(w > maxTextWidth) maxTextWidth = w;
        });

        var boxWidth = maxTextWidth + padX * 2;
        var boxHeight = (lines.length * lineHeight) + padY * 2;
        var centerX = canvas.width / 2;
        var centerY = canvas.height / 2;
        var boxX = centerX - boxWidth / 2;
        var boxY = centerY - boxHeight / 2;
        var radius = fontSize * 0.28;

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(boxX + radius, boxY);
        ctx.arcTo(boxX + boxWidth, boxY, boxX + boxWidth, boxY + boxHeight, radius);
        ctx.arcTo(boxX + boxWidth, boxY + boxHeight, boxX, boxY + boxHeight, radius);
        ctx.arcTo(boxX, boxY + boxHeight, boxX, boxY, radius);
        ctx.arcTo(boxX, boxY, boxX + boxWidth, boxY, radius);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#000000';
        lines.forEach(function(line, i){
          var y = boxY + padY + (i + 0.5) * lineHeight;
          ctx.fillText(line, centerX, y);
        });

        canvas.toBlob(function(outBlob){
          if(!outBlob){ reject(new Error('Could not finalize stamped photo')); return; }
          resolve(outBlob);
        }, 'image/jpeg', 0.85);
      };
      img.src = objUrl;
    });
  }

  function createThumbnailBlob(sourceBlob, maxW){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var objUrl = URL.createObjectURL(sourceBlob);
      img.onerror = function(){ URL.revokeObjectURL(objUrl); reject(new Error('Could not create thumbnail')); };
      img.onload = function(){
        URL.revokeObjectURL(objUrl);
        var w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob){
          if(!blob){ reject(new Error('Could not finalize thumbnail')); return; }
          resolve(blob);
        }, 'image/jpeg', 0.6);
      };
      img.src = objUrl;
    });
  }

  async function initAuth(){
    var { data } = await sb.auth.getSession();
    state.session = data.session;

      state.session = session;
      if(event === 'SIGNED_IN'){

        render();

      // Other events (e.g. TOKEN_REFRESHED when the tab regains focus) update the
      // session silently without reloading data or re-rendering, so unsaved text
      // in any input field is never wiped out.
    });
    if(state.session){
      await loadOrders();
    }else{
      state.loading = false;
      render();
    }
  }

  var loadOrdersInFlight = false;
  async function loadOrders(){
    if(loadOrdersInFlight) return; // prevent duplicate concurrent loads (page load + SIGNED_IN event both fire)
    loadOrdersInFlight = true;
    state.loading = true;
    render();
    try{
      // Start the 4 list queries NOW so they run in parallel with orders/items
      var listPromise = Promise.all([
        sb.from('resellers').select('name,hidden'),
        sb.from('shops').select('name,hidden'),
        sb.from('couriers').select('name,hidden'),
        sb.from('sizes').select('name,hidden')
      ]);

      var { data: orders, error: ordersErr } = await sb
        .from('orders')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(300);
      if(ordersErr) throw ordersErr;

      var orderIds = (orders||[]).map(function(o){ return o.id; });
      var items = [];
      if(orderIds.length > 0){
        var { data: itemsData, error: itemsErr } = await sb
          .from('order_items')
          .select('*')
          .in('order_id', orderIds)
          .order('item_index', { ascending: true });
        if(itemsErr) throw itemsErr;
        items = itemsData || [];
      }

      var byOrder = {};
      (items||[]).forEach(function(it){
        if(!byOrder[it.order_id]) byOrder[it.order_id] = [];
        byOrder[it.order_id].push(it);
      });

      state.orders = (orders||[]).map(function(o){
        o.items = byOrder[o.id] || [];
        return o;
      });

      var names = {};
      state.orders.forEach(function(o){ if(o.reseller_name) names[o.reseller_name.toLowerCase()] = o.reseller_name; });

      var shopNames = {};
      (items||[]).forEach(function(it){ if(it.shop_name) shopNames[it.shop_name.toLowerCase()] = it.shop_name; });

      var courierNames = {};
      state.orders.forEach(function(o){ if(o.courier) courierNames[o.courier.toLowerCase()] = o.courier; });

      var sizeNames = {};
      (items||[]).forEach(function(it){ if(it.size) sizeNames[it.size.toLowerCase()] = it.size; });

      var listResults = await listPromise;
      var resellerRows = listResults[0].data;
      var shopRows = listResults[1].data;
      var courierRows = listResults[2].data;
      var sizeRows = listResults[3].data;

      var hiddenResellers = {};
      (resellerRows||[]).forEach(function(r){
        if(r.hidden){ hiddenResellers[r.name.toLowerCase()] = true; }
        else{ names[r.name.toLowerCase()] = r.name; }
      });

      var hiddenShops = {};
      (shopRows||[]).forEach(function(r){
        if(r.hidden){ hiddenShops[r.name.toLowerCase()] = true; }
        else{ shopNames[r.name.toLowerCase()] = r.name; }
      });

      var hiddenCouriers = {};
      (courierRows||[]).forEach(function(r){
        if(r.hidden){ hiddenCouriers[r.name.toLowerCase()] = true; }
        else{ courierNames[r.name.toLowerCase()] = r.name; }
      });

      var hiddenSizes = {};
      (sizeRows||[]).forEach(function(r){
        if(r.hidden){ hiddenSizes[r.name.toLowerCase()] = true; }
        else{ sizeNames[r.name.toLowerCase()] = r.name; }
      });

      Object.keys(hiddenResellers).forEach(function(k){ delete names[k]; });
      Object.keys(hiddenShops).forEach(function(k){ delete shopNames[k]; });
      Object.keys(hiddenCouriers).forEach(function(k){ delete courierNames[k]; });
      Object.keys(hiddenSizes).forEach(function(k){ delete sizeNames[k]; });

      state.resellers = Object.values(names).sort();
      state.shops = Object.values(shopNames).sort();
      state.couriers = Object.values(courierNames).sort();
      state.sizes = Object.values(sizeNames).sort();

    }catch(e){
      showToast('Could not load orders: ' + (e && e.message ? e.message : 'unknown error'));
    }
    state.loading = false;
    loadOrdersInFlight = false;
    render();
  }

  function orderProgress(o){
    var items = o.items || [];
    var total = items.length;
    var shippedCount = items.filter(function(i){ return i.status === 'shipped'; }).length;
    return { total: total, shippedCount: shippedCount };
  }

  function orderDisplayStatus(o){
    if(o.status === 'cancelled') return 'cancelled';
    var p = orderProgress(o);
    if(p.total > 0 && p.shippedCount === p.total) return 'shipped';
    if(p.shippedCount > 0) return 'partial';
    return 'pending';
  }

  function addToLocalList(list, val){
    val = (val || '').trim();
    if(!val) return;
    var exists = list.some(function(n){ return n.toLowerCase() === val.toLowerCase(); });
    if(!exists){ list.push(val); list.sort(); }
  }

  // Fetch the next order number ahead of time so Save doesn't wait ~600ms for it
  var nextOrderIdPromise = null;
  function prefetchOrderId(){
    if(nextOrderIdPromise) return;
    nextOrderIdPromise = sb.rpc('get_next_order_id').then(function(res){
      if(res.error){ nextOrderIdPromise = null; return null; }
      return res.data;
    }, function(){ nextOrderIdPromise = null; return null; });
  }

  async function saveOrder(name, courier, address, photoEntries){
    var orderId = nextOrderIdPromise ? await nextOrderIdPromise : null;
    nextOrderIdPromise = null; // this number is now used up
    if(!orderId){
      var { data: idData, error: idErr } = await sb.rpc('get_next_order_id');
      if(idErr) throw new Error('Could not get order number: ' + idErr.message);
      orderId = idData;
    }

    var orderInsertPromise = sb.from('orders').insert({
      id: orderId,
      reseller_name: name,
      courier: courier,
      address: address,
      status: 'pending',
      created_by: state.session.user.id
    }).select().single();

    var uploadPromises = photoEntries.map(async function(entry, i){
      var pieceId = orderId + '-' + (i + 1);
      var stampedBlob = await drawWatermarkedBlob(entry.blob, pieceId, entry.sizeVal);
      var thumbBlob = await createThumbnailBlob(stampedBlob, 260);

      var path = orderId + '/' + Date.now() + '_' + i + '.jpg';
      var thumbPath = orderId + '/' + Date.now() + '_' + i + '_thumb.jpg';

      var uploadResults = await Promise.all([
        sb.storage.from('order-photos').upload(path, stampedBlob, { contentType: 'image/jpeg' }),
        sb.storage.from('order-photos').upload(thumbPath, thumbBlob, { contentType: 'image/jpeg' })
      ]);
      if(uploadResults[0].error) throw new Error('Photo ' + (i+1) + ' upload failed: ' + uploadResults[0].error.message);
      if(uploadResults[1].error) throw new Error('Thumbnail ' + (i+1) + ' upload failed: ' + uploadResults[1].error.message);

      var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
      var { data: pubThumb } = sb.storage.from('order-photos').getPublicUrl(thumbPath);
      return { photoUrl: pub.publicUrl, thumbUrl: pubThumb.publicUrl };
    });

    var results = await Promise.all([orderInsertPromise].concat(uploadPromises));
    var orderResult = results[0];
    if(orderResult.error) throw new Error('Order save failed: ' + orderResult.error.message);
    var uploaded = results.slice(1);

    var itemRows = uploaded.map(function(u, idx){
      return {
        order_id: orderId, item_index: idx, photo_url: u.photoUrl, thumb_url: u.thumbUrl, status: 'pending',
        shop_name: (photoEntries[idx].shopVal || '').trim() || null,
        size: (photoEntries[idx].sizeVal || '').trim() || null
      };
    });
    var { data: insertedItems, error: itemsErr } = await sb.from('order_items').insert(itemRows).select();
    if(itemsErr) throw new Error('Photo records failed: ' + itemsErr.message);

    var newOrder = orderResult.data;
    newOrder.items = (insertedItems || []).sort(function(a,b){ return a.item_index - b.item_index; });
    return newOrder;
  }

  async function bulkUpdateOrderItems(orderId, status){
    var ord = state.orders.find(function(o){ return o.id === orderId; });
    if(!ord) return;
    var patch = { status: status };
    if(status === 'shipped'){ patch.shipped_at = new Date().toISOString(); patch.shipped_by = state.session.user.id; }
    else { patch.shipped_at = null; patch.shipped_by = null; }

    // Update screen instantly; sync to database in background
    var wasCancelled = ord.status === 'cancelled';
    if(wasCancelled){ ord.status = 'pending'; }
    (ord.items||[]).forEach(function(it){
      it.status = status;
      it.shipped_at = patch.shipped_at;
      it.shipped_by = patch.shipped_by;
    });
    showToast(status === 'shipped' ? 'All pieces marked shipped' : 'All pieces marked pending');
    render();

    var dbOps = [sb.from('order_items').update(patch).eq('order_id', orderId)];
    if(wasCancelled){ dbOps.push(sb.from('orders').update({ status: 'pending' }).eq('id', orderId)); }
    Promise.all(dbOps).then(function(results){
      var failed = results.find(function(r){ return r.error; });
      if(failed){
        showToast('Warning: update did not save: ' + failed.error.message);
        loadOrders();
      }
    });
  }

  async function deleteOrder(id){
    var { error } = await sb.from('orders').delete().eq('id', id);
    if(error){ showToast('Delete failed: ' + error.message); return; }
    state.orders = state.orders.filter(function(o){ return o.id !== id; });
    showToast('Order deleted');
    closeModal();
    render();
  }

  function cancelOrder(id, reason){
    var nowIso = new Date().toISOString();
    // Update screen instantly; sync to database in background
    var ord = state.orders.find(function(o){ return o.id === id; });
    if(ord){
      ord.status = 'cancelled';
      ord.cancel_reason = reason;
      ord.cancelled_at = nowIso;
    }
    showToast('Order cancelled');
    closeModal();
    render();
    sb.from('orders').update({
      status: 'cancelled',
      cancel_reason: reason,
      cancelled_at: nowIso,
      cancelled_by: state.session.user.id
    }).eq('id', id).then(function(res){
      if(res.error){
        showToast('Warning: cancel did not save: ' + res.error.message);
        loadOrders();
      }
    });
  }

  async function printAndMarkShipped(){
    var selections = Object.values(state.shipSelection);
    if(selections.length === 0) return;

    var groups = {};
    selections.forEach(function(sel){
      if(!groups[sel.orderId]) groups[sel.orderId] = [];
      groups[sel.orderId].push(sel.itemDbId);
    });

    var orderIds = Object.keys(groups);
    var nowIso = new Date().toISOString();

    // Fire DB updates in the background — print dialog opens instantly
    var updatePromises = orderIds.map(function(orderId){
      return sb.from('order_items').update({
        status: 'shipped', shipped_at: nowIso, shipped_by: state.session.user.id
      }).in('id', groups[orderId]);
    });
    Promise.all(updatePromises).then(function(updateResults){
      var failedUpdate = updateResults.find(function(r){ return r.error; });
      if(failedUpdate){
        showToast('Warning: could not save shipped status: ' + failedUpdate.error.message);
        loadOrders(); // re-sync from server so screen matches database
      }
    });
    var slipsHtml = '';
    orderIds.forEach(function(orderId){
      var ord = state.orders.find(function(o){ return o.id === orderId; });
      if(!ord) return;
      var dbIds = groups[orderId];

      (ord.items||[]).forEach(function(it){
        if(dbIds.indexOf(it.id) !== -1){
          it.status = 'shipped';
          it.shipped_at = nowIso;
          it.shipped_by = state.session.user.id;
        }
      });

      var prog = orderProgress(ord);
      var shippingNow = dbIds.length;
      slipsHtml += '<div class="print-slip">';
      slipsHtml += '<div class="slip-top"><span class="slip-id">Order #' + esc(ord.id) + '</span>';
      slipsHtml += '</div>';
      slipsHtml += '<div class="slip-time">Booked: ' + formatTime(ord.created_at) + '</div>';
      if(prog.total > 1){
        slipsHtml += '<div class="slip-time">Shipping ' + shippingNow + ' of ' + prog.total + ' piece(s) in this order</div>';
      }
      if(ord.courier) slipsHtml += '<p class="slip-courier">Courier: ' + esc(ord.courier) + '</p>';
      slipsHtml += '<p class="slip-address">' + esc(ord.address) + '</p>';
      slipsHtml += '</div>';
    });

    document.getElementById('shipPrintArea').innerHTML = slipsHtml;
    window.print();
    state.shipSelection = {};
    showToast('Marked shipped and sent to print');
    render();
  }

  function renderManageListsModal(){
    var tab = state.manageListsTab || 'resellers';
    var tableMap = { resellers: 'resellers', shops: 'shops', couriers: 'couriers', sizes: 'sizes' };
    var listMap = { resellers: state.resellers, shops: state.shops, couriers: state.couriers || [], sizes: state.sizes || [] };

  async function scanParcelPhotos(files){
    state.trackingOcrProcessing = true;
    render();

    for(var i=0;i<files.length;i++){
      try{
        var resizedBlob = await resizeImageToBlob(files[i], 1000);
        var result = await Tesseract.recognize(resizedBlob, 'eng');
        var text = (result && result.data) ? result.data.text : '';
        var match = findOrderIdInText(text);
        var matchedOrder = match ? state.orders.find(function(o){ return o.id === match; }) : null;
        if(matchedOrder){
          await attachTrackingPhoto(matchedOrder, resizedBlob);
        }else{
          state.trackingUnmatched.push({ blob: resizedBlob, previewUrl: URL.createObjectURL(resizedBlob) });
        }
      }catch(err){
        showToast('Could not read a photo: ' + (err && err.message ? err.message : 'try again'));
      }
    }

    state.trackingOcrProcessing = false;
    render();
    showToast('Finished scanning ' + files.length + ' photo' + (files.length!==1?'s':''));
  }

  function findOrderIdInText(text){
    var matches = text.match(/#?\s*(\d{3,5})/g);
    if(!matches) return null;
    var candidates = matches.map(function(m){ return m.replace(/[#\s]/g,''); });
    var validIds = Array.from(new Set(candidates.filter(function(c){
      return state.orders.some(function(o){ return o.id === c; });
    })));
    return validIds.length === 1 ? validIds[0] : null;
  }

  async function attachTrackingPhoto(ord, blob){
    var path = ord.id + '/tracking_' + Date.now() + '.jpg';
    var { error: upErr } = await sb.storage.from('order-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if(upErr){ showToast('Upload failed: ' + upErr.message); return; }
    var { data: pub } = sb.storage.from('order-photos').getPublicUrl(path);
    var { error } = await sb.from('orders').update({ tracking_photo_url: pub.publicUrl }).eq('id', ord.id);
    if(error){ showToast('Could not save: ' + error.message); return; }
    ord.tracking_photo_url = pub.publicUrl;
  }

  async function shareTrackingToWhatsApp(reseller, btn){
    var orders = state.orders.filter(function(o){ return o.reseller_name === reseller && (o.tracking_photo_url || o.tracking_number) && !o.tracking_shared_at; });
    if(orders.length === 0) return;
    var batch = orders.slice(0, 10);

    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }

    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    var textLines = ['Tracking updates:'];
    batch.forEach(function(o){
      textLines.push('#' + o.id + (o.tracking_number ? ' \u2014 ' + o.tracking_number : ' \u2014 tracking number coming soon'));
    });
    var messageText = textLines.join('\n');

    try{
      var withPhoto = batch.filter(function(o){ return o.tracking_photo_url; });
      var files = await Promise.all(withPhoto.map(async function(o){
        var res = await fetch(o.tracking_photo_url);
        var blob = await res.blob();
        return new File([blob], 'tracking_' + o.id + '.jpg', { type: 'image/jpeg' });
      }));

      var shareData = files.length > 0 ? { files: files, text: messageText } : { text: messageText };
      if(files.length > 0 && navigator.canShare && !navigator.canShare(shareData)){
        showToast('Your phone can\u2019t share this many at once \u2014 try fewer');
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        return;
      }

      await navigator.share(shareData);
      openTrackingShareConfirm(reseller, batch);
    }catch(err){
      if(err && err.name === 'AbortError'){
        // user cancelled the share sheet
      }else{
        showToast('Could not prepare photos: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  // ===== DRAW / COVER-UP TOOL =====

  var DRAW_COLORS = ['#3fa9f5', '#000000', '#ffffff', '#e05c5c', '#34a853', '#fdd663'];

  function openDrawTool(photoIdx){
    var photo = state.bookPhotos[photoIdx];
    if(!photo) return;

    document.getElementById('modalHost').innerHTML =
      '<div class="modal-overlay" style="padding:0;">' +
        '<div class="draw-modal-box">' +
          '<div class="draw-header"><h2>Cover unwanted text</h2><button class="draw-close-btn" id="drawCloseBtn">\u00d7</button></div>' +
          '<div class="draw-canvas-wrap"><canvas id="drawCanvas"></canvas></div>' +
          '<div class="draw-controls">' +
            '<div class="draw-colors" id="drawColors"></div>' +
            '<div class="draw-actions">' +
              '<button class="btn-draw-undo" id="drawUndoBtn">Undo</button>' +
              '<button class="btn-draw-cancel" id="drawCancelBtn">Cancel</button>' +
              '<button class="btn-draw-done" id="drawDoneBtn">Done</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var colorsHost = document.getElementById('drawColors');
    var currentColor = DRAW_COLORS[0];
    DRAW_COLORS.forEach(function(c, i){
      var sw = document.createElement('button');
      sw.className = 'draw-color-swatch' + (i===0?' active':'');
      sw.style.background = c;
      sw.addEventListener('click', function(){
        currentColor = c;
        document.querySelectorAll('.draw-color-swatch').forEach(function(s){ s.classList.remove('active'); });
        sw.classList.add('active');
      });
      colorsHost.appendChild(sw);
    });

    var canvas = document.getElementById('drawCanvas');
    var ctx = canvas.getContext('2d');
    var img = new Image();
    var strokes = [];
    var currentStroke = null;
    var drawing = false;

    function redraw(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      strokes.forEach(function(s){ paintStroke(s); });
    }

    function paintStroke(s){
      if(s.points.length < 1) return;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = Math.max(canvas.width, canvas.height) * 0.045;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.points[0].x, s.points[0].y);
      for(var i=1;i<s.points.length;i++){ ctx.lineTo(s.points[i].x, s.points[i].y); }
      if(s.points.length === 1){ ctx.lineTo(s.points[0].x + 0.1, s.points[0].y + 0.1); }
      ctx.stroke();
    }

    function getCanvasPoint(e){
      var rect = canvas.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      var scaleX = canvas.width / rect.width;
      var scaleY = canvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDraw(e){
      e.preventDefault();
      drawing = true;
      currentStroke = { color: currentColor, points: [getCanvasPoint(e)] };
      strokes.push(currentStroke);
      paintStroke(currentStroke);
    }
    function moveDraw(e){
      if(!drawing) return;
      e.preventDefault();
      currentStroke.points.push(getCanvasPoint(e));
      redraw();
    }
    function endDraw(e){
      drawing = false;
      currentStroke = null;
    }

    img.onload = function(){
      canvas.width = img.width;
      canvas.height = img.height;
      redraw();
    };
    img.src = photo.previewUrl;

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', moveDraw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    document.getElementById('drawCloseBtn').addEventListener('click', closeModal);
    document.getElementById('drawCancelBtn').addEventListener('click', closeModal);
    document.getElementById('drawUndoBtn').addEventListener('click', function(){
      strokes.pop();
      redraw();
    });
    document.getElementById('drawDoneBtn').addEventListener('click', function(){
      canvas.toBlob(function(blob){
        if(!blob){ showToast('Could not save the edit \u2014 try again'); return; }
        var newUrl = URL.createObjectURL(blob);
        state.bookPhotos[photoIdx].blob = blob;
        state.bookPhotos[photoIdx].previewUrl = newUrl;
        closeModal();
        render();
        showToast('Photo updated');
      }, 'image/jpeg', 0.85);
    });
  }

      state.processing = true;
      render();
      try{
        var slice = files.slice(0, 50 - state.bookPhotos.length);
        var blobs = await Promise.all(slice.map(function(f){ return resizeImageToBlob(f, 900); }));
        var withPreview = blobs.map(function(b){ return { blob: b, previewUrl: URL.createObjectURL(b), shopVal: '', sizeVal: '' }; });
        state.bookPhotos = state.bookPhotos.concat(withPreview).slice(0,50);

      render();

    document.querySelectorAll('.photo-remove').forEach(function(btn){

      var name = (state.nameVal || '').trim();

      var courier = (state.courierVal || '').trim();
      if(state.bookPhotos.length === 0){ state.bookError = 'Add at least one photo'; render(); return; }
      if(!name){ state.bookError = 'Enter reseller name'; render(); return; }
      if(!address){ state.bookError = 'Enter delivery address'; render(); return; }
      state.bookError = '';
      state.saving = true;
      render();
      try{
        var newOrder = await saveOrder(name, courier, address, state.bookPhotos);

  // ===== BY SHOP TAB =====

  function getShopSummary(mode){
    var byShop = {};
    state.orders.forEach(function(o){
      (o.items||[]).forEach(function(item, idx){
        if(!item.shop_name) return;
        var include = false;
        if(mode === 'need'){
          include = (o.status !== 'cancelled') && !item.shop_booked_at;
        }else if(mode === 'pending'){
          include = (o.status !== 'cancelled') && !!item.shop_booked_at && item.status === 'pending';
        }else{
          include = true;
        }
        if(!include) return;
        var key = item.shop_name;
        if(!byShop[key]) byShop[key] = [];
        byShop[key].push({ order: o, item: item, itemIndex: idx });
      });
    });
    return byShop;
  }

  function renderShopsTab(){
    var mode = state.shopBookingView || 'need';
    var byShop = getShopSummary(mode);
    var query = (state.shopBookingQuery || '').trim().toLowerCase();
    var html = '';

    html += '<input class="searchbar" type="text" id="shopBookingSearch" autocomplete="off" placeholder="Search shop, order id, or reseller" value="' + esc(state.shopBookingQuery || '') + '">';

    html += '<div class="filters">';
    html += '<div class="filter-chip' + (mode==='need'?' active':'') + '" data-view="need">Need to book</div>';
    html += '<div class="filter-chip' + (mode==='pending'?' active':'') + '" data-view="pending">Pending</div>';
    html += '<div class="filter-chip' + (mode==='all'?' active':'') + '" data-view="all">All</div>';
    html += '</div>';

    if(mode === 'need'){
      html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Pieces still waiting to be forwarded to each shop.</p>';
    }else if(mode === 'pending'){
      html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Already booked with the shop, waiting for them to provide the piece. This clears automatically once the order is shipped.</p>';
    }else{
      html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">Full record of everything ever tagged to a shop \u2014 including shipped and cancelled.</p>';
    }

    if(query){
      var filtered = {};
      Object.keys(byShop).forEach(function(shop){
        var matchingEntries = byShop[shop].filter(function(entry){
          var pieceId = (entry.order.id + '-' + (entry.itemIndex+1)).toLowerCase();
          var hay = (shop + ' ' + pieceId + ' ' + entry.order.id + ' ' + entry.order.reseller_name).toLowerCase();
          return hay.indexOf(query) !== -1;
        });
        if(matchingEntries.length > 0) filtered[shop] = matchingEntries;
      });
      byShop = filtered;
    }

    var shopKeys = Object.keys(byShop).sort();

    if(shopKeys.length === 0){
      html += '<div class="empty-state">' + (query ? 'No matches for that search.' : 'Nothing here right now.') + '</div>';
      return html;
    }

    var statusLabel = { pending: 'Pending', shipped: 'Shipped', cancelled: 'Cancelled' };
    var statusClass = { pending: 'status-pending', shipped: 'status-shipped', cancelled: 'status-cancelled' };

    shopKeys.forEach(function(shop){
      var entries = byShop[shop];
      html += '<div class="shop-row">';
      html += '<div class="shop-row-header">';
      html += '<span class="shop-row-name">' + esc(shop) + '</span>';
      html += '<span class="shop-row-count">' + entries.length + ' piece' + (entries.length!==1?'s':'') + '</span>';
      if(mode === 'need'){
        html += '<button class="btn-whatsapp shop-share-btn" data-shop="' + esc(shop) + '">Share to WhatsApp</button>';
      }
      html += '</div>';
      html += '<div class="shop-row-tray">';
      entries.forEach(function(entry){
        var pieceId = entry.order.id + '-' + (entry.itemIndex+1);
        var st = entry.order.status === 'cancelled' ? 'cancelled' : entry.item.status;
        html += '<div class="shop-tray-item">';
        html += '<img class="orderPhoto" data-src="' + entry.item.photo_url + '" src="' + (entry.item.thumb_url || entry.item.photo_url) + '" loading="lazy" decoding="async">';
        if(mode === 'all'){
          html += '<span style="position:absolute;top:4px;right:4px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,0.8);color:#fff;">' + statusLabel[st] + '</span>';
        }
        html += '<div class="shop-tray-caption">#' + esc(pieceId) + ' \u00b7 ' + esc(entry.order.reseller_name) + '</div>';
        html += '</div>';
      });
      html += '</div></div>';
    });

    return html;
  }

  async function shareShopToWhatsApp(shopName, btn){
    var byShop = getShopSummary('need');
    var entries = byShop[shopName] || [];
    if(entries.length === 0) return;

    var batch = entries.slice(0, 10);

    if(!navigator.share){
      showToast('Sharing isn\u2019t supported on this browser \u2014 try on your phone');
      return;
    }

    var originalText = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparing...'; }

    try{
      var files = await Promise.all(batch.map(async function(entry){
        var res = await fetch(entry.item.photo_url);
        var blob = await res.blob();
        var pieceId = entry.order.id + '-' + (entry.itemIndex+1);
        return new File([blob], shopName + '_' + pieceId + '.jpg', { type: 'image/jpeg' });
      }));

      var shareData = { files: files, text: shopName };
      if(navigator.canShare && !navigator.canShare(shareData)){
        showToast('Your phone can\u2019t share this many photos at once \u2014 try fewer');
        if(btn){ btn.disabled = false; btn.textContent = originalText; }
        return;
      }

      await navigator.share(shareData);
      openShareConfirm(shopName, batch);
    }catch(err){
      if(err && err.name === 'AbortError'){
        // user cancelled the share sheet, nothing to do
      }else{
        showToast('Could not prepare photos: ' + (err && err.message ? err.message : 'try again'));
      }
    }
    if(btn){ btn.disabled = false; btn.textContent = originalText; }
  }

  function openShareConfirm(shopName, batch){
    document.getElementById('modalHost').innerHTML =
      '<div class="modal-overlay"><div class="modal-box">' +
        '<p style="font-size:14px;margin:0;">Did you send these ' + batch.length + ' photo' + (batch.length!==1?'s':'') + ' to <b>' + esc(shopName) + '</b>\u2019s WhatsApp group?</p>' +
        '<div class="modal-actions">' +
          '<button id="shareNoBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">No, didn\u2019t send</button>' +
          '<button id="shareYesBtn" style="background:#34a853;color:#06210f;border:none;">Yes, sent</button>' +
        '</div></div></div>';
    document.getElementById('shareNoBtn').addEventListener('click', closeModal);
    document.getElementById('shareYesBtn').addEventListener('click', function(){
      var ids = batch.map(function(entry){ return entry.item.id; });
      var nowIso = new Date().toISOString();
      // Update screen instantly; sync to database in background
      batch.forEach(function(entry){
        entry.item.shop_booked_at = nowIso;
        entry.item.shop_booked_by = state.session.user.id;
      });
      closeModal();
      showToast('Marked as booked with ' + shopName);
      render();
      sb.from('order_items').update({
        shop_booked_at: nowIso,
        shop_booked_by: state.session.user.id
      }).in('id', ids).then(function(res){
        if(res.error){
          showToast('Warning: booking status did not save: ' + res.error.message);
          loadOrders();
        }
      });
    });
  }

  // ===== APP SHELL / RENDER =====

  function render(){
    var appEl = document.getElementById('app');
    if(!state.session){
      appEl.innerHTML = renderLogin();
      wireLogin();
      return;
    }

    var pendingCount = state.orders.filter(function(o){ var ds = orderDisplayStatus(o); return ds === 'pending' || ds === 'partial'; }).length;

    var shellHtml = '<div class="brand-wrap"><div class="menu-row no-print"><button class="menu-btn" id="sidebarOpenBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#e8eaed" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button></div><div class="app-brand" id="logoReloadBtn" style="cursor:pointer;">GURUKRUPA</div><div class="app-brand-sub">SAREES</div></div>';
    shellHtml += '<div class="tabs no-print">';
    shellHtml += '<div class="tab-btn' + (state.tab==='book'?' active':'') + '" id="tabBtnBook"><span class="tab-icon">\ud83d\udcf8</span>Book Orders</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='orders'?' active':'') + '" id="tabBtnOrders"><span class="tab-icon">\ud83d\udccb</span>Orders List' + (pendingCount>0 ? '<span class="badge">'+pendingCount+'</span>' : '') + '</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='ship'?' active':'') + '" id="tabBtnShip"><span class="tab-icon">\ud83d\udce6</span>Ship Album</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='shops'?' active':'') + '" id="tabBtnShops"><span class="tab-icon">\ud83c\udfea</span>Shop Booking</div>';
    shellHtml += '<div class="tab-btn' + (state.tab==='tracking'?' active':'') + '" id="tabBtnTracking"><span class="tab-icon">\ud83d\udccd</span>Tracking</div>';
    shellHtml += '</div><div id="tabContent"></div>';
    shellHtml += '<div class="sidebar-overlay" id="sidebarOverlay"></div>';
    shellHtml += '<div class="sidebar-panel" id="sidebarPanel">';
    shellHtml += '<div class="sidebar-top-row"><button class="sidebar-close" id="sidebarCloseBtn">\u00d7</button></div>';
    shellHtml += '<div class="sidebar-identity"><div class="user-avatar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#f2a76a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path></svg></div><span>' + esc(currentUserLabel()) + '</span></div>';
    shellHtml += '<button id="manageListsBtn">Manage Lists</button>';
    shellHtml += '<button id="logoutBtn">Sign out</button>';
    shellHtml += '</div>';

    appEl.innerHTML = shellHtml;
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('manageListsBtn').addEventListener('click', function(){
      closeSidebar();
      openManageLists();
    });
    document.getElementById('tabBtnBook').addEventListener('click', function(){ state.tab='book'; render(); });
    document.getElementById('tabBtnOrders').addEventListener('click', function(){ state.tab='orders'; render(); });
    document.getElementById('tabBtnShip').addEventListener('click', function(){ state.tab='ship'; render(); });
    document.getElementById('tabBtnShops').addEventListener('click', function(){ state.tab='shops'; render(); });
    document.getElementById('tabBtnTracking').addEventListener('click', function(){ state.tab='tracking'; render(); });

    function openSidebar(){
      document.getElementById('sidebarOverlay').classList.add('open');
      document.getElementById('sidebarPanel').classList.add('open');
    }
    function closeSidebar(){
      document.getElementById('sidebarOverlay').classList.remove('open');
      document.getElementById('sidebarPanel').classList.remove('open');
    }
    document.getElementById('sidebarOpenBtn').addEventListener('click', openSidebar);
    document.getElementById('logoReloadBtn').addEventListener('click', function(){ window.location.reload(); });
    document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    var content = document.getElementById('tabContent');
    if(state.tab === 'book'){ prefetchOrderId(); content.innerHTML = renderBookTab(); wireBookTab(); }
    else if(state.tab === 'orders'){ content.innerHTML = renderOrdersTab(); wireOrdersTab(); }
    else if(state.tab === 'ship'){ content.innerHTML = renderShipTab(); wireShipTab(); }
    else if(state.tab === 'shops'){ content.innerHTML = renderShopsTab(); wireShopsTab(); }
    else if(state.tab === 'tracking'){ content.innerHTML = renderTrackingTab(); wireTrackingTab(); }
  }

  initAuth();
})();
</script>
</body>
</html>
