    html += '<div class="field"><label>New password</label><input type="password" id="myNewPasswordInput" placeholder="At least 6 characters"></div>';
    html += '<div id="myPwError" class="error-text" style="display:none;"></div>';
    html += '<div class="modal-actions"><button id="myPwCancelBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Cancel</button><button id="myPwSaveBtn" style="background:#d97a3f;color:#fff;border:none;">Save</button></div>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    var inp = document.getElementById('myNewPasswordInput');
    inp.focus();
    document.getElementById('myPwCancelBtn').addEventListener('click', closeModal);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') document.getElementById('myPwSaveBtn').click(); });
    document.getElementById('myPwSaveBtn').addEventListener('click', async function(){
      var pw = (inp.value || '').trim();
      var errEl = document.getElementById('myPwError');
      if(pw.length < 6){ errEl.textContent = 'Password must be at least 6 characters'; errEl.style.display = 'block'; return; }
      errEl.style.display = 'none';
      this.disabled = true; this.textContent = 'Saving...';
      try{
        var { error } = await sb.auth.updateUser({ password: pw });
        if(error) throw error;
        closeModal();
        showToast('Password updated');
      }catch(e){
        errEl.textContent = e && e.message ? e.message : 'Could not update password';
        errEl.style.display = 'block';
        this.disabled = false; this.textContent = 'Save';
      }
    });
  }

  // ===== HANDOVER MODE =====
  // For the moment Rajan needs to hand his phone to someone at a shop just to
  // confirm what's pending for THAT shop. This locks the screen to a single
  // shop's pending list — read-only, no other shops, no other tabs, nothing
  // else in the app reachable — and getting back out requires Rajan's PIN.
  // This is a software-only lock; it does not replace the phone's own
  // biometric screen lock, and Rajan should also use the phone's built-in
  // "Guided Access" (iPhone) or "Screen pinning" (Android) at the same
  // moment, since only the OS can stop someone leaving the browser entirely
  // — see the note shown when Handover Mode turns on.

  async function hashPin(pin){
    var enc = new TextEncoder().encode(pin + ':gurukrupa-handover-v1');
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join('');
  }

  async function setupHandoverPin(pin){
    if(!/^\d{4,6}$/.test(pin)){ showToast('PIN must be 4\u20136 digits'); return false; }
    try{
      var hash = await hashPin(pin);
      var { error } = await sb.from('profiles').update({ handover_pin_hash: hash }).eq('id', state.session.user.id);
      if(error) throw error;
      state.myHandoverPinHash = hash;
      return true;
    }catch(e){
      showToast('Could not save PIN: ' + (e && e.message ? e.message : 'try again'));
      return false;
    }
  }

  // ===== TAB PASSCODE GATE (Ship Album / Tracking, restricted accounts only) =====
  // Reuses the same passcode Rajan already set for Handover Mode — one PIN
  // for both purposes. Only restricted staff accounts are gated; Soham and
  // Bhagyasree (unrestricted) open every tab normally.
  function tabRequiresPinGate(key){
    return !!state.myAllowedTabs && (key === 'ship' || key === 'tracking');
  }

  // In-app PIN-setup modal — replaces window.prompt(), which is a blocking
  // native browser dialog that can freeze the page (and behaves poorly or
  // is unsupported in some mobile/PWA/embedded contexts). This keeps setup
  // consistent with every other input in the app.
  function openSetupPinModal(message, onSuccess){
    var html = '<div class="modal-overlay"><div class="modal-box" style="max-width:320px;text-align:center;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 8px;">Set up a passcode</p>';
    html += '<p style="font-size:12.5px;color:#9aa0a6;margin:0 0 14px;">' + esc(message) + '</p>';
    html += '<input type="text" class="pin-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" id="setupPinInput" placeholder="4\u20136 digits" style="text-align:center;font-size:20px;letter-spacing:6px;">';
    html += '<div id="setupPinError" class="error-text" style="display:none;margin-top:8px;"></div>';
    html += '<div class="modal-actions"><button id="setupPinCancelBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Cancel</button><button id="setupPinSaveBtn" style="background:#d97a3f;color:#fff;border:none;">Save</button></div>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    var inp = document.getElementById('setupPinInput');
    inp.focus();
    document.getElementById('setupPinCancelBtn').addEventListener('click', closeModal);
    async function attempt(){
      var pin = (inp.value || '').trim();
      var errEl = document.getElementById('setupPinError');
      if(!/^\d{4,6}$/.test(pin)){
        errEl.textContent = 'Enter 4\u20136 digits';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      var btn = document.getElementById('setupPinSaveBtn');
      btn.disabled = true; btn.textContent = 'Saving...';
      var ok = await setupHandoverPin(pin);
      if(ok){
        closeModal();
        onSuccess();
      }else{
        btn.disabled = false; btn.textContent = 'Save';
      }
    }
    document.getElementById('setupPinSaveBtn').addEventListener('click', attempt);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') attempt(); });
  }

  function openTabPinGateModal(tabKey){
    if(!state.myHandoverPinHash){
      openSetupPinModal('You\u2019ll need this passcode each time to open this tab.', function(){ openTabPinGateModal(tabKey); });
      return;
    }
    var html = '<div class="modal-overlay"><div class="modal-box" style="max-width:300px;text-align:center;">';
    html += '<p style="font-size:15px;font-weight:700;margin:0 0 12px;">Enter passcode</p>';
    html += '<input type="text" class="pin-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" id="tabPinInput" placeholder="\u2022 \u2022 \u2022 \u2022" style="text-align:center;font-size:20px;letter-spacing:6px;">';
    html += '<div id="tabPinError" class="error-text" style="display:none;margin-top:8px;"></div>';
    html += '<div class="modal-actions"><button id="tabPinCancelBtn" style="background:#28292c;border:1px solid #3c4043;color:#e8eaed;">Cancel</button><button id="tabPinUnlockBtn" style="background:#d97a3f;color:#fff;border:none;">Unlock</button></div>';
    html += '</div></div>';
    document.getElementById('modalHost').innerHTML = html;
    var inp = document.getElementById('tabPinInput');
    inp.focus();
    document.getElementById('tabPinCancelBtn').addEventListener('click', closeModal);
    async function attempt(){
      var pin = (inp.value || '').trim();
      if(!pin) return;
      var hash = await hashPin(pin);
      if(hash === state.myHandoverPinHash){
        closeModal();
        state.tab = tabKey;
        render();
      }else{
        var errEl = document.getElementById('tabPinError');
        errEl.textContent = 'Wrong passcode';
        errEl.style.display = 'block';
        inp.value = '';
        inp.focus();
      }
    }
    document.getElementById('tabPinUnlockBtn').addEventListener('click', attempt);
    inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') attempt(); });
  }

  function enterHandoverMode(shopName){
    if(!state.myHandoverPinHash){
      openSetupPinModal('You\u2019ll need this passcode to exit handover mode later.', function(){ reallyEnterHandoverMode(shopName); });
      return;
    }
    reallyEnterHandoverMode(shopName);
  }

  function reallyEnterHandoverMode(shopName){
    state.handover = { active: true, shop: shopName, unlockInput: '', unlockError: '', showUnlockInput: false };
    render();
    showToast('Locked to ' + shopName + ' \u2014 now turn on Guided Access / Screen Pinning on this phone too');
  }

  async function tryUnlockHandover(pin){
    var hash = await hashPin(pin);
    if(hash === state.myHandoverPinHash){
      state.handover = { active: false, shop: null, unlockInput: '', unlockError: '', showUnlockInput: false };
      render();
    }else{
      state.handover.unlockError = 'Wrong PIN';
      render();
    }
  }

  function renderHandoverLockedView(){
    var shopName = state.handover.shop;
    var rows = [];
    state.orders.forEach(function(o){
      if(o.status === 'cancelled') return;
      (o.items||[]).forEach(function(it){
        if((it.shop_name || 'Name Pending') === shopName && !it.purchased){ rows.push({ order: o, item: it }); }
      });
    });
    var html = '<div style="min-height:92vh;display:flex;flex-direction:column;padding:16px;">';
    html += '<div style="text-align:center;padding:20px 0 16px;">';
    html += '<div style="font-size:12.5px;color:#9aa0a6;">Pending pickup for</div>';
    html += '<div style="font-size:22px;font-weight:800;color:#f2a76a;">' + esc(shopName) + '</div>';
    html += '</div>';
    if(rows.length === 0){
      html += '<div class="empty-state">Nothing pending here.</div>';
    }
    html += '<div class="purchase-album">';
    rows.forEach(function(r){
      var it = r.item;
      html += '<div class="purchase-tile">';
      html += '<button class="album-zoom-btn handoverZoomBtn" data-src="' + it.photo_url + '" aria-label="View full size"><svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"></circle><line x1="15.5" y1="15.5" x2="21" y2="21"></line></svg></button>';
      html += '<img src="' + (it.thumb_url || it.photo_url) + '" loading="lazy" decoding="async">';
      html += '<div class="purchase-tile-badge" style="background:rgba(0,0,0,0.6);color:#e8eaed;">Pending</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div style="margin-top:auto;padding-top:24px;text-align:center;">';
    if(!state.handover.showUnlockInput){
      html += '<button class="btn-secondary" id="handoverRevealUnlockBtn" style="width:44px;height:44px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;" aria-label="Unlock"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></button>';
    }else{
      html += '<div style="font-size:11.5px;color:#5f6368;margin-bottom:10px;">Rajan\u2019s PIN to unlock</div>';
      html += '<input type="text" class="pin-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" maxlength="6" id="handoverUnlockInput" placeholder="\u2022 \u2022 \u2022 \u2022" style="text-align:center;font-size:20px;letter-spacing:6px;width:160px;">';
      if(state.handover.unlockError){ html += '<div class="error-text" style="margin-top:8px;">' + esc(state.handover.unlockError) + '</div>'; }
      html += '<br><button class="btn-primary" id="handoverUnlockBtn" style="width:auto;padding:11px 28px;margin-top:12px;">Unlock</button>';
    }
    html += '</div></div>';
    return html;
  }

  function wireHandoverLockedView(){
    document.querySelectorAll('.handoverZoomBtn').forEach(function(btn){
      btn.addEventListener('click', function(){ openZoom(btn.getAttribute('data-src')); });
    });
    var revealBtn = document.getElementById('handoverRevealUnlockBtn');
    if(revealBtn) revealBtn.addEventListener('click', function(){
      state.handover.showUnlockInput = true;
      render();
    });
    var inp = document.getElementById('handoverUnlockInput');
    var btn = document.getElementById('handoverUnlockBtn');
    function attempt(){ if(inp && inp.value.trim()) tryUnlockHandover(inp.value.trim()); }
    if(btn) btn.addEventListener('click', attempt);
    if(inp){ inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') attempt(); }); inp.focus(); }
  }

  function render(){
    var appEl = document.getElementById('app');
    if(state.passwordRecoveryMode){
      appEl.innerHTML = renderPasswordRecoveryScreen();
      wirePasswordRecoveryScreen();
      return;
    }
    if(!state.session){
      appEl.innerHTML = renderLogin();
      wireLogin();
      return;
    }
    if(state.handover && state.handover.active){
      appEl.innerHTML = renderHandoverLockedView();
      wireHandoverLockedView();
      return;
    }
    refreshGlobalDatalists();

    var pendingCount = state.orders.filter(function(o){ var ds = orderDisplayStatus(o); return ds === 'pending' || ds === 'partial'; }).length;

    var shellHtml = '<div class="brand-wrap"><div class="menu-row no-print"><button class="menu-btn" id="sidebarOpenBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#e8eaed" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button></div>';
    if(isReseller()){
      var unreadCount = state.resellerNotifications.filter(function(n){ return !n.read_at; }).length;
      shellHtml += '<div class="notif-row no-print"><button class="notif-btn" id="notifBellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="#e8eaed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>' + (unreadCount > 0 ? '<span class="notif-badge">' + (unreadCount > 9 ? '9+' : unreadCount) + '</span>' : '') + '</button></div>';
    }
    shellHtml += '<div class="app-brand" id="logoReloadBtn" style="cursor:pointer;">GURUKRUPA</div><div class="app-brand-sub">SAREES</div></div>';
    shellHtml += '<div class="tabs no-print">';
    if(isReseller()){
      shellHtml += '<div class="tab-btn' + (state.tab==='book'?' active':'') + '" data-tab="book"><span class="tab-icon">\ud83d\udcf8</span>Book Order</div>';
      shellHtml += '<div class="tab-btn' + (state.tab==='orders'?' active':'') + '" data-tab="orders"><span class="tab-icon">\ud83d\udccb</span>My Orders' + (pendingCount>0 ? '<span class="badge">'+pendingCount+'</span>' : '') + '</div>';
      shellHtml += '<div class="tab-btn' + (state.tab==='rtrack'?' active':'') + '" data-tab="rtrack"><span class="tab-icon">\ud83d\udccd</span>Tracking</div>';
      shellHtml += '<div class="tab-btn' + (state.tab==='rbill'?' active':'') + '" data-tab="rbill"><span class="tab-icon">\ud83e\uddfe</span>Billing</div>';
    }else{
      var myTabs = myAllowedStaffTabs();
      myTabs.forEach(function(t){
        var badgeHtml = (t.badge && pendingCount > 0) ? '<span class="badge">'+pendingCount+'</span>' : '';
        shellHtml += '<div class="tab-btn' + (state.tab===t.key?' active':'') + '" data-tab="' + t.key + '"><span class="tab-icon">' + t.icon + '</span>' + esc(t.label) + badgeHtml + '</div>';
      });
    }
    shellHtml += '</div><div id="tabContent"></div>';
    shellHtml += '<div class="sidebar-overlay" id="sidebarOverlay"></div>';
    shellHtml += '<div class="sidebar-panel" id="sidebarPanel">';
    shellHtml += '<div class="sidebar-top-row"><button class="sidebar-close" id="sidebarCloseBtn">\u00d7</button></div>';
    shellHtml += '<div class="sidebar-identity"><div class="user-avatar-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#f2a76a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7"></path></svg></div><span>' + esc(isReseller() ? state.myResellerName : (state.myDisplayName || currentUserLabel())) + '</span></div>';
    if(isAdminStaff()){
      shellHtml += '<button id="manageListsBtn">Manage Lists</button>';
      shellHtml += '<button id="printHistoryBtn">Print History</button>';
      shellHtml += '<button id="billingBtn">Billing</button>';
      shellHtml += '<button id="purchaseLedgerBtn">Purchase Ledger</button>';
      if(isSuperAdmin()){
        shellHtml += '<button id="staffAlertsBtn">\u26a0\ufe0f Staff Alerts</button>';
        shellHtml += '<button id="staffPasswordsBtn">\ud83d\udd11 Staff Passwords</button>';
        shellHtml += '<button id="changeMyPasswordBtn">\ud83d\udd10 Change My Password</button>';
        if(!state.accountSwitch){ shellHtml += '<button id="switchAccountBtn">\ud83d\udd00 Switch account</button>'; }
      }else{
        shellHtml += '<button id="rajanDelayBtn">\ud83d\ude9a Pickup Delays</button>';
      }
    }
    shellHtml += '<button id="logoutBtn">Sign out</button>';
    shellHtml += '</div>';
    if(state.accountSwitch){
      shellHtml = '<div style="position:sticky;top:0;z-index:30;background:#3a2a12;border-bottom:2px solid #d97a3f;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:#f2a76a;">' +
        '<span>\ud83d\udd00 Switched to ' + esc(state.accountSwitch.label) + '</span>' +
        '<button id="exitSwitchBtn" style="background:#d97a3f;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;flex-shrink:0;">Exit switch</button>' +
        '</div>' + shellHtml;
    }

    appEl.innerHTML = shellHtml;
    document.getElementById('logoutBtn').addEventListener('click', logout);
    var manageBtn = document.getElementById('manageListsBtn');
    if(manageBtn) manageBtn.addEventListener('click', function(){
      closeSidebar();
      openManageLists();
    });
    var printHistBtn = document.getElementById('printHistoryBtn');
    if(printHistBtn) printHistBtn.addEventListener('click', function(){
      closeSidebar();
      state.tab = 'printhistory';
      render();
    });
    var billingBtn = document.getElementById('billingBtn');
    if(billingBtn) billingBtn.addEventListener('click', function(){
      closeSidebar();
      state.tab = 'billing';
      render();
    });
    var ledgerBtn = document.getElementById('purchaseLedgerBtn');
    if(ledgerBtn) ledgerBtn.addEventListener('click', function(){
      closeSidebar();
      state.tab = 'purchaseledger';
      render();
    });
    var alertsBtn = document.getElementById('staffAlertsBtn');
    if(alertsBtn) alertsBtn.addEventListener('click', function(){
      closeSidebar();
      var alerts = computeStaffAlerts();
      openStaffAlertsModal(alerts, alerts.length + ' thing' + (alerts.length!==1?'s':'') + ' worth a look');
    });
    var rajanDelayBtn = document.getElementById('rajanDelayBtn');
    if(rajanDelayBtn) rajanDelayBtn.addEventListener('click', function(){
      closeSidebar();
      var alerts = computeRajanDelayAlerts();
      openStaffAlertsModal(alerts, alerts.length > 0 ? 'Rajan is running behind on ' + alerts.length + ' piece' + (alerts.length!==1?'s':'') : '');
    });
    var staffPasswordsBtn = document.getElementById('staffPasswordsBtn');
    if(staffPasswordsBtn) staffPasswordsBtn.addEventListener('click', function(){
      closeSidebar();
      openStaffPasswordsModal();
    });
    var changeMyPasswordBtn = document.getElementById('changeMyPasswordBtn');
    if(changeMyPasswordBtn) changeMyPasswordBtn.addEventListener('click', function(){
      closeSidebar();
      openChangeMyPasswordModal();
    });
    var switchAccountBtn = document.getElementById('switchAccountBtn');
    if(switchAccountBtn) switchAccountBtn.addEventListener('click', function(){
      closeSidebar();
      openSwitchAccountModal();
    });
    var exitSwitchBtn = document.getElementById('exitSwitchBtn');
    if(exitSwitchBtn) exitSwitchBtn.addEventListener('click', exitAccountSwitch);
    document.querySelectorAll('.tab-btn[data-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var key = btn.getAttribute('data-tab');
        if(tabRequiresPinGate(key)){ openTabPinGateModal(key); return; }
        state.tab = key;
        render();
      });
    });

    function openSidebar(){
      document.getElementById('sidebarOverlay').classList.add('open');
      document.getElementById('sidebarPanel').classList.add('open');
    }
    function closeSidebar(){
      document.getElementById('sidebarOverlay').classList.remove('open');
      document.getElementById('sidebarPanel').classList.remove('open');
    }
    document.getElementById('sidebarOpenBtn').addEventListener('click', openSidebar);
    document.getElementById('logoReloadBtn').addEventListener('click', function(){ window.location.reload(); });
    var notifBtn = document.getElementById('notifBellBtn');
    if(notifBtn) notifBtn.addEventListener('click', openResellerNotifications);
    document.getElementById('sidebarCloseBtn').addEventListener('click', closeSidebar);
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

    var content = document.getElementById('tabContent');

    // Enforce access here too, not just by hiding buttons — this is the
    // real boundary. A restricted staff account can never render a tab
    // outside its allowed list, no matter how state.tab got set.
    if(!isReseller() && (state.myRole === 'staff' || state.myRole === 'admin')){
      var STAFF_ONLY_TABS = ['printhistory', 'billing', 'purchaseledger'];
      var wantsAdminTab = STAFF_ONLY_TABS.indexOf(state.tab) !== -1;
      var wantsStaffTab = STAFF_TAB_CONFIG.some(function(t){ return t.key === state.tab; });
      if((wantsAdminTab && !isAdminStaff()) || (wantsStaffTab && !staffTabAllowed(state.tab)) || (!wantsAdminTab && !wantsStaffTab)){
        var fallback = myAllowedStaffTabs()[0];
        state.tab = fallback ? fallback.key : 'book';
      }
    }

    var isTabSwitch = (state.tab !== lastRenderedTab);
    lastRenderedTab = state.tab;
    try{
      if(state.tab === 'book'){ content.innerHTML = renderBookTab(); wireBookTab(); }
      else if(state.tab === 'orders'){ content.innerHTML = renderOrdersTab(); wireOrdersTab(); }
      else if(state.tab === 'rtrack'){ content.innerHTML = renderResellerTrackTab(); wireResellerTrackTab(); }
      else if(state.tab === 'rbill'){ content.innerHTML = renderResellerBillTab(); wireResellerBillTab(); }
      else if(isReseller()){ state.tab = 'book'; content.innerHTML = renderBookTab(); wireBookTab(); }
      else if(state.tab === 'ship'){ content.innerHTML = renderShipTab(); wireShipTab(); }
      else if(state.tab === 'shops'){ content.innerHTML = renderShopsTab(); wireShopsTab(); }
      else if(state.tab === 'tracking'){ content.innerHTML = renderTrackingTab(); wireTrackingTab(); if(state.scanMode.active) focusScanInput(); }
      else if(state.tab === 'purchase'){ content.innerHTML = renderPurchaseTab(); wirePurchaseTab(); }
      else if(state.tab === 'printhistory'){ content.innerHTML = renderPrintHistoryTab(); wirePrintHistoryTab(); loadPrintHistoryIfNeeded(); }
      else if(state.tab === 'billing'){ content.innerHTML = renderBillingTab(); wireBillingTab(); }
      else if(state.tab === 'purchaseledger'){ content.innerHTML = renderPurchaseLedgerTab(); wirePurchaseLedgerTab(); }
    }catch(e){
      content.innerHTML = '<div class="empty-state" style="color:#f28b82;">Something went wrong showing this screen.<br><span style="font-size:11px;color:#9aa0a6;">' + esc(e && e.message ? e.message : String(e)) + '</span><br><br><button class="btn-secondary" onclick="window.location.reload()">Reload page</button></div>';
      console.error('Render error on tab', state.tab, e);
    }
    if(isTabSwitch){
      // Restart the fade-in animation only when we've actually switched tabs —
      // not on every re-render within the same tab (e.g. typing in search).
      content.classList.remove('tab-fade');
      void content.offsetWidth; // force reflow so the animation restarts
      content.classList.add('tab-fade');
    }
  }

  initAuth();
})();
</script>
</body>
